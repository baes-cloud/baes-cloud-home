<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="hub" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="780" rx="24" fill="#0f172a"/>

  <!-- title -->
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#f8fafc">A home that mostly runs itself</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#94a3b8">one free, open-source brain · any brand · cheap DIY parts · hand-me-down hardware · no ecosystem lock-in</text>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M370 205 C 470 205, 470 330, 500 345"/>
    <path d="M370 405 L 480 405"/>
    <path d="M370 605 C 470 605, 470 480, 500 465"/>
    <path d="M830 205 C 730 205, 730 330, 700 345"/>
    <path d="M830 405 L 720 405"/>
    <path d="M830 605 C 730 605, 730 480, 700 465"/>
  </g>

  <!-- hub -->
  <g filter="url(#soft)">
    <circle cx="600" cy="405" r="128" fill="url(#hub)"/>
  </g>
  <text x="600" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#ccfbf1" letter-spacing="2">THE BRAIN</text>
  <text x="600" y="398" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">Home Assistant</text>
  <text x="600" y="426" text-anchor="middle" font-size="15" fill="#f0fdfa">free &amp; open-source software</text>
  <text x="600" y="448" text-anchor="middle" font-size="15" fill="#f0fdfa">on a ~$100 Raspberry Pi</text>
  <text x="600" y="470" text-anchor="middle" font-size="15" fill="#f0fdfa">in my home, not a company's cloud</text>

  <!-- card helper: each card = rect + accent bar + heading + 4 lines -->
  <!-- left column -->
  <g filter="url(#soft)">
    <rect x="40" y="130" width="330" height="150" rx="16" fill="#1e293b"/>
    <rect x="40" y="130" width="330" height="8" rx="4" fill="#2dd4bf"/>
  </g>
  <text x="62" y="170" font-size="19" font-weight="700" fill="#2dd4bf">DIY for a few dollars</text>
  <text x="62" y="198" font-size="15" fill="#e2e8f0">ESP32 boards (~$5–10) + radar (~$15)</text>
  <text x="62" y="220" font-size="15" fill="#e2e8f0">see which room I'm in, even sitting still</text>
  <text x="62" y="242" font-size="15" fill="#e2e8f0">two round knob screens I built</text>
  <text x="62" y="264" font-size="15" fill="#94a3b8">all flashed with free ESPHome</text>

  <g filter="url(#soft)">
    <rect x="40" y="330" width="330" height="150" rx="16" fill="#1e293b"/>
    <rect x="40" y="330" width="330" height="8" rx="4" fill="#84cc16"/>
  </g>
  <text x="62" y="370" font-size="19" font-weight="700" fill="#a3e635">Hand-me-downs &amp; e-waste</text>
  <text x="62" y="398" font-size="15" fill="#e2e8f0">old Raspberry Pi 400 = wall calendar</text>
  <text x="62" y="420" font-size="15" fill="#e2e8f0">…and the backup brain if the main dies</text>
  <text x="62" y="442" font-size="15" fill="#e2e8f0">an old laptop runs the Zigbee software</text>
  <text x="62" y="464" font-size="15" fill="#94a3b8">a 2013 mini-PC compiles the firmware</text>

  <g filter="url(#soft)">
    <rect x="40" y="530" width="330" height="150" rx="16" fill="#1e293b"/>
    <rect x="40" y="530" width="330" height="8" rx="4" fill="#60a5fa"/>
  </g>
  <text x="62" y="570" font-size="19" font-weight="700" fill="#93c5fd">Speaks every "language"</text>
  <text x="62" y="598" font-size="15" fill="#e2e8f0">Zigbee · Matter/Thread · Wi-Fi</text>
  <text x="62" y="620" font-size="15" fill="#e2e8f0">Bluetooth · infrared · Ethernet</text>
  <text x="62" y="642" font-size="15" fill="#e2e8f0">local control first; cloud only where</text>
  <text x="62" y="664" font-size="15" fill="#94a3b8">a brand gives no other choice</text>

  <!-- right column -->
  <g filter="url(#soft)">
    <rect x="830" y="130" width="330" height="150" rx="16" fill="#1e293b"/>
    <rect x="830" y="130" width="330" height="8" rx="4" fill="#f472b6"/>
  </g>
  <text x="852" y="170" font-size="19" font-weight="700" fill="#f9a8d4">Big brands, side by side</text>
  <text x="852" y="198" font-size="15" fill="#e2e8f0">IKEA · Philips Hue · Sonos · Samsung</text>
  <text x="852" y="220" font-size="15" fill="#e2e8f0">Google · Roborock · SwitchBot · WiZ</text>
  <text x="852" y="242" font-size="15" fill="#e2e8f0">Govee · Clipsal · Sensibo · and more</text>
  <text x="852" y="264" font-size="15" fill="#94a3b8">a dozen apps → one home that cooperates</text>

  <g filter="url(#soft)">
    <rect x="830" y="330" width="330" height="150" rx="16" fill="#1e293b"/>
    <rect x="830" y="330" width="330" height="8" rx="4" fill="#fbbf24"/>
  </g>
  <text x="852" y="370" font-size="19" font-weight="700" fill="#fcd34d">I barely touch it</text>
  <text x="852" y="398" font-size="15" fill="#e2e8f0">it knows where I am and what I'm doing</text>
  <text x="852" y="420" font-size="15" fill="#e2e8f0">lights, music, alarms &amp; locks just happen</text>
  <text x="852" y="442" font-size="15" fill="#e2e8f0">a remote for TV, knobs, "hey Pikachu"</text>
  <text x="852" y="464" font-size="15" fill="#94a3b8">no dashboards, alerts pop up everywhere</text>

  <g filter="url(#soft)">
    <rect x="830" y="530" width="330" height="150" rx="16" fill="#1e293b"/>
    <rect x="830" y="530" width="330" height="8" rx="4" fill="#a78bfa"/>
  </g>
  <text x="852" y="570" font-size="19" font-weight="700" fill="#c4b5fd">Private &amp; resilient</text>
  <text x="852" y="598" font-size="15" fill="#e2e8f0">runs at home; most of it works offline</text>
  <text x="852" y="620" font-size="15" fill="#e2e8f0">a standby takes over in ~5 minutes</text>
  <text x="852" y="642" font-size="15" fill="#e2e8f0">daily backups to my own NAS + cloud</text>
  <text x="852" y="664" font-size="15" fill="#94a3b8">no subscriptions required</text>

  <!-- footer -->
  <text x="600" y="738" text-anchor="middle" font-size="17" fill="#cbd5e1">Swap any brand in or out — the brain, the automations and the way I live with it stay the same.</text>
</svg>
