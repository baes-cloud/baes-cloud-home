# Template, group and 'change device type' helpers I created in the UI (exported for reference).
template_helpers:
- name: Robot vacuum active
  type: binary_sensor
  state: '{% set s = states(''vacuum.roborock_qrevo_master'') %}{% set e = states(''sensor.roborock_qrevo_master_last_clean_end'')
    | as_datetime(none) %}{% set s2 = states(''vacuum.sl68'') %}{{ s in [''cleaning'',''returning'',''paused'',''error'']
    or (s in [''docked'',''idle''] and e is not none and (now() - e).total_seconds() < 300) or s2 in [''cleaning'',''returning'',''paused'',''error'']
    or (s2 in [''docked'',''idle''] and states.vacuum.sl68 is not none and (now() - states.vacuum.sl68.last_changed).total_seconds()
    < 300) }}'
  device_class: running
- name: Sofa occupied (held)
  type: binary_sensor
  state: '{% set rmm = is_state(''binary_sensor.rmm_default_sofa_occupancy'',''on'') %}{% set lost = (states(''sensor.rmm_default_master'')
    | int(0)) == 0 %}{% set still_there = is_state(''binary_sensor.club_apollo_r_pro_1_ld2412_presence'',''on'')
    %}{{ rmm or (this.state == ''on'' and lost and still_there) }}'
  device_class: occupancy
