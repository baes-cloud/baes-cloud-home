# Helpers I created in the UI (Settings -> Helpers), exported as YAML so a rebuild can
# recreate them as a package. Add `ui_helpers: !include helpers/ui_helpers.yaml` style or paste into a package.
input_boolean:
  guest_mode:
    name: Guest Mode
    icon: mdi:account-group
  away_mode:
    name: Away Mode
    icon: mdi:home-export-outline
  override_couch_light:
    name: Override Couch Light
    icon: mdi:hand-back-left
  override_accent_lights:
    name: Override Accent Lights
    icon: mdi:hand-back-left
  override_art_pendants:
    name: Override Art Pendants
    icon: mdi:hand-back-left
  override_club_leds:
    name: Override Club Leds
    icon: mdi:hand-back-left
  departure_board_wake:
    name: Departure board wake
    icon: mdi:monitor-shimmer
  auto_stay:
    name: Auto-stay
    icon: mdi:party-popper
  tv_wash:
    name: TV Wash
    icon: mdi:television-ambient-light
  washer_done:
    name: Washer done
    icon: mdi:washing-machine-alert
  intruder_alert_active:
    name: Intruder alert active
    icon: mdi:shield-alert
  music_follows_me:
    name: Music follows me
    icon: mdi:account-music
  robots_sent_home:
    name: Robots sent home
    icon: mdi:robot-vacuum-alert
  tv_ambient:
    name: TV ambient
    icon: mdi:television-ambient-light
  light_automations:
    name: Light automations
    icon: mdi:motion-sensor
    initial: true
  tv_remote_guide:
    name: TV remote guide
    icon: mdi:remote-tv
input_number:
  tv_wash_brightness:
    name: TV Wash Brightness
    icon: mdi:brightness-6
    min: 5.0
    max: 100.0
    step: 5.0
    mode: slider
    unit_of_measurement: '%'
input_select: {}
counter:
  intercom_missed_rings:
    name: Intercom missed rings
    icon: mdi:bell-alert
    minimum: 0
    restore: true
    step: 1
    initial: 0
    maximum: null
timer: {}
