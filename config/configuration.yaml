# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Feature config lives in packages/ (one file per feature, loaded automatically):
#   front_door.yaml   lock helpers + combined door-open sensor
#   presence.yaml     binary_sensor.bae_home (GPS + BLE must agree)
#   news_digest.yaml  daily news digest pulled from the Unraid nginx container
#   work_alarms.yaml  calendar-driven Sonos work alarms + Club night sound
#   club_tv_living_room.yaml  Living Room joins the Club on TV audio + follows its volume
#   rotary_lists.yaml lists for the rotary displays
homeassistant:
  packages: !include_dir_named packages

# Zigbee runs on the external Zigbee2MQTT at <mqtt-host>, so there is no zha: block.
shell_command:
  nest_save_clip: >-
    curl -sf --create-dirs -H @/config/.nest_auth
    -o "/media/nest/{{ filename }}"
    "http://127.0.0.1:8123{{ url }}"
  nest_prune_clips: "find /media/nest -type f -mtime +30 -delete"
# pysmartthings warns about every unknown Samsung capability at each start; keep its errors only.
logger:
  default: warning
  logs:
    pysmartthings: error
    # Startup summary (stage timings, slowest integrations, "initialized in Ns"): a few lines per boot.
    homeassistant.bootstrap: info
  filters:
    # Plex advertises its public address (Remote Access); from inside the LAN that
    # route is refused (no NAT loopback), so plexapi logs it every ~2 min while HA
    # works fine over the local <nas-ip> address. Only hide that one case. 2026-10-08
    plexapi:
      - "^https://(?!10-)[0-9a-f-]+\\.[0-9a-f]+\\.plex\\.direct:32400: .*Connection refused"

# --- Recorder ----------------------------------------------------------------
# Excluded entities stay fully live (automations, RMM, radar card); only their
# history is not written. Measured 2026-10-04: these were ~85% of all writes.
recorder:
  purge_keep_days: 10

  exclude:
    entity_globs:
      # per-target geometry from every LD2450 (Apollo + both trackers).
      # These change several times a second while anyone is moving.
      - sensor.*target_*_x
      - sensor.*target_*_y
      - sensor.*target_*_z
      - sensor.*target_*_speed
      - sensor.*target_*_angle
      - sensor.*target_*_distance
      - sensor.*target_*_resolution
      - sensor.*target_*_direction
      # Added 2026-10-04: Bermuda BLE distance/RSSI streams were ~53% of all writes.
      # Live values still drive device_tracker.bermuda_*; only their history is dropped.
      - sensor.bermuda_*distance*
      - sensor.bermuda_*rssi*
      - sensor.bermuda_global_*
      # Apollo LD2412 raw distance/energy (~31% of writes). Live state still feeds
      # the RMM LD2412 automations.
      - sensor.*ld2412_*distance
      - sensor.*ld2412_*energy

    entities:
      # RMM's fused master count also updates constantly.
      - sensor.rmm_default_master
      # Club TV Cast entity rewrites itself several times a second while anything plays
      # (playback position): ~137k rows/day. Automations and remotes use its live state only.
      - media_player.the_club_tv

# ---------------------------------------------------------------------------
# DELIBERATELY still recorded (low volume, genuinely useful history):
#   binary_sensor.rmm_default_*_occupancy   <- zone presence, ~109 rows/2h
#   sensor.rmm_default_*_count              <- per-zone counts
#   sensor.*_target_count                   <- ~61 rows/2h
#   sensor.*_zone_*_target_count            <- drives your kitchen/couch rules
#   binary_sensor.*_moving_target           <- drives the sofa sleep detection
#
# Keeping these means you can still chart occupancy per room and debug why an
# automation fired -- which is the history you actually want.
# ---------------------------------------------------------------------------

# Radar Replay recorder (github.com/baes-cloud/ha-rmm-replay)
rmm_replay:
  radars:
    club_apollo_r_pro_1_ld2450:
      short: apollo
      label: Apollo R-PRO-1
      color: "#5CE1E6"
    ld2450_tracker:
      short: t1
      label: Tracker 1 (Bed/Bath)
      color: "#FF8A80"
    ld2450_tracker_2:
      short: t2
      label: Tracker 2 (Office)
      color: "#FFD166"
