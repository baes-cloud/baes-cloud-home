                  shadow_width: 0
                  border_width: 1
                  border_color: 0x33414F
                  on_click:
                    - lambda: 'id(media_is_club) = !id(media_is_club);'
                    - if: {condition: {lambda: 'return id(media_is_club);'}, then: [{script.execute: enter_media_club}], else: [{script.execute: switch_to_media}]}
