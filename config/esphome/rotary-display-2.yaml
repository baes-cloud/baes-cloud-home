                  widgets:
                    - label: {text: "TV Source", align: center, text_font: roboto_18_bold, text_color: 0xE2E8F0}
              - button:
                  id: sp_stop_all
                  align: center
                  x: 122
                  y: 40
                  width: 224
                  height: 90
                  radius: 22
                  bg_color: 0x3A1414
                  shadow_width: 0
                  border_width: 1
                  border_color: 0x6E2A2A
                  on_click:
                    # ASSUMPTION: only media_player.bedroom_sonos and media_player.club
                    # are known. Add any other Sonos speaker entity_ids here
                    # (comma-separated) if you want "Stop All" to cover them too.
                    - homeassistant.action:
                        action: media_player.media_pause
                        data: {entity_id: "media_player.bedroom_sonos,media_player.club"}
                  widgets:
                    - label: {text: "Stop All", align: center, text_font: roboto_18_bold, text_color: 0xFFDEDE}
