# --------------------------------------------------------
# LVGL — SINGLE PAGE
# --------------------------------------------------------
lvgl:
  # Night clock lives on LVGL's top layer so it is always above every page.
  top_layer:
    widgets:
      - obj:
          id: grp_night
          hidden: true
          align: center
          width: 480
          height: 480
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          widgets:
            - label:
                id: night_clock_lbl
                text: "--:--"
                align: center
                y: -26
                text_font: roboto_night
                text_color: ${night_clock_color}
            - label:
                id: night_date_lbl
                text: ""
                align: center
                y: 76
                text_font: roboto_24
                text_color: ${night_date_color}
  displays:
    - my_display
  touchscreens:
    - touch_screen
  bg_color: 0x000000
  text_color: 0xE2E8F0
  default_font: roboto_18
  theme:
    button:
      bg_color: 0x334155
      radius: 16
      shadow_width: 8
      shadow_ofs_y: 3
      shadow_opa: 35%
      shadow_color: 0x000000
    label:
      text_font: roboto_18
      text_color: 0xE2E8F0

  pages:
    - id: main_page
      pad_all: 0
      border_width: 0
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:

        # ── MAIN VALUE ARC ────────────────────────────────────────────────
        - arc:
            id: main_arc
            align: center
            width: 470
            height: 470
            min_value: 0
            max_value: 100
            value: 0
            bg_opa: 0
            arc_color: 0x0E1414
            arc_width: 15
            indicator:
              arc_color: 0x34E3D1
              arc_width: 15
            on_value:
              then:
                - if:
                    condition: {lambda: 'return id(current_mode) == 0;'}
                    then:
                      - homeassistant.action:
                          action: media_player.volume_set
                          data_template: {entity_id: "{{ ent }}", volume_level: "{{ vol }}"}
                          variables:
                            ent: !lambda 'return id(media_is_club) ? std::string("media_player.club") : std::string("media_player.bedroom_sonos");'
                            vol: !lambda 'return x / 100.0f;'
                - if:
                    condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
                    then:
                      - lambda: |-
                          if (id(selected_light_idx) == 0) id(lights_bright_bed_lamps) = x;
                          else if (id(selected_light_idx) == 1) id(lights_bright_bed_led_strip) = x;
                          else if (id(selected_light_idx) == 2) id(lights_bright_bedroom) = x;
                          else if (id(selected_light_idx) == 3) id(lights_bright_bed_wardrobe) = x;
                          else if (id(selected_light_idx) == 4) id(lights_bright_bathroom_all) = x;
                          else if (id(selected_light_idx) == 5) id(lights_bright_office_all) = x;
                          else if (id(selected_light_idx) == 6) id(lights_bright_club_all) = x;
                      - script.execute: update_light_ui
                      - script.execute: call_light_turn_on
                - if:
                    condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 2;'}
                    then:
                      - lambda: 'id(target_temp_val) = roundf((x * 14.0f / 100.0f) + 16.0f);'
                      - lvgl.label.update:
                          id: target_temp_lbl
                          text: !lambda |-
                            char buf[16];
                            snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
                            return buf;
                      - script.execute:
                          id: update_climate_temp
                          new_temp: !lambda 'return id(target_temp_val);'

        # ── HOME WHEEL (level 0) ─────────────────────────────────────────
        - obj:
            id: grp_home
            align: center
            width: 480
            height: 480
            bg_opa: 0
            border_width: 0
            pad_all: 0
            clickable: false
            scrollbar_mode: "OFF"
            widgets:
              - arc: {id: home_arc0, align: center, width: 430, height: 430, start_angle: 1,   end_angle: 83,  min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x8A6714, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc1, align: center, width: 430, height: 430, start_angle: 85,  end_angle: 145, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x1C1226, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc2, align: center, width: 430, height: 430, start_angle: 147, end_angle: 219, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x0A211F, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc3, align: center, width: 430, height: 430, start_angle: 221, end_angle: 293, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x0D1E2C, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc4, align: center, width: 430, height: 430, start_angle: 295, end_angle: 359, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x131E29, arc_width: 100, indicator: {arc_width: 0}}
              - obj:
