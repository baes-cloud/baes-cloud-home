substitutions:
  night_idle: 180s              # no interaction for this long -> faded clock
  night_clock_color: "0x9A5F2C" # warm amber: no blue light while sleeping
  night_date_color: "0x6E4526"

esphome:
  name: rotary-display-2
  friendly_name: rotary-display-2
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - output.turn_on: lcd_power
      - output.turn_on: display_reset
      - delay: 100ms
      - output.turn_off: display_reset
      - delay: 500ms

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Rotary-Display-Bedroom"
    password: !secret ap_password

  use_address: <device-ip>

captive_portal:

web_server:
  port: 80

# --------------------------------------------------------
# HARDWARE & I2C
# --------------------------------------------------------
i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: true
  frequency: 400kHz

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz

  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode: output

  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode: output
      inverted: true

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0.5s
    restore_mode: ALWAYS_ON
    on_turn_off:
      - delay: 50ms
      - light.turn_on:
          id: display_backlight
          brightness: 55%

# --------------------------------------------------------
# IMAGE ASSETS
# --------------------------------------------------------
image:
  - file: "sonos_white.png"
    id: sonos_logo
    type: RGB565
    transparency: alpha_channel
    resize: 120x24

  - file: "icon_disco_w.png"
    id: icon_disco
    type: RGB565
    transparency: alpha_channel
    resize: 38x44
  - file: "icon_house_w.png"
    id: icon_house
    type: RGB565
    transparency: alpha_channel
    resize: 50x40
  - file: "icon_mos_w.png"
    id: icon_mos
    type: RGB565
    transparency: alpha_channel
    resize: 46x42
  - file: "icon_pdm.png"
    id: icon_pdm
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - file: "icon_dfp_w.png"
    id: icon_dfp
    type: RGB565
    transparency: alpha_channel
    resize: 44x44

  - file: "ico_lights.png"
    id: ico_lights
    type: RGB565
    transparency: alpha_channel
  - file: "ico_scenes.png"
    id: ico_scenes
    type: RGB565
    transparency: alpha_channel
  - file: "ico_media.png"
    id: ico_media
    type: RGB565
    transparency: alpha_channel
  - file: "ico_climate.png"
    id: ico_climate
    type: RGB565
    transparency: alpha_channel
  - file: "ico_blinds.png"
    id: ico_blinds
    type: RGB565
    transparency: alpha_channel

# --------------------------------------------------------
# GLOBALS
# current_mode: 0=Media 1=Lights 2=Climate 3=Home 4=Scenes 5=Blinds 6=Playlists 7=Speakers
# home_menu_idx: 0=Lights 1=Scenes 2=Media 3=Climate 4=Blinds
# selected_light_idx: 0=Bed Lamps 1=Bedroom LED Strip 2=Bedroom 3=Bed Wardrobe 4=Bathroom All 5=Office All 6=Club All
# nav_level: 0=Home wheel  1=section wheel/selector  2=control page
# --------------------------------------------------------
globals:
  - id: night_active          # true while the faded clock is showing
    type: bool
    initial_value: 'false'
  - id: night_armed           # idle countdown armed once after boot
    type: bool
    initial_value: 'false'
  - id: current_mode
    type: int
    initial_value: '3'
  - id: selected_light_idx
    type: int
    initial_value: '0'
  - id: lights_bright_val
    type: float
    initial_value: '0'
  - id: lights_bright_bed_lamps
    type: float
    initial_value: '0'
  - id: lights_bright_bed_led_strip
    type: float
    initial_value: '0'
  - id: lights_bright_bedroom
    type: float
    initial_value: '0'
  - id: lights_bright_bed_wardrobe
    type: float
    initial_value: '0'
  - id: lights_bright_bathroom_all
    type: float
    initial_value: '0'
  - id: lights_bright_office_all
    type: float
    initial_value: '0'
  - id: lights_bright_club_all
    type: float
    initial_value: '0'
  - id: target_temp_val
    type: float
    initial_value: '24.0'
  # --- VINYL SPIN ---
  - id: vinyl_angle
    type: int
    initial_value: '0'
  # Media is dual-target: bedroom (default) or club, toggled from the
  # Speakers sub-page. Each target tracks its own playing/TV state so the
  # vinyl spin and TV-hide logic follow whichever speaker is on screen.
  - id: media_is_club
    type: bool
    initial_value: 'false'
  - id: media_playing_bedroom
    type: bool
    initial_value: 'false'
  - id: media_playing_club
    type: bool
    initial_value: 'false'
  - id: media_is_tv_bedroom
    type: bool
    initial_value: 'false'
  - id: media_is_tv_club
    type: bool
    initial_value: 'false'
  - id: home_menu_idx
    type: int
    initial_value: '0'
  # 0=Bed Day 1=Bed Night 2=Bed Night Motion 3=Bed Morning 4=Off
  - id: selected_scene
    type: int
    initial_value: '0'
  - id: nav_level
    type: int
    initial_value: '0'
  - id: pa_mode
    type: int
    initial_value: '0'
  # Climate selection: false = Aircon, true = Heater
  - id: heater_selected
    type: bool
    initial_value: 'false'

# --------------------------------------------------------
# SCRIPTS
# --------------------------------------------------------
script:
  # --- SCREEN TIMEOUT ---
  # --- IDLE -> NIGHT CLOCK ---------------------------------------------------
  # Every input (touch, knob, button) calls this. If the night clock is
  # showing it wakes the panel; otherwise it (re)starts the idle countdown.
  - id: screen_timeout_timer
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then:
            - script.execute: wake_from_night
          else:
            - script.execute: apply_awake_brightness
      - delay: ${night_idle}
      - script.execute: enter_night

  # Awake brightness: full, or 50% while TV is the source (bedroom or club).
  # Never touches backlight while night clock is up.
  - id: apply_awake_brightness
    then:
      - if:
          condition: {lambda: 'return !id(night_active);'}
          then:
            - light.control:
                id: display_backlight
                brightness: !lambda 'return id(media_is_club) ? (id(media_is_tv_club) ? 0.5f : 1.0f) : (id(media_is_tv_bedroom) ? 0.5f : 1.0f);'

  - id: enter_night
    then:
      - lambda: |-
          id(night_active) = true;
          id(current_mode) = 9;     // inert: knob/button handlers match no page
          id(nav_level) = 0;
      - script.execute: update_night_clock
      - lvgl.widget.show: grp_night
      - light.control:
          id: display_backlight
          brightness: !lambda 'return id(night_brightness).state / 100.0f;'

  - id: wake_from_night
    mode: restart
    then:
      - lambda: 'id(night_active) = false;'
      - light.control:
          id: display_backlight
          brightness: !lambda 'return id(media_is_club) ? (id(media_is_tv_club) ? 0.5f : 1.0f) : (id(media_is_tv_bedroom) ? 0.5f : 1.0f);'
      # The waking touch / turn / press is swallowed: current_mode stays
      # inert for a moment, then the panel returns to the home screen.
      - delay: 350ms
      - lvgl.widget.hide: grp_night
      - script.execute: switch_to_home

  - id: update_night_clock
    then:
      - lvgl.label.update:
          id: night_clock_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
      - lvgl.label.update:
          id: night_date_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid() || t.day_of_week < 1 || t.day_of_week > 7 ||
                t.month < 1 || t.month > 12) return std::string("");
            static const char *const days[] = {"Sunday", "Monday", "Tuesday",
              "Wednesday", "Thursday", "Friday", "Saturday"};
            static const char *const months[] = {"January", "February", "March",
              "April", "May", "June", "July", "August", "September", "October",
              "November", "December"};
            char b[40];
            snprintf(b, sizeof(b), "%s %d %s", days[t.day_of_week - 1],
                     (int) t.day_of_month, months[t.month - 1]);
            return std::string(b);

  # ══════════════════════════════════════════════════════════════════════
  # NAVIGATION MODEL
  #   nav_level 0 = Home wheel        (current_mode 3)
  #   nav_level 1 = section wheel/selector (Media 0 / Lights 1 / Climate 2 /
  #                                          Scenes 4 / Blinds 5)
  #   nav_level 2 = control page      (Light control, Climate control)
  #   Short press or centre touch -> primary_action
  #   Long press                  -> go_back (one step up)
  # ══════════════════════════════════════════════════════════════════════
  - id: hide_all_pages
    then:
      - lvgl.widget.hide: grp_home
      - lvgl.widget.hide: grp_bc_home
      - lvgl.widget.hide: grp_bc_lights
      - lvgl.widget.hide: grp_lights_wheel
      - lvgl.widget.hide: grp_light_ctl
      - lvgl.widget.hide: grp_scenes
      - lvgl.widget.hide: grp_climate_select
      - lvgl.widget.hide: grp_climate
      - lvgl.widget.hide: grp_blind_ctl
      - lvgl.widget.hide: grp_media_btns
      - lvgl.widget.hide: grp_playlists
      - lvgl.widget.hide: grp_speakers
      - lvgl.widget.hide: vinyl_group
      - lvgl.widget.hide: title_label
      - lvgl.widget.hide: artist_label
      - lvgl.widget.hide: center_btn

  # --- PAGE: HOME ---
  - id: switch_to_home
    then:
      - lambda: 'id(current_mode) = 3; id(nav_level) = 0;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_home
      - lvgl.widget.show: center_btn
      - script.execute: update_clock
      - script.execute: update_home_menu
      - script.execute: update_home_wheel

  # --- PAGE: LIGHTS (wheel of lights) ---
  - id: switch_to_lights
    then:
      - lambda: 'id(current_mode) = 1; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_lights_wheel
      - lvgl.widget.show: center_btn
      - script.execute: update_lights_wheel

  # --- PAGE: LIGHT CONTROL ---
  - id: enter_light_ctl
    then:
      - lambda: 'id(current_mode) = 1; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.widget.show: grp_bc_lights
      - lvgl.widget.show: grp_light_ctl
      - lvgl.widget.show: center_btn
      - lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x34E3D1}}
      - script.execute: update_light_ui

  # --- PAGE: SCENES ---
  - id: switch_to_scenes
    then:
      - lambda: 'id(current_mode) = 4; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_scenes
      - lvgl.widget.show: center_btn
      - script.execute: update_scenes_ui

  # --- PAGE: CLIMATE SELECT (Aircon vs Heater) ---
  - id: switch_to_climate
    then:
      - lambda: 'id(current_mode) = 2; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_climate_select
      - lvgl.widget.show: center_btn
      - script.execute: update_climate_select_ui

  - id: update_climate_select_ui
    then:
      - if: {condition: {lambda: 'return !id(heater_selected);'}, then: [{lvgl.arc.update: {id: cs_arc_aircon, arc_color: 0x4A90E0}}], else: [{lvgl.arc.update: {id: cs_arc_aircon, arc_color: 0x16304C}}]}
      - if: {condition: {lambda: 'return id(heater_selected);'}, then: [{lvgl.arc.update: {id: cs_arc_heater, arc_color: 0xE04848}}], else: [{lvgl.arc.update: {id: cs_arc_heater, arc_color: 0x461818}}]}
      - lvgl.label.update:
          id: climate_select_lbl
          text: !lambda 'return id(heater_selected) ? std::string("HEATER") : std::string("AIRCON");'

  # --- PAGE: CLIMATE CONTROL (Aircon) ---
  - id: enter_climate_ctl
    then:
      - lambda: 'id(current_mode) = 2; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.widget.show: grp_climate
      - lvgl.widget.show: center_btn
      - lvgl.arc.update:
          id: main_arc
          indicator: {arc_color: 0x4A90E0}
          value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'
      - script.execute: update_climate_wheel

  - id: toggle_heater
    then:
      - homeassistant.action: {action: switch.toggle, data: {entity_id: switch.bedroom_heater}}

  # --- PAGE: BLINDS (bedroom only, no selection needed) ---
  - id: switch_to_blinds
    then:
      - lambda: 'id(current_mode) = 5; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_blind_ctl
      - lvgl.widget.show: center_btn
      - lvgl.arc.update:
          id: main_arc
          indicator: {arc_color: 0x7DD3FC}
          value: !lambda |-
            float p = id(ha_bed_blinds_pos).state;
            return isnan(p) ? 0 : (int)p;
      - script.execute: update_blind_state_lbl

  - id: update_blind_state_lbl
    then:
      - lvgl.label.update:
          id: climate_blinds_state
          text: !lambda |-
            std::string s = id(ha_bed_blinds_state).state;
            for (auto &c : s) c = toupper((unsigned char)c);
            return s;

  # --- PAGE: MEDIA ---
  - id: show_media_page
    then:
      - script.execute: hide_all_pages
      - lvgl.widget.show: vinyl_group
      - lvgl.widget.show: grp_media_btns
      - lvgl.widget.show: center_btn
      - lvgl.widget.show: title_label
      - lvgl.widget.show: artist_label
      - script.execute: update_media_ui

  # Entry point from Home: always defaults to the bedroom speaker.
  - id: switch_to_media
    then:
      - lambda: 'id(current_mode) = 0; id(nav_level) = 1; id(media_is_club) = false;'
      - script.execute: show_media_page

  # Entered from the Speakers page when the person picks Club.
  - id: enter_media_club
    then:
      - lambda: 'id(current_mode) = 0; id(nav_level) = 1; id(media_is_club) = true;'
      - script.execute: show_media_page

  - id: update_media_ui
    then:
      - lvgl.arc.update:
          id: main_arc
          indicator: {arc_color: 0x34E3D1}
          value: !lambda |-
            float v = id(media_is_club) ? id(ha_media_volume_club).state : id(ha_media_volume_bedroom).state;
            return isnan(v) ? 50 : (int)(v * 100.0f);
      - lvgl.label.update:
          id: title_label
          text: !lambda |-
            return id(media_is_club) ? id(media_title_club).state : id(media_title_bedroom).state;
      - lvgl.label.update:
          id: artist_label
          text: !lambda |-
            return id(media_is_club) ? id(media_artist_club).state : id(media_artist_bedroom).state;
      - lvgl.label.update:
          id: media_target_lbl
          text: !lambda 'return id(media_is_club) ? std::string("CLUB") : std::string("BEDROOM");'
      - if:
          condition: {lambda: 'return id(media_is_club) ? id(media_is_tv_club) : id(media_is_tv_bedroom);'}
          then:
            - lvgl.widget.hide: title_label
            - lvgl.widget.hide: artist_label
          else:
            - lvgl.widget.show: title_label
            - lvgl.widget.show: artist_label

  # --- PAGE: PLAYLISTS (Media sub-page) ---
  - id: switch_to_playlists
    then:
      - lambda: 'id(current_mode) = 6; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_playlists

  # --- PAGE: SPEAKERS (Media sub-page) ---
  - id: switch_to_speakers
    then:
      - lambda: 'id(current_mode) = 7; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_speakers
      - lvgl.label.update:
          id: sp_target_lbl
          text: !lambda 'return id(media_is_club) ? std::string("Switch to Bedroom") : std::string("Switch to Club");'

  # --- PRIMARY ACTION (short press / centre touch) ---
  - id: primary_action
    then:
      - lambda: 'id(pa_mode) = id(current_mode) * 10 + id(nav_level);'
      - if: {condition: {lambda: 'return id(pa_mode) == 30;'}, then: [{script.execute: open_home_selection}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 11;'}, then: [{script.execute: enter_light_ctl}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 12;'}, then: [{script.execute: call_light_toggle}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 41;'}, then: [{script.execute: activate_scene}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 1 && !id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.media_play_pause, data: {entity_id: media_player.bedroom_sonos}}}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 1 && id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.media_play_pause, data: {entity_id: media_player.club}}}]}
      # Climate: selecting Aircon enters the control page, Heater just toggles
      - if: {condition: {lambda: 'return id(pa_mode) == 21 && !id(heater_selected);'}, then: [{script.execute: enter_climate_ctl}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 21 && id(heater_selected);'}, then: [{script.execute: toggle_heater}]}
      # Blinds: single level now - a tap here means "stop"
      - if: {condition: {lambda: 'return id(pa_mode) == 51;'}, then: [{homeassistant.action: {action: cover.stop_cover, data: {entity_id: cover.smart_blinds}}}]}

  # --- GO BACK (long press): control -> selector -> home ---
  - id: go_back
    then:
      - lambda: 'id(pa_mode) = id(current_mode) * 10 + id(nav_level);'
      - if: {condition: {lambda: 'return id(pa_mode) == 12;'}, then: [{script.execute: switch_to_lights}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 22;'}, then: [{script.execute: switch_to_climate}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 62 || id(pa_mode) == 72;'}, then: [{script.execute: switch_to_media}]}
      - if: {condition: {lambda: 'return id(pa_mode) % 10 == 1;'}, then: [{script.execute: switch_to_home}]}

  # --- HOME helpers ---
  - id: update_home_menu
    then:
      - lvgl.label.update:
          id: home_menu_lbl
          text: !lambda |-
            switch (id(home_menu_idx)) {
              case 0: return std::string("LIGHTS");
              case 1: return std::string("SCENES");
              case 2: return std::string("MEDIA");
              case 3: return std::string("CLIMATE");
              default: return std::string("BLINDS");
            }
      - script.execute: update_home_media

  # Home page + MEDIA wedge always reflects the bedroom speaker (the primary
  # / default target), regardless of what the Media control page is showing.
  - id: update_home_media
    then:
      - if:
          condition: {lambda: 'return id(current_mode) == 3 && id(home_menu_idx) == 2;'}
          then:
            - lvgl.widget.show: grp_home_vinyl
            - if:
                condition: {lambda: 'return id(media_playing_bedroom) && !id(media_is_tv_bedroom);'}
                then:
                  - lvgl.widget.show: hv_sheen_outer
                  - lvgl.widget.show: hv_sheen_inner
                else:
                  - lvgl.widget.hide: hv_sheen_outer
                  - lvgl.widget.hide: hv_sheen_inner
            - lvgl.label.update:
                id: home_menu_lbl
                text: !lambda |-
                  if (id(media_is_tv_bedroom)) return std::string("TV");
                  std::string t = id(media_title_bedroom).state;
                  if (t.empty() || t == "unknown" || t == "unavailable" || t == "None")
                    return std::string("MEDIA");
                  return t;
            - lvgl.label.update:
                id: home_np_artist
                text: !lambda |-
                  if (id(media_is_tv_bedroom)) return std::string("");
                  std::string a = id(media_artist_bedroom).state;
                  if (a == "unknown" || a == "unavailable" || a == "None")
                    return std::string("");
                  return a;
            - if:
                condition:
                  lambda: |-
                    if (id(media_is_tv_bedroom)) return false;
                    std::string a = id(media_artist_bedroom).state;
                    return !(a.empty() || a == "unknown" || a == "unavailable" || a == "None");
                then: [{lvgl.widget.show: home_np_artist}]
                else: [{lvgl.widget.hide: home_np_artist}]
          else:
            - lvgl.widget.hide: grp_home_vinyl
            - lvgl.widget.hide: home_np_artist

  - id: open_home_selection
    then:
      - if: {condition: {lambda: 'return id(home_menu_idx) == 0;'}, then: [{script.execute: switch_to_lights}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 1;'}, then: [{script.execute: switch_to_scenes}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 2;'}, then: [{script.execute: switch_to_media}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 3;'}, then: [{script.execute: switch_to_climate}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 4;'}, then: [{script.execute: switch_to_blinds}]}

  - id: update_home_wheel
    then:
      - if: {condition: {lambda: 'return id(home_menu_idx) == 0;'}, then: [{lvgl.arc.update: {id: home_arc0, arc_color: 0x8A6714}}], else: [{lvgl.arc.update: {id: home_arc0, arc_color: 0x241C08}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 1;'}, then: [{lvgl.arc.update: {id: home_arc1, arc_color: 0x53347A}}], else: [{lvgl.arc.update: {id: home_arc1, arc_color: 0x1C1226}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 2;'}, then: [{lvgl.arc.update: {id: home_arc2, arc_color: 0x14706A}}], else: [{lvgl.arc.update: {id: home_arc2, arc_color: 0x0A211F}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 3;'}, then: [{lvgl.arc.update: {id: home_arc3, arc_color: 0x225780}}], else: [{lvgl.arc.update: {id: home_arc3, arc_color: 0x0D1E2C}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 4;'}, then: [{lvgl.arc.update: {id: home_arc4, arc_color: 0x365878}}], else: [{lvgl.arc.update: {id: home_arc4, arc_color: 0x131E29}}]}

  - id: update_clock
    then:
      - lvgl.label.update:
          id: home_clock_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%2d:%02d", t.hour, t.minute);
            return std::string(buf);

  # --- LIGHTS wheel helper ---
  - id: update_lights_wheel
    then:
      - if: {condition: {lambda: 'return id(selected_light_idx) == 0;'}, then: [{lvgl.arc.update: {id: lw_arc0, arc_color: 0xA87C24}}], else: [{lvgl.arc.update: {id: lw_arc0, arc_color: 0x4A3810}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 1;'}, then: [{lvgl.arc.update: {id: lw_arc1, arc_color: 0xA85C24}}], else: [{lvgl.arc.update: {id: lw_arc1, arc_color: 0x4A2C10}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 2;'}, then: [{lvgl.arc.update: {id: lw_arc2, arc_color: 0x963A78}}], else: [{lvgl.arc.update: {id: lw_arc2, arc_color: 0x421836}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 3;'}, then: [{lvgl.arc.update: {id: lw_arc3, arc_color: 0x6B51A8}}], else: [{lvgl.arc.update: {id: lw_arc3, arc_color: 0x2C2148}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 4;'}, then: [{lvgl.arc.update: {id: lw_arc4, arc_color: 0x5C8C44}}], else: [{lvgl.arc.update: {id: lw_arc4, arc_color: 0x24401C}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 5;'}, then: [{lvgl.arc.update: {id: lw_arc5, arc_color: 0x2E8C82}}], else: [{lvgl.arc.update: {id: lw_arc5, arc_color: 0x123C36}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 6;'}, then: [{lvgl.arc.update: {id: lw_arc6, arc_color: 0x96404E}}], else: [{lvgl.arc.update: {id: lw_arc6, arc_color: 0x441C22}}]}
      - lvgl.label.update:
          id: lw_name
          text: !lambda |-
            switch (id(selected_light_idx)) {
              case 0: return std::string("Bed Lamps");
              case 1: return std::string("Bedroom LED Strip");
              case 2: return std::string("Bedroom");
              case 3: return std::string("Bed Wardrobe");
              case 4: return std::string("Bathroom All");
              case 5: return std::string("Office All");
              default: return std::string("Club All");
            }

  # --- SCENES helper ---
  - id: update_scenes_ui
    then:
      - if: {condition: {lambda: 'return id(selected_scene) == 0;'}, then: [{lvgl.arc.update: {id: scene_arc0, arc_color: 0xE2E8F0}}], else: [{lvgl.arc.update: {id: scene_arc0, arc_color: 0x969CA6}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 1;'}, then: [{lvgl.arc.update: {id: scene_arc1, arc_color: 0xB388E0}}], else: [{lvgl.arc.update: {id: scene_arc1, arc_color: 0x7E60A0}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 2;'}, then: [{lvgl.arc.update: {id: scene_arc2, arc_color: 0x6D8FD8}}], else: [{lvgl.arc.update: {id: scene_arc2, arc_color: 0x3A4A7A}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 3;'}, then: [{lvgl.arc.update: {id: scene_arc3, arc_color: 0xF0B44E}}], else: [{lvgl.arc.update: {id: scene_arc3, arc_color: 0xA88434}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 4;'}, then: [{lvgl.arc.update: {id: scene_arc4, arc_color: 0x4FE0D0}}], else: [{lvgl.arc.update: {id: scene_arc4, arc_color: 0x2E8C82}}]}
      - lvgl.label.update:
          id: scenes_name_lbl
          text: !lambda |-
            switch (id(selected_scene)) {
              case 0: return std::string("BED DAY");
              case 1: return std::string("BED NIGHT");
              case 2: return std::string("BED NIGHT MOTION");
              case 3: return std::string("BED MORNING");
              default: return std::string("OFF");
            }

  - id: activate_scene
    then:
      - if: {condition: {lambda: 'return id(selected_scene) == 0;'}, then: [{homeassistant.action: {action: scene.turn_on, data: {entity_id: scene.bed_day}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 1;'}, then: [{homeassistant.action: {action: scene.turn_on, data: {entity_id: scene.bed_night}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 2;'}, then: [{homeassistant.action: {action: scene.turn_on, data: {entity_id: scene.bed_night_motion}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 3;'}, then: [{homeassistant.action: {action: scene.turn_on, data: {entity_id: scene.bed_morning}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 4;'}, then: [{homeassistant.action: {action: script.turn_on, data: {entity_id: script.off}}}]}

  # --- CLIMATE wheel helper (aircon control page only) ---
  - id: update_climate_wheel
    then:
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "off";'}, then: [{lvgl.arc.update: {id: cw_arc0, arc_color: 0x6E6E7C}}], else: [{lvgl.arc.update: {id: cw_arc0, arc_color: 0x26262C}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "fan_only";'}, then: [{lvgl.arc.update: {id: cw_arc1, arc_color: 0x46A0B4}}], else: [{lvgl.arc.update: {id: cw_arc1, arc_color: 0x173A40}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "cool";'}, then: [{lvgl.arc.update: {id: cw_arc2, arc_color: 0x4A90E0}}], else: [{lvgl.arc.update: {id: cw_arc2, arc_color: 0x16304C}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "heat";'}, then: [{lvgl.arc.update: {id: cw_arc3, arc_color: 0xE04848}}], else: [{lvgl.arc.update: {id: cw_arc3, arc_color: 0x461818}}]}
      - if: {condition: {lambda: 'return id(ha_climate_fan).state == "low";'}, then: [{lvgl.arc.update: {id: cw_arc4, arc_color: 0x5B47A0}}], else: [{lvgl.arc.update: {id: cw_arc4, arc_color: 0x241C40}}]}
      - if: {condition: {lambda: 'return id(ha_climate_fan).state == "auto";'}, then: [{lvgl.arc.update: {id: cw_arc5, arc_color: 0x7A5FD0}}], else: [{lvgl.arc.update: {id: cw_arc5, arc_color: 0x2E2452}}]}
      - if: {condition: {lambda: 'return id(ha_climate_fan).state == "high";'}, then: [{lvgl.arc.update: {id: cw_arc6, arc_color: 0x9B7DF0}}], else: [{lvgl.arc.update: {id: cw_arc6, arc_color: 0x392C63}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "heat";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0xE04848}}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "cool";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x4A90E0}}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "fan_only";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x46A0B4}}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "off";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x6E6E7C}}}]}

  # --- LIGHT HELPERS ---
  - id: update_light_ui
    then:
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                if (id(selected_light_idx) == 0) id(lights_bright_val) = id(lights_bright_bed_lamps);
                else if (id(selected_light_idx) == 1) id(lights_bright_val) = id(lights_bright_bed_led_strip);
                else if (id(selected_light_idx) == 2) id(lights_bright_val) = id(lights_bright_bedroom);
                else if (id(selected_light_idx) == 3) id(lights_bright_val) = id(lights_bright_bed_wardrobe);
                else if (id(selected_light_idx) == 4) id(lights_bright_val) = id(lights_bright_bathroom_all);
                else if (id(selected_light_idx) == 5) id(lights_bright_val) = id(lights_bright_office_all);
                else if (id(selected_light_idx) == 6) id(lights_bright_val) = id(lights_bright_club_all);
            - lvgl.arc.update:
                id: main_arc
                value: !lambda 'return (int)id(lights_bright_val);'
            - lvgl.label.update:
                id: lights_pct_label
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)id(lights_bright_val));
                  return buf;
            - lvgl.label.update:
                id: lights_name_lbl
                text: !lambda |-
                  if (id(selected_light_idx) == 0) return "BED LAMPS";
                  if (id(selected_light_idx) == 1) return "BEDROOM LED STRIP";
                  if (id(selected_light_idx) == 2) return "BEDROOM";
                  if (id(selected_light_idx) == 3) return "BED CANDLES";
                  if (id(selected_light_idx) == 4) return "BATHROOM ALL";
                  if (id(selected_light_idx) == 5) return "OFFICE ALL";
                  if (id(selected_light_idx) == 6) return "CLUB ALL";
                  return "";

  # NOTE: fixed vs the broken source file - each idx branch below is a
  # sibling `if`, not nested inside idx==0, so every light actually gets
  # its brightness pushed to HA.
  - id: call_light_turn_on
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 0 && !std::isnan(id(lights_bright_bed_lamps));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_bed_lamps) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.bedlamps}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.bedlamps}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_bed_lamps);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 1 && !std::isnan(id(lights_bright_bed_led_strip));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_bed_led_strip) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.bedroom_led_strip}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.bedroom_led_strip}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_bed_led_strip);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 2 && !std::isnan(id(lights_bright_bedroom));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_bedroom) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.bedroom_lights}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.bedroom_lights}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_bedroom);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 3 && !std::isnan(id(lights_bright_bed_wardrobe));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_bed_wardrobe) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.bedroom_candles}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.bedroom_candles}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_bed_wardrobe);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 4 && !std::isnan(id(lights_bright_bathroom_all));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_bathroom_all) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.bathroom_all}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.bathroom_all}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_bathroom_all);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 5 && !std::isnan(id(lights_bright_office_all));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_office_all) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.office_all}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.office_all}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_office_all);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 6 && !std::isnan(id(lights_bright_club_all));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_club_all) <= 0;'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.ckub_all}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.ckub_all}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_club_all);'}

  - id: call_light_toggle
    then:
      - if: {condition: {lambda: 'return id(selected_light_idx) == 0;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.bedlamps}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 1;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.bedroom_led_strip}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 2;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.bedroom_lights}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 3;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.bedroom_candles}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 4;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.bathroom_all}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 5;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.office_all}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 6;'}, then: [{homeassistant.action: {action: light.toggle, data: {entity_id: light.ckub_all}}}]}

  - id: update_climate_temp
    mode: restart
    parameters:
      new_temp: float
    then:
      - delay: 400ms
      - homeassistant.action:
          action: climate.set_temperature
          data: {entity_id: climate.aircon}
          data_template: {temperature: "{{ temp }}"}
          variables:
            temp: !lambda 'return new_temp;'

# --------------------------------------------------------
# VINYL SPIN LOOP - follows whichever speaker is on screen
# --------------------------------------------------------
interval:
  # --- night clock: tick the faded clock, and arm the idle timer once after boot
  - interval: 5s
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then: [{script.execute: update_night_clock}]
      - if:
          condition: {lambda: 'return !id(night_armed);'}
          then:
            - lambda: 'id(night_armed) = true;'
            - script.execute: screen_timeout_timer
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: |-
              bool playing = id(media_is_club) ? id(media_playing_club) : id(media_playing_bedroom);
              bool tv = id(media_is_club) ? id(media_is_tv_club) : id(media_is_tv_bedroom);
              return playing && id(current_mode) == 0 && !tv;
          then:
            - lambda: |-
                id(vinyl_angle) += 60;
                if (id(vinyl_angle) >= 3600) id(vinyl_angle) -= 3600;
            - lvgl.image.update:
                id: media_logo
                angle: !lambda 'return id(vinyl_angle);'

# --------------------------------------------------------
# CLOCK (Home page)
# --------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: update_clock

# --------------------------------------------------------
# INPUTS
# --------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: rotary_button
    pin:
      pcf8574: pcf
      number: 5
      mode: INPUT
      inverted: true
    on_multi_click:
      # --- DOUBLE CLICK: Media = next track (target-aware) ---
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 400ms
        then:
          - script.execute: screen_timeout_timer
          - if: {condition: {lambda: 'return id(current_mode) == 0 && !id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.media_next_track, data: {entity_id: media_player.bedroom_sonos}}}]}
          - if: {condition: {lambda: 'return id(current_mode) == 0 && id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.media_next_track, data: {entity_id: media_player.club}}}]}
      # --- SINGLE CLICK: same as touching the centre ---
      - timing:
          - ON for 50ms to 400ms
          - OFF for at least 400ms
        then:
          - script.execute: screen_timeout_timer
          - script.execute: primary_action
      # --- LONG PRESS: back one step ---
      - timing:
          - ON for at least 600ms
        then:
          - script.execute: screen_timeout_timer
          - script.execute: go_back

touchscreen:
  - platform: cst816
    id: touch_screen
    on_touch:
      - script.execute: screen_timeout_timer

sensor:
  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: 4
      mode: INPUT_PULLUP
    pin_b:
      number: 42
      mode: INPUT_PULLUP
    on_clockwise:
      - script.execute: screen_timeout_timer
      # Home: next wedge
      - if:
          condition: {lambda: 'return id(current_mode) == 3;'}
          then:
            - lambda: 'id(home_menu_idx) = (id(home_menu_idx) + 1) % 5;'
            - script.execute: update_home_menu
            - script.execute: update_home_wheel
      # Lights wheel: next light
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(selected_light_idx) = (id(selected_light_idx) + 1) % 7;'
            - script.execute: update_lights_wheel
      # Light control: brightness up
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                if (id(selected_light_idx) == 0) { id(lights_bright_bed_lamps) += 10.0f; if (id(lights_bright_bed_lamps) > 100.0f) id(lights_bright_bed_lamps) = 100.0f; }
                else if (id(selected_light_idx) == 1) { id(lights_bright_bed_led_strip) += 10.0f; if (id(lights_bright_bed_led_strip) > 100.0f) id(lights_bright_bed_led_strip) = 100.0f; }
                else if (id(selected_light_idx) == 2) { id(lights_bright_bedroom) += 10.0f; if (id(lights_bright_bedroom) > 100.0f) id(lights_bright_bedroom) = 100.0f; }
                else if (id(selected_light_idx) == 3) { id(lights_bright_bed_wardrobe) += 10.0f; if (id(lights_bright_bed_wardrobe) > 100.0f) id(lights_bright_bed_wardrobe) = 100.0f; }
                else if (id(selected_light_idx) == 4) { id(lights_bright_bathroom_all) += 10.0f; if (id(lights_bright_bathroom_all) > 100.0f) id(lights_bright_bathroom_all) = 100.0f; }
                else if (id(selected_light_idx) == 5) { id(lights_bright_office_all) += 10.0f; if (id(lights_bright_office_all) > 100.0f) id(lights_bright_office_all) = 100.0f; }
                else if (id(selected_light_idx) == 6) { id(lights_bright_club_all) += 10.0f; if (id(lights_bright_club_all) > 100.0f) id(lights_bright_club_all) = 100.0f; }
            - script.execute: update_light_ui
            - script.execute: call_light_turn_on
      # Scenes: next scene
      - if:
          condition: {lambda: 'return id(current_mode) == 4;'}
          then:
            - lambda: 'id(selected_scene) = (id(selected_scene) + 1) % 5;'
            - script.execute: update_scenes_ui
      # Media: volume up (target-aware)
      - if: {condition: {lambda: 'return id(current_mode) == 0 && !id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.volume_up, data: {entity_id: media_player.bedroom_sonos}}}]}
      - if: {condition: {lambda: 'return id(current_mode) == 0 && id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.volume_up, data: {entity_id: media_player.club}}}]}
      # Climate selector: rotate to flip Aircon/Heater
      - if:
          condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(heater_selected) = !id(heater_selected);'
            - script.execute: update_climate_select_ui
      # Climate control: temperature up
      - if:
          condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                id(target_temp_val) += 1.0f;
                if (id(target_temp_val) > 30.0f) id(target_temp_val) = 30.0f;
            - lvgl.arc.update:
                id: main_arc
                value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'
            - lvgl.label.update:
                id: target_temp_lbl
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
                  return buf;
            - script.execute:
                id: update_climate_temp
                new_temp: !lambda 'return id(target_temp_val);'
      # Blinds: open bedroom curtain
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 1;'}
          then: [{homeassistant.action: {action: cover.open_cover, data: {entity_id: cover.smart_blinds}}}]

    on_anticlockwise:
      - script.execute: screen_timeout_timer
      # Home: previous wedge
      - if:
          condition: {lambda: 'return id(current_mode) == 3;'}
          then:
            - lambda: 'id(home_menu_idx) = (id(home_menu_idx) + 4) % 5;'
            - script.execute: update_home_menu
            - script.execute: update_home_wheel
      # Lights wheel: previous light
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(selected_light_idx) = (id(selected_light_idx) + 6) % 7;'
            - script.execute: update_lights_wheel
      # Light control: brightness down
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                if (id(selected_light_idx) == 0) { id(lights_bright_bed_lamps) -= 10.0f; if (id(lights_bright_bed_lamps) < 0.0f) id(lights_bright_bed_lamps) = 0.0f; }
                else if (id(selected_light_idx) == 1) { id(lights_bright_bed_led_strip) -= 10.0f; if (id(lights_bright_bed_led_strip) < 0.0f) id(lights_bright_bed_led_strip) = 0.0f; }
                else if (id(selected_light_idx) == 2) { id(lights_bright_bedroom) -= 10.0f; if (id(lights_bright_bedroom) < 0.0f) id(lights_bright_bedroom) = 0.0f; }
                else if (id(selected_light_idx) == 3) { id(lights_bright_bed_wardrobe) -= 10.0f; if (id(lights_bright_bed_wardrobe) < 0.0f) id(lights_bright_bed_wardrobe) = 0.0f; }
                else if (id(selected_light_idx) == 4) { id(lights_bright_bathroom_all) -= 10.0f; if (id(lights_bright_bathroom_all) < 0.0f) id(lights_bright_bathroom_all) = 0.0f; }
                else if (id(selected_light_idx) == 5) { id(lights_bright_office_all) -= 10.0f; if (id(lights_bright_office_all) < 0.0f) id(lights_bright_office_all) = 0.0f; }
                else if (id(selected_light_idx) == 6) { id(lights_bright_club_all) -= 10.0f; if (id(lights_bright_club_all) < 0.0f) id(lights_bright_club_all) = 0.0f; }
            - script.execute: update_light_ui
            - script.execute: call_light_turn_on
      # Scenes: previous scene
      - if:
          condition: {lambda: 'return id(current_mode) == 4;'}
          then:
            - lambda: 'id(selected_scene) = (id(selected_scene) + 4) % 5;'
            - script.execute: update_scenes_ui
      # Media: volume down (target-aware)
      - if: {condition: {lambda: 'return id(current_mode) == 0 && !id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.volume_down, data: {entity_id: media_player.bedroom_sonos}}}]}
      - if: {condition: {lambda: 'return id(current_mode) == 0 && id(media_is_club);'}, then: [{homeassistant.action: {action: media_player.volume_down, data: {entity_id: media_player.club}}}]}
      # Climate selector: rotate to flip Aircon/Heater
      - if:
          condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(heater_selected) = !id(heater_selected);'
            - script.execute: update_climate_select_ui
      # Climate control: temperature down
      - if:
          condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                id(target_temp_val) -= 1.0f;
                if (id(target_temp_val) < 16.0f) id(target_temp_val) = 16.0f;
            - lvgl.arc.update:
                id: main_arc
                value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'
            - lvgl.label.update:
                id: target_temp_lbl
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
                  return buf;
            - script.execute:
                id: update_climate_temp
                new_temp: !lambda 'return id(target_temp_val);'
      # Blinds: close bedroom curtain
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 1;'}
          then: [{homeassistant.action: {action: cover.close_cover, data: {entity_id: cover.smart_blinds}}}]

  # ── HA State Sensors ──────────────────────────────────────────────────

  - platform: homeassistant
    id: ha_media_volume_bedroom
    entity_id: media_player.bedroom_sonos
    attribute: volume_level
    on_value:
      then:
        - if:
            condition: {lambda: 'return !isnan(x) && id(current_mode) == 0 && !id(media_is_club);'}
            then:
              - lvgl.arc.update: {id: main_arc, value: !lambda 'return (int)(x * 100.0f);'}

  - platform: homeassistant
    id: ha_media_volume_club
    entity_id: media_player.club
    attribute: volume_level
    on_value:
      then:
        - if:
            condition: {lambda: 'return !isnan(x) && id(current_mode) == 0 && id(media_is_club);'}
            then:
              - lvgl.arc.update: {id: main_arc, value: !lambda 'return (int)(x * 100.0f);'}

  # BLINDS position (bedroom only)
  - platform: homeassistant
    id: ha_bed_blinds_pos
    entity_id: cover.smart_blinds
    attribute: current_position
    on_value:
      then:
        - if:
            condition: {lambda: 'return !isnan(x) && id(current_mode) == 5 && id(nav_level) == 1;'}
            then:
              - lvgl.arc.update: {id: main_arc, value: !lambda 'return (int)x;'}

  # CLIMATE Sensors
  - platform: homeassistant
    id: ha_climate_temp
    entity_id: climate.aircon
    attribute: temperature
    on_value:
      then:
        - lambda: 'id(target_temp_val) = isnan(x) ? 24.0f : x;'
        - lvgl.label.update:
            id: target_temp_lbl
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
              return buf;
        - if:
            condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 2;'}
            then:
              - lvgl.arc.update:
                  id: main_arc
                  value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'

  - platform: homeassistant
    id: ha_climate_current_temp
    entity_id: climate.aircon
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: current_temp_lbl
            text: !lambda |-
              if (isnan(x)) return "--- °C";
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f°C", x);
              return buf;

text_sensor:
  # Light brightness (attribute arrives as text; HA sends 'None' while a light is off,
  # which as a numeric sensor logged "Can't convert 'None' to number" and left a stale %).
  # LIGHT: Bed Lamps
  - platform: homeassistant
    id: ha_bed_lamps_bright
    entity_id: light.bedlamps
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            float b = (x.empty() || x == "None") ? 0.0f : atof(x.c_str());
            id(lights_bright_bed_lamps) = (b / 255.0f) * 100.0f;
        - if: {condition: {lambda: 'return id(selected_light_idx) == 0;'}, then: [{script.execute: update_light_ui}]}

  # LIGHT: Bedroom LED Strip
  - platform: homeassistant
    id: ha_bedroom_led_strip_bright
    entity_id: light.bedroom_led_strip
    on_value:
      then:
        # on/off-only light: no brightness attribute, so follow its state
        - lambda: 'id(lights_bright_bed_led_strip) = (x == "on") ? 100.0f : 0.0f;'
        - if: {condition: {lambda: 'return id(selected_light_idx) == 1;'}, then: [{script.execute: update_light_ui}]}

  # LIGHT: Bedroom
  - platform: homeassistant
    id: ha_bedroom_bright
    entity_id: light.bedroom_lights
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            float b = (x.empty() || x == "None") ? 0.0f : atof(x.c_str());
            id(lights_bright_bedroom) = (b / 255.0f) * 100.0f;
        - if: {condition: {lambda: 'return id(selected_light_idx) == 2;'}, then: [{script.execute: update_light_ui}]}

  # LIGHT: Bed Candles (slot was the deleted light.bedwardrobe group)
  - platform: homeassistant
    id: ha_bed_wardrobe_bright
    entity_id: light.bedroom_candles
    on_value:
      then:
        # on/off-only light: no brightness attribute, so follow its state
        - lambda: 'id(lights_bright_bed_wardrobe) = (x == "on") ? 100.0f : 0.0f;'
        - if: {condition: {lambda: 'return id(selected_light_idx) == 3;'}, then: [{script.execute: update_light_ui}]}

  # LIGHT: Bathroom All
  - platform: homeassistant
    id: ha_bathroom_all_bright
    entity_id: light.bathroom_all
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            float b = (x.empty() || x == "None") ? 0.0f : atof(x.c_str());
            id(lights_bright_bathroom_all) = (b / 255.0f) * 100.0f;
        - if: {condition: {lambda: 'return id(selected_light_idx) == 4;'}, then: [{script.execute: update_light_ui}]}

  # LIGHT: Office All
  - platform: homeassistant
    id: ha_office_all_bright
    entity_id: light.office_all
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            float b = (x.empty() || x == "None") ? 0.0f : atof(x.c_str());
            id(lights_bright_office_all) = (b / 255.0f) * 100.0f;
        - if: {condition: {lambda: 'return id(selected_light_idx) == 5;'}, then: [{script.execute: update_light_ui}]}

  # LIGHT: Club All
  - platform: homeassistant
    id: ha_club_all_bright
    entity_id: light.ckub_all
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            float b = (x.empty() || x == "None") ? 0.0f : atof(x.c_str());
            id(lights_bright_club_all) = (b / 255.0f) * 100.0f;
        - if: {condition: {lambda: 'return id(selected_light_idx) == 6;'}, then: [{script.execute: update_light_ui}]}

  # -- Bedroom media (primary / default target) --
  - platform: homeassistant
    id: media_title_bedroom
    entity_id: media_player.bedroom_sonos
    attribute: media_title
    on_value:
      then:
        - lambda: 'id(media_is_tv_bedroom) = (x == std::string("TV"));'
        - if: {condition: {lambda: 'return id(current_mode) == 0 && !id(media_is_club);'}, then: [{script.execute: update_media_ui}]}
        - script.execute: update_home_media
        - script.execute: apply_awake_brightness

  - platform: homeassistant
    id: ha_climate_fan
    entity_id: climate.aircon
    attribute: fan_mode
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 2;'}
            then: [{script.execute: update_climate_wheel}]

  - platform: homeassistant
    id: media_artist_bedroom
    entity_id: media_player.bedroom_sonos
    attribute: media_artist
    on_value:
      then:
        - if: {condition: {lambda: 'return id(current_mode) == 0 && !id(media_is_club);'}, then: [{script.execute: update_media_ui}]}
        - script.execute: update_home_media

  - platform: homeassistant
    id: media_state_bedroom
    entity_id: media_player.bedroom_sonos
    on_value:
      then:
        - lambda: 'id(media_playing_bedroom) = (x == std::string("playing"));'
        - script.execute: update_home_media

  # -- Club media (secondary target, only shown when toggled on) --
  - platform: homeassistant
    id: media_title_club
    entity_id: media_player.club
    attribute: media_title
    on_value:
      then:
        - lambda: 'id(media_is_tv_club) = (x == std::string("TV"));'
        - if: {condition: {lambda: 'return id(current_mode) == 0 && id(media_is_club);'}, then: [{script.execute: update_media_ui}]}

  - platform: homeassistant
    id: media_artist_club
    entity_id: media_player.club
    attribute: media_artist
    on_value:
      then:
        - if: {condition: {lambda: 'return id(current_mode) == 0 && id(media_is_club);'}, then: [{script.execute: update_media_ui}]}

  - platform: homeassistant
    id: media_state_club
    entity_id: media_player.club
    on_value:
      then:
        - lambda: 'id(media_playing_club) = (x == std::string("playing"));'

  - platform: homeassistant
    id: ha_climate_state
    entity_id: climate.aircon
    on_value:
      then:
        - lvgl.label.update: {id: climate_state_lbl, text: !lambda "return x;"}
        - if:
            condition: {lambda: 'return id(current_mode) == 2 && id(nav_level) == 2;'}
            then: [{script.execute: update_climate_wheel}]

  # BLINDS state (bedroom only)
  - platform: homeassistant
    id: ha_bed_blinds_state
    entity_id: cover.smart_blinds
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 1;'}
            then: [{script.execute: update_blind_state_lbl}]

