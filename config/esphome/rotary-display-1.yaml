number:
  - platform: template
    id: screen_offset_y
    name: "Screen offset Y"
    icon: "mdi:arrow-up-down"
    entity_category: config
    mode: box
    min_value: -12
    max_value: 12
    step: 1
    initial_value: 4
    optimistic: true
    restore_value: true
    unit_of_measurement: "px"
    on_value:
      then: [{script.execute: apply_offset}]
  - platform: template
    id: return_after
    name: "Return to Media after"
    icon: "mdi:timer-sand"
    entity_category: config
    mode: slider
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
  - platform: template
    id: night_brightness
    name: "Night Brightness"
    icon: "mdi:brightness-6"
    entity_category: config
    mode: slider
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(night_active);'}
            then:
              - light.control:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'
