substitutions:
  player: "media_player.club"
  room_name: "CLUB"
  group_vol: "true"
  has_tv: "true"
  pick_more: "true"
  has_home: "true"
  night_idle: 180s              # no interaction for this long -> faded clock
  night_clock_color: "0x9A5F2C" # warm amber: no blue light while sleeping
  night_date_color: "0x6E4526"

esphome:
  name: rotary-display-1
  friendly_name: rotary-display-1
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    - priority: 800
      then:
        - output.turn_on: lcd_power
        - output.turn_on: display_reset
        - delay: 100ms
        - output.turn_off: display_reset
        - delay: 500ms
    # after LVGL is up: paint the face canvases
    - priority: -100
      then:
        - script.execute: paint_vignette
        - script.execute: paint_faces
        - script.execute: {id: paint_bg, live: false}
        - script.execute: apply_offset
        - script.execute: set_face

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    
psram:
  mode: octal
  speed: 80MHz 

logger:
  hardware_uart: UART0

api:
  actions:
    # Test hook only: preview the alarm popup without touching Home Assistant.
    # mode 1 = ringing, 2 = snoozed, 0 = back to live. Reverts by itself after 25 s.
    - action: alarm_preview
      variables:
        mode: int
      then:
        - lambda: 'id(alarm_preview) = mode;'
        - script.execute: update_alarm
        - script.execute: alarm_preview_timeout
  encryption:
    key: !secret rotary_api_key

ota:
  - platform: esphome
    password: !secret ota_password rotary_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Rotary-Display-1"
    password: !secret rotary_ap_password

  use_address: <device-ip>
captive_portal:

web_server:
  port: 80

# --------------------------------------------------------


# HARDWARE & I2C
# --------------------------------------------------------
i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: true
  frequency: 400kHz

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz

  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode: output

  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode: output
      inverted: true

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0.5s
    restore_mode: ALWAYS_ON
    # Never let the screen go fully dark: if anything (HA, web UI) turns it
    # off, bounce it straight back on at the dim level.
    on_turn_off:
      - delay: 50ms
      - light.turn_on:
          id: display_backlight
          brightness: 55%

# --------------------------------------------------------
# IMAGE ASSETS
# --------------------------------------------------------

# --------------------------------------------------------
# BÆO REMOTE (media-only, Nocturne face). One source, two remotes:
#   rotary-display-1 drives Club (volume moves every grouped room),
#   rotary-display-2 drives the Bedroom only. See tt/assemble.py.
# Knob: turn = volume, hold + turn = scrub, press = play/pause,
#   double = next, triple = previous, hold = stop music on every speaker.
# current_mode: 0 now-playing · 5 pick to play · 9 inert (night clock / alarm popup)
#   has_home (coffee-table knob): 20 menu · 21 Climate · 22 Blinds · 23 Lights · 24 Scenes.
#   There, hold opens the menu instead of stopping all music, swipes move between
#   pages, and any page goes back to Media after "Return to Media after".
# idle -> dim face while playing, else the night clock (grp_night, top layer)
# --------------------------------------------------------
http_request:
  verify_ssl: false
  timeout: 2s

image:
  - file: "tt/art_ph.png"
    id: art_ph
    type: RGB565
  # pick-to-play LP labels (order = script.rotary_play pick numbers)
  - file: "tt/covers/pdm_london.png"
    id: cv_pdm_london
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/pdm_paradise.png"
    id: cv_pdm_paradise
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/dfp_love.png"
    id: cv_dfp_love
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/dfp_boiler.png"
    id: cv_dfp_boiler
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/gayfm.png"
    id: cv_gayfm
    type: RGB565
    transparency: alpha_channel

online_image:
  - id: album_blur
    url: "http://<ha-ip>:8123/local/rotary-no-art.jpg"
    format: AUTO
    type: RGB565
    resize: 24x24
    update_interval: never
    on_download_finished:
      - lambda: 'id(art_ok) = true;'
      - script.execute: {id: paint_bg, live: true}
    on_error:
      - lambda: 'id(art_ok) = false;'

globals:
  - id: alarm_state
    type: int
    initial_value: '0'
  - id: alarm_popup_up
    type: bool
    initial_value: 'false'
  - id: alarm_view_hidden
    type: bool
    initial_value: 'false'
  - id: alarm_pulse
    type: bool
    initial_value: 'false'
  - id: alarm_preview
    type: int
    initial_value: '0'
  - id: alarm_time_txt
    type: std::string
    initial_value: '"--:--"'
  - id: alarm_ampm_txt
    type: std::string
    initial_value: '""'
  - id: alarm_what_txt
    type: std::string
    initial_value: '""'
  - id: alarm_start_txt
    type: std::string
    initial_value: '""'
  - id: alarm_back_txt
    type: std::string
    initial_value: '""'
  - id: night_active
    type: bool
    initial_value: 'false'
  - id: night_armed
    type: bool
    initial_value: 'false'
  - id: nav_level              # kept for the alarm scripts; unused otherwise
    type: int
    initial_value: '0'
  - id: current_mode
    type: int
    initial_value: '0'
  - id: pa                     # scratch: mode captured at the start of an action
    type: int
    initial_value: '0'
  - id: media_playing
    type: bool
    initial_value: 'false'
  - id: media_is_tv
    type: bool
    initial_value: 'false'
  - id: last_title
    type: std::string
    initial_value: '""'
  # Whole entity_picture last fetched, token included. Keyed on the full URL because
  # Home Assistant issues a new token at every restart: keyed on "cache=" alone, the
  # knob kept retrying the old URL, and five refused fetches get its IP banned by HA.
  - id: art_key
    type: std::string
    initial_value: '""'
  - id: art_tries              # retries spent on the current artwork URL (max 2)
    type: int
    initial_value: '0'
  - id: art_ok                 # last album-art download succeeded
    type: bool
    initial_value: 'true'
  - id: vol_local              # 0..1, what the ticks show
    type: float
    initial_value: '0.3'
  - id: vol_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: pos_s
    type: float
    initial_value: '0'
  - id: dur_s
    type: float
    initial_value: '0'
  - id: seek_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: hud_active
    type: bool
    initial_value: 'false'
  - id: hud_kind               # 1 volume · 2 scrub
    type: int
    initial_value: '0'
  - id: turned_while_held
    type: bool
    initial_value: 'false'
  - id: vol_sent               # last level sent to HA (group volume moves by the difference)
    type: float
    initial_value: '0.3'
  - id: room_txt               # "CLUB" / "CLUB + LIVING ROOM" / "CLUB + 3 ROOMS"
    type: std::string
    initial_value: '"${room_name}"'
  - id: toast_ms               # artist line shows a toast until then
    type: uint32_t
    initial_value: '0'
  - id: hold_hint
    type: bool
    initial_value: 'false'
  - id: pick_sel               # pick-to-play: which LP is in the middle
    type: int
    initial_value: '0'
  - id: pick_open_ms           # taps right after opening don't count as a pick
    type: uint32_t
    initial_value: '0'
  - id: user_wake              # this wake came from a hand on the knob / glass
    type: bool
    initial_value: 'false'
  - id: wake_by_user
    type: bool
    initial_value: 'false'
  - id: pick_started_ms        # a pick was just sent: give Sonos time to start it
    type: uint32_t
    initial_value: '0'
  - id: paused_ms              # when the player went to paused (0 = not paused)
    type: uint32_t
    initial_value: '0'
  - id: pick_ok                # picker allowed on a touch / press (set by pick_check)
    type: bool
    initial_value: 'false'
  - id: pick_turn_ok           # ...and on a knob turn (never on TV: the turn stays volume)
    type: bool
    initial_value: 'false'
  - id: tx0                    # touch start / latest x, for swipes on the picker
    type: int
    initial_value: '0'
  - id: tx1
    type: int
    initial_value: '0'
  - id: swipe_ms               # a swipe just happened: the tap under it doesn't count
    type: uint32_t
    initial_value: '0'
  - id: tv_title               # what's on the TV (borrowed from Plex / the Streamer)
    type: std::string
    initial_value: '""'
  - id: tv_sub
    type: std::string
    initial_value: '""'
  - id: tv_pic
    type: std::string
    initial_value: '""'
  # --- home pages (has_home)
  - id: ty0                    # touch start / latest y, to tell swipes from taps
    type: int
    initial_value: '0'
  - id: ty1
    type: int
    initial_value: '0'
  - id: hm_sel                 # menu: highlighted page 0 Media · 1 Climate · 2 Blinds · 3 Lights
    type: int
    initial_value: '1'
  - id: htp                    # scratch for home_tap
    type: int
    initial_value: '0'
  - id: ac_mode                # climate.aircon state (off / cool / heat / heat_cool / dry / fan_only)
    type: std::string
    initial_value: '"off"'
  - id: ac_last_mode           # what "on" means
    type: std::string
    initial_value: '"cool"'
  - id: ac_fan
    type: std::string
    initial_value: '"auto"'
  - id: ac_set                 # setpoint shown (local while turning)
    type: int
    initial_value: '23'
  - id: ac_room
    type: float
    initial_value: 'NAN'
  - id: ac_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: bl_sel                 # 0 Sofa (cover.blinds) · 1 Sheer
    type: int
    initial_value: '0'
  - id: bl_pos0                # % open, as the motor reports it (-1 unknown)
    type: int
    initial_value: '-1'
  - id: bl_pos1
    type: int
    initial_value: '-1'
  - id: bl_tgt0                # % open asked for (-1: follow the motor)
    type: int
    initial_value: '-1'
  - id: bl_tgt1
    type: int
    initial_value: '-1'
  - id: bl_dir0                # +1 opening · -1 closing · 0 still (physical, after inversion)
    type: int
    initial_value: '0'
  - id: bl_dir1
    type: int
    initial_value: '0'
  - id: bl_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: li_on
    type: bool
    initial_value: 'false'
  - id: li_bri                 # 0..100
    type: int
    initial_value: '0'
  - id: li_acc                 # detents not yet sent (each = 10%)
    type: int
    initial_value: '0'
  - id: li_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: li_scene               # last scene set from the knob (-1 none)
    type: int
    initial_value: '-1'
  - id: sc_idx                 # Scenes carousel position
    type: int
    initial_value: '2'

script:
  # ══ WORK ALARM POPUP ═══════════════════════════════════════════════════════
  # Recompute from HA every time either entity changes; never track our own state.
  #   ringing off                  -> HIDDEN
  #   ringing on, timer not active -> RINGING
  #   ringing on, timer active     -> SNOOZED
  - id: update_alarm
    mode: restart
    then:
      - lambda: |-
          bool ring = id(alarm_ringing).state;
          bool snz = ring && id(alarm_snooze_state).state == "active";
          int st = !ring ? 0 : (snz ? 2 : 1);
          if (id(alarm_preview) == 1) st = 1;        // test hook
          else if (id(alarm_preview) == 2) st = 2;
          if (st != 2) id(alarm_view_hidden) = false;  // rings again -> show again
          id(alarm_state) = st;
      - if:
          condition: {lambda: 'return id(alarm_state) == 1 || (id(alarm_state) == 2 && !id(alarm_view_hidden));'}
          then:
            - script.execute: alarm_show
          else:
            - script.execute: alarm_hide

  - id: alarm_show
    then:
      - lambda: |-
          id(alarm_popup_up) = true;
          id(current_mode) = 9;     // inert: knob/button can't act on the page underneath
          id(nav_level) = 0;
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            # RINGING: wake the screen, even from the night clock
            - lambda: 'id(night_active) = false;'
            - lvgl.widget.hide: grp_night
            - light.control: {id: display_backlight, brightness: 100%}
      - script.execute: alarm_render
      - lvgl.widget.show: grp_alarm
      # Restart the idle countdown (relevant once snoozed: the screen may time out)
      - if:
          condition: {lambda: 'return id(alarm_state) == 2 && !id(night_active);'}
          then: [{script.execute: screen_timeout_timer}]

  - id: alarm_hide
    then:
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then:
            - lambda: 'id(alarm_popup_up) = false;'
            - lvgl.widget.hide: grp_alarm
            - script.stop: alarm_hold
            - lvgl.bar.update: {id: alarm_hold_bar, value: 0}
            - if:
                condition: {lambda: 'return !id(night_active);'}
                then:
                  - script.execute: switch_to_home
                  - script.execute: screen_timeout_timer

  - id: alarm_render
    then:
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            - lvgl.obj.update: {id: alarm_icon_bg, bg_color: 0xF59E0B, bg_opa: 40%}
            - lvgl.label.update: {id: alarm_icon_lbl, text_color: 0xF59E0B}
            - lvgl.label.update: {id: alarm_caps_lbl, text: "ALARM", text_color: 0xF59E0B}
            - lvgl.widget.show: btn_alarm_snooze
            - lvgl.widget.hide: btn_alarm_hide
            - lvgl.widget.hide: alarm_back_lbl
          else:
            - lvgl.obj.update: {id: alarm_icon_bg, bg_color: 0x3B82F6, bg_opa: 30%}
            - lvgl.label.update: {id: alarm_icon_lbl, text_color: 0x60A5FA}
            - lvgl.label.update: {id: alarm_caps_lbl, text: "SNOOZED", text_color: 0x60A5FA}
            - lvgl.widget.hide: btn_alarm_snooze
            - lvgl.widget.show: btn_alarm_hide
            - lvgl.widget.show: alarm_back_lbl
      - script.execute: alarm_refresh_text

  # Clock, "what it's for", "Starts at", and the snooze countdown.
  - id: alarm_refresh_text
    then:
      - lambda: |-
          // ISO-8601 (with offset, or Z) -> epoch seconds
          auto parse_iso = [](const std::string &s, time_t &out) -> bool {
            int Y = 0, M = 0, D = 0, h = 0, m = 0, sec = 0;
            if (sscanf(s.c_str(), "%d-%d-%d%*c%d:%d:%d", &Y, &M, &D, &h, &m, &sec) != 6) return false;
            int off = 0;
            size_t p = s.find_first_of("+-Zz", 19);
            if (p != std::string::npos && s[p] != 'Z' && s[p] != 'z') {
              int oh = 0, om = 0;
              sscanf(s.c_str() + p + 1, "%d:%d", &oh, &om);
              off = (oh * 3600 + om * 60) * (s[p] == '-' ? -1 : 1);
            }
            int y = Y - (M <= 2 ? 1 : 0);
            int era = (y >= 0 ? y : y - 399) / 400;
            int yoe = y - era * 400;
            int doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
            int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
            long days = (long) era * 146097L + doe - 719468L;
            out = (time_t) (days * 86400L + h * 3600L + m * 60L + sec - off);
            return true;
          };
          auto ok = [](const std::string &v) {
            return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None");
          };
          auto now = id(ha_time).now();

          // current time, 12-hour
          if (now.is_valid()) {
            int h12 = now.hour % 12; if (h12 == 0) h12 = 12;
            char b[12]; snprintf(b, sizeof(b), "%d:%02d", h12, now.minute);
            id(alarm_time_txt) = b;
            id(alarm_ampm_txt) = now.hour >= 12 ? "PM" : "AM";
          } else { id(alarm_time_txt) = "--:--"; id(alarm_ampm_txt) = ""; }

          // what it's for: summary · location
          std::string w = ok(id(alarm_work_summary).state) ? id(alarm_work_summary).state : "";
          if (ok(id(alarm_work_location).state))
            w += w.empty() ? id(alarm_work_location).state : " · " + id(alarm_work_location).state;
          if (w.empty() && id(alarm_preview) != 0) w = "Preview alarm · RSC";
          id(alarm_what_txt) = w;

          // Starts at (start time is UTC; show local)
          time_t t;
          if (parse_iso(id(alarm_work_start).state, t)) {
            auto lt = ESPTime::from_epoch_local(t);
            int h12 = lt.hour % 12; if (h12 == 0) h12 = 12;
            char b[40]; snprintf(b, sizeof(b), "Starts at %d:%02d %s", h12, lt.minute, lt.hour >= 12 ? "PM" : "AM");
            id(alarm_start_txt) = b;
          } else {
            id(alarm_start_txt) = id(alarm_preview) != 0 ? "Starts at 8:15 AM" : "";
          }

          // snooze countdown
          id(alarm_back_txt) = "";
          if (id(alarm_state) == 2) {
            time_t f;
            if (id(alarm_preview) == 2) id(alarm_back_txt) = "Back in 4:32";
            else if (now.is_valid() && parse_iso(id(alarm_snooze_finish).state, f)) {
              long rem = (long) f - (long) now.timestamp; if (rem < 0) rem = 0;
              char b[24]; snprintf(b, sizeof(b), "Back in %ld:%02ld", rem / 60, rem % 60);
              id(alarm_back_txt) = b;
            }
          }
      - lvgl.label.update: {id: alarm_time_lbl, text: !lambda 'return id(alarm_time_txt);'}
      - lvgl.label.update: {id: alarm_ampm_lbl, text: !lambda 'return id(alarm_ampm_txt);'}
      - lvgl.label.update: {id: alarm_what_lbl, text: !lambda 'return id(alarm_what_txt);'}
      - lvgl.label.update: {id: alarm_start_lbl, text: !lambda 'return id(alarm_start_txt);'}
      - lvgl.label.update: {id: alarm_back_lbl, text: !lambda 'return id(alarm_back_txt);'}

  # Hold-to-dismiss: a red fill sweeps across in ~0.9 s; letting go early cancels.
  # Dismiss runs "stop for today" (also cancels the 2nd alarm), hence the hold.
  - id: alarm_hold
    mode: restart
    then:
      - repeat:
          count: 18
          then:
            - lvgl.bar.update: {id: alarm_hold_bar, value: !lambda 'return (iteration + 1) * 100 / 18;'}
            - delay: 50ms
      - homeassistant.action: {action: script.turn_on, data: {entity_id: script.work_alarm_stop}}
      - lvgl.bar.update: {id: alarm_hold_bar, value: 0}

  - id: alarm_preview_timeout
    mode: restart
    then:
      - delay: 25s
      - lambda: 'id(alarm_preview) = 0;'
      - script.execute: update_alarm
  # ══ IDLE -> NIGHT CLOCK (unchanged behaviour) ══════════════════════════════
  - id: screen_timeout_timer
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then:
            - script.execute: wake_from_night
          else:
            - lambda: 'id(user_wake) = false;'
            - script.execute: apply_awake_brightness
      - delay: ${night_idle}
      - if:
          condition: {lambda: 'return id(party_mode).state;'}
          then:
            - if:
                condition: {lambda: 'return id(current_mode) != 0 && id(current_mode) != 9;'}
                then: [{script.execute: switch_to_now}]
          else:
            - if:
                condition: {lambda: 'return id(alarm_state) != 1;'}
                then:
                  # music playing: keep the now-playing face, just dim it
                  - if:
                      condition: {lambda: 'return id(media_playing);'}
                      then: [{script.execute: dim_while_playing}]
                      else: [{script.execute: enter_night}]

  # Day: 40% backlight. 22:00-07:00: the "Night Brightness" slider.
  - id: dim_while_playing
    then:
      - if:
          condition: {lambda: 'return !id(night_active) && id(current_mode) == 0;'}
          then:
            - light.control:
                id: display_backlight
                brightness: !lambda |-
                  auto t = id(ha_time).now();
                  bool late = t.is_valid() && (t.hour >= 22 || t.hour < 7);
                  return late ? id(night_brightness).state / 100.0f : 0.4f;

  - id: apply_awake_brightness
    then:
      - if:
          condition: {lambda: 'return !id(night_active);'}
          then:
            - light.control:
                id: display_backlight
                brightness: !lambda 'return id(media_is_tv) ? 0.5f : 1.0f;'

  - id: enter_night
    then:
      - if:
          condition: {lambda: 'return !id(party_mode).state;'}
          then:
            - lambda: |-
                id(night_active) = true;
                id(current_mode) = 9;
            - script.execute: update_night_clock
            - lvgl.widget.show: grp_night
            # the "Night Brightness" slider is for 22:00-07:00; by day the idle
            # clock stays readable (never below 40%)
            - light.control:
                id: display_backlight
                brightness: !lambda |-
                  auto t = id(ha_time).now();
                  bool late = t.is_valid() && (t.hour >= 22 || t.hour < 7);
                  float nb = id(night_brightness).state / 100.0f;
                  return late ? nb : (nb > 0.4f ? nb : 0.4f);

  - id: wake_from_night
    mode: restart
    then:
      - lambda: 'id(night_active) = false; id(wake_by_user) = id(user_wake); id(user_wake) = false;'
      - script.execute: pick_check
      - light.control:
          id: display_backlight
          brightness: !lambda 'return id(media_is_tv) ? 0.5f : 1.0f;'
      # the waking touch / turn / press is swallowed
      - delay: 350ms
      - lvgl.widget.hide: grp_night
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then: [{lambda: 'id(current_mode) = 9;'}]
          else:
            - if:
                condition: {lambda: 'return id(wake_by_user) && id(pick_turn_ok);'}
                then: [{script.execute: open_picker}]
                else: [{script.execute: switch_to_now}]

  - id: update_night_clock
    then:
      - lvgl.label.update:
          id: night_clock_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);

  - id: update_clock
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          char b[8];
          if (t.is_valid()) snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
          else snprintf(b, sizeof(b), "--:--");
          lv_label_set_text((lv_obj_t *) id(noc_clk), b);

  # ══ FACES ═══════════════════════════════════════════════════════════════
  # The night face, painted once at boot into an RGB565 canvas.
  # A little hash dither keeps the smooth gradients from banding in 16-bit.
  - id: paint_faces
    then:
      - lambda: |-
          auto hsh = [](uint32_t v) { v ^= v >> 16; v *= 0x7feb352d; v ^= v >> 15; v *= 0x846ca68b; v ^= v >> 16; return v; };
          // 3-stop gradient: c0 at 0, c1 at m, c2 at 1
          auto grad = [](float t, const float *c0, const float *c1, const float *c2, float m, float *o) {
            t = t < 0 ? 0 : (t > 1 ? 1 : t);
            if (t < m) { float u = t / m; for (int i = 0; i < 3; i++) o[i] = c0[i] + (c1[i] - c0[i]) * u; }
            else { float u = (t - m) / (1 - m); for (int i = 0; i < 3; i++) o[i] = c1[i] + (c2[i] - c1[i]) * u; }
          };
          const float RF = 215.0f;                                   // face radius; bezel beyond
          const float n0[3] = {0x16, 0x1A, 0x1C}, n1[3] = {0x0C, 0x0E, 0x10}, n2[3] = {0x05, 0x06, 0x07};   // night (Sea glass graphite)
          const float b0[3] = {0x2A, 0x2A, 0x2E}, b2[3] = {0x0B, 0x0B, 0x0C};                               // bezel
          lv_obj_t *cvs[1] = {(lv_obj_t *) id(nt_cv)};
          for (int k = 0; k < 1; k++) {
            lv_draw_buf_t *db = lv_canvas_get_draw_buf(cvs[k]);
            if (db == nullptr) continue;
            for (int y = 0; y < 480; y++) {
              uint16_t *row = (uint16_t *) (db->data + y * db->header.stride);
              if ((y & 31) == 0) App.feed_wdt();
              for (int x = 0; x < 480; x++) {
                float dx = x - 240, dy = y - 240, r = sqrtf(dx * dx + dy * dy);
                float c[3];
                if (r >= RF) {
                  // dark radial bezel, a touch lighter towards the face and the top left
                  float t = (r - RF) / (240.0f - RF), lit = r > 0 ? -(dx * 0.5f + dy * 0.85f) / r : 0;
                  for (int i = 0; i < 3; i++) c[i] = b0[i] + (b2[i] - b0[i]) * t + lit * 5.0f;
                  if (r < RF + 1.5f) for (int i = 0; i < 3; i++) c[i] *= 0.55f;          // fine seam
                } else {
                  grad(r / 304.0f, n0, n1, n2, 0.60f, c);
                }
                uint32_t nz = hsh(x * 7919u + y * 104729u);
                float d = ((nz & 255) / 255.0f - 0.5f) * 7.0f;               // ~1 LSB of RGB565
                int ci[3];
                for (int i = 0; i < 3; i++) { float v = c[i] + d; ci[i] = v < 0 ? 0 : (v > 255 ? 255 : (int) v); }
                row[x] = lv_color_to_u16(lv_color_make(ci[0], ci[1], ci[2]));
              }
            }
            lv_obj_invalidate(cvs[k]);
          }
          // Manrope Light numerals run a little tight (-2 px); YAML won't take negative tracking
          for (lv_obj_t *o : {(lv_obj_t *) id(night_clock_lbl), (lv_obj_t *) id(noc_num)})
            lv_obj_set_style_text_letter_space(o, -2, LV_PART_MAIN);

  # Nocturne background: the (tiny) album art blown up to the whole screen with a
  # cubic B-spline, which is smooth by construction, so it reads as a soft blur
  # instead of LVGL's blocky zoom. live=false paints the placeholder.
  - id: paint_bg
    parameters:
      live: bool
    then:
      - lambda: |-
          image::Image *im = live ? static_cast<image::Image *>(id(album_blur)) : id(art_ph);
          int w = im->get_width(), h = im->get_height();
          lv_draw_buf_t *db = lv_canvas_get_draw_buf((lv_obj_t *) id(noc_bg));
          if (db == nullptr || w < 2 || h < 2) return;
          float *src = (float *) heap_caps_malloc(w * h * 3 * sizeof(float), MALLOC_CAP_SPIRAM);
          float *tmp = (float *) heap_caps_malloc(h * 480 * 3 * sizeof(float), MALLOC_CAP_SPIRAM);
          if (src == nullptr || tmp == nullptr) { free(src); free(tmp); return; }
          for (int y = 0; y < h; y++)
            for (int x = 0; x < w; x++) {
              Color p = im->get_pixel(x, y);
              float *s = src + (y * w + x) * 3; s[0] = p.r; s[1] = p.g; s[2] = p.b;
            }
          // centred square crop, zoomed a touch so the edges fall off-screen (cover)
          float m = (w < h ? w : h) * 0.92f, x0 = (w - m) / 2.0f, y0 = (h - m) / 2.0f, sc = m / 480.0f;
          auto wts = [](float t, float *k) {
            float t2 = t * t, t3 = t2 * t, u = 1 - t;
            k[0] = u * u * u / 6; k[1] = (3 * t3 - 6 * t2 + 4) / 6; k[2] = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6; k[3] = t3 / 6;
          };
          auto cl = [](int v, int n) { return v < 0 ? 0 : (v >= n ? n - 1 : v); };
          for (int x = 0; x < 480; x++) {                       // pass 1: rows -> 480 wide
            float u = x0 + (x + 0.5f) * sc - 0.5f; int i = (int) floorf(u); float k[4]; wts(u - i, k);
            for (int y = 0; y < h; y++) {
              float *o = tmp + (y * 480 + x) * 3; o[0] = o[1] = o[2] = 0;
              for (int q = 0; q < 4; q++) { const float *s = src + (y * w + cl(i - 1 + q, w)) * 3; o[0] += s[0] * k[q]; o[1] += s[1] * k[q]; o[2] += s[2] * k[q]; }
            }
          }
          auto hsh = [](uint32_t v) { v ^= v >> 16; v *= 0x7feb352d; v ^= v >> 15; v *= 0x846ca68b; v ^= v >> 16; return v; };
          for (int y = 0; y < 480; y++) {                       // pass 2: columns -> 480 tall
            if ((y & 31) == 0) App.feed_wdt();
            float v = y0 + (y + 0.5f) * sc - 0.5f; int j = (int) floorf(v); float k[4]; wts(v - j, k);
            const float *r0 = tmp + cl(j - 1, h) * 1440, *r1 = tmp + cl(j, h) * 1440, *r2 = tmp + cl(j + 1, h) * 1440, *r3 = tmp + cl(j + 2, h) * 1440;
            uint16_t *row = (uint16_t *) (db->data + y * db->header.stride);
            for (int x = 0; x < 480; x++) {
              int ci[3]; float d = ((hsh(x * 7919u + y * 104729u) & 255) / 255.0f - 0.5f) * 7.0f;
              for (int c = 0; c < 3; c++) {
                float f = r0[x * 3 + c] * k[0] + r1[x * 3 + c] * k[1] + r2[x * 3 + c] * k[2] + r3[x * 3 + c] * k[3] + d;
                ci[c] = f < 0 ? 0 : (f > 255 ? 255 : (int) f);
              }
              row[x] = lv_color_to_u16(lv_color_make(ci[0], ci[1], ci[2]));
            }
          }
          free(src); free(tmp);
          lv_obj_invalidate((lv_obj_t *) id(noc_bg));

  # Nocturne: dark radial wash + a faint top-left reflection over the cover bloom
  - id: paint_vignette
    then:
      - lambda: |-
          lv_draw_buf_t *db = lv_canvas_get_draw_buf((lv_obj_t *) id(noc_vig));
          if (db == nullptr) return;
          for (int y = 0; y < 480; y++) {
            uint32_t *row = (uint32_t *) (db->data + y * db->header.stride);
            if ((y & 31) == 0) App.feed_wdt();
            for (int x = 0; x < 480; x++) {
              float dx = x - 240, dy = y - 240, r = sqrtf(dx * dx + dy * dy);
              if (r >= 222.0f) {                           // glossy black band around the glass
                float ny = dy / r;
                int v = 7 + (int) ((r < 224.0f ? (224.0f - r) : 0) * 3) + (int) (-ny * 5);
                v = v < 3 ? 3 : v;
                row[x] = 0xFF000000u | ((uint32_t) v << 16) | ((uint32_t) v << 8) | (uint32_t) (v + 1);
              } else {                                     // smoked glass: darker towards the band
                float q = r / 222.0f;
                float a = 0.46f + 0.44f * q * q;
                float rx = (x - 150) / 200.0f, ry = (y - 20) / 120.0f, g = 1.0f - (rx * rx + ry * ry);
                if (g > 0) {
                  float gl = g * 0.08f;
                  uint8_t w = (uint8_t) (255 * gl / (a + gl));
                  row[x] = ((uint32_t) (uint8_t) ((a + gl) * 255) << 24) | ((uint32_t) w << 16) | ((uint32_t) w << 8) | w;
                } else row[x] = ((uint32_t) (uint8_t) (a * 255) << 24) | 0x050506;
              }
            }
          }
          lv_obj_invalidate((lv_obj_t *) id(noc_vig));

  # nudge the whole UI vertically so it sits centred in the physical ring
  - id: apply_offset
    then:
      - lambda: |-
          int dy = (int) id(screen_offset_y).state;
          lv_obj_t *roots[2] = {lv_screen_active(), lv_layer_top()};
          for (auto root : roots) {
            uint32_t n = lv_obj_get_child_count(root);
            for (uint32_t i = 0; i < n; i++) lv_obj_set_style_translate_y(lv_obj_get_child(root, i), dy, LV_PART_MAIN);
          }

  - id: set_face
    then:
      - lambda: 'lv_obj_remove_flag((lv_obj_t *) id(grp_noc), LV_OBJ_FLAG_HIDDEN);'
      # coffee-table knob: the ring becomes a speedometer from by the B of BÆOSOUND to by
      # the D (-140°..140° from the top), with the page dots in its gap
      - lambda: |-
          if (!${has_home}) return;
          for (lv_obj_t *o : {(lv_obj_t *) id(noc_ring), (lv_obj_t *) id(noc_glow), (lv_obj_t *) id(noc_prog)}) {
            lv_arc_set_rotation(o, 130);
            lv_arc_set_bg_angles(o, 0, 280);
          }
          for (lv_obj_t *o : {(lv_obj_t *) id(hd_0), (lv_obj_t *) id(hd_1), (lv_obj_t *) id(hd_2), (lv_obj_t *) id(hd_3)})
            lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
      - script.execute: update_np
      - script.execute: update_clock

  # knob turned / scrubbed: big numeral + lit volume
  - id: face_hud
    then:
      - lambda: |-
          char b[16];
          if (id(hud_kind) == 1) snprintf(b, sizeof(b), "%d", (int) roundf(id(vol_local) * 100));
          else { int t = (int) id(pos_s); snprintf(b, sizeof(b), "%d:%02d", t / 60, t % 60); }
          int v = (int) roundf(id(vol_local) * 100);
          {
            lv_label_set_text((lv_obj_t *) id(noc_num), b);
            lv_obj_remove_flag((lv_obj_t *) id(noc_num), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
            lv_arc_set_value((lv_obj_t *) id(noc_ring), v);
            lv_obj_set_style_arc_width((lv_obj_t *) id(noc_ring), 3, LV_PART_INDICATOR);
            lv_arc_set_value((lv_obj_t *) id(noc_glow), v);
          }

  - id: face_hud_end
    then:
      - lambda: |-
          lv_obj_add_flag((lv_obj_t *) id(noc_num), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN); lv_obj_remove_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_arc_width((lv_obj_t *) id(noc_ring), 2, LV_PART_INDICATOR);

  # ══ NAVIGATION ════════════════════════════════════════════════════════════
  # The alarm scripts call switch_to_home; it is the now-playing deck now.
  - id: switch_to_home
    then: [{script.execute: switch_to_now}]

  - id: switch_to_now
    then:
      - script.stop: pick_timeout
      - script.execute: home_leave
      - lambda: |-
          id(current_mode) = 0;
          lv_obj_add_flag((lv_obj_t *) id(pk_grp), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
      - script.execute: update_np
      - script.execute: update_clock

  # ══ PICK TO PLAY ══════════════════════════════════════════════════════════
  # Nothing playing + a hand on the knob or glass: little LPs to choose from.
  # Turn = browse, press or tap the middle one = play, hold = back.
  # When the picker may open. Club (pick_more): stopped, paused for over a
  # minute, or on the TV input. Bedroom: whenever nothing is playing.
  - id: pick_check
    then:
      - lambda: |-
          bool paused = id(media_state).state == "paused", tv = id(media_is_tv);
          if (${pick_more}) {
            bool long_pause = paused && id(paused_ms) != 0 && millis() - id(paused_ms) > 60000;
            id(pick_ok) = (!id(media_playing) && !tv && !paused) || long_pause || tv;
            id(pick_turn_ok) = id(pick_ok) && !tv;
          } else {
            id(pick_ok) = !id(media_playing) && !tv;
            id(pick_turn_ok) = id(pick_ok);
          }
          // a pick is still starting (streams can take a few seconds): don't reopen
          if (id(pick_started_ms) != 0 && millis() - id(pick_started_ms) < 15000 && !id(media_playing))
            id(pick_ok) = id(pick_turn_ok) = false;

  - id: open_picker
    then:
      - script.execute: home_leave
      - lambda: |-
          id(current_mode) = 5;
          id(pick_open_ms) = millis();
          lv_obj_add_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag((lv_obj_t *) id(noc_num), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(pk_grp), LV_OBJ_FLAG_HIDDEN);
      - script.execute: pick_render
      - script.execute: update_np
      - script.execute: pick_timeout

  - id: pick_timeout
    mode: restart
    then:
      - delay: 20s
      - if:
          condition: {lambda: 'return id(current_mode) == 5;'}
          then: [{script.execute: switch_to_now}]

  - id: pick_move
    parameters:
      dir: int
    then:
      - lambda: 'id(pick_sel) = (id(pick_sel) + dir + 5) % 5;'
      - script.execute: pick_render
      - script.execute: pick_timeout

  - id: pick_render
    then:
      - lambda: |-
          static image::Image *const cv[5] = {id(cv_pdm_london), id(cv_pdm_paradise), id(cv_dfp_love), id(cv_dfp_boiler), id(cv_gayfm)};
          int s = id(pick_sel);
          lv_image_set_src((lv_obj_t *) id(pk_c_cv), cv[s]->get_lv_image_dsc());
          lv_image_set_src((lv_obj_t *) id(pk_l_cv), cv[(s + 4) % 5]->get_lv_image_dsc());
          lv_image_set_src((lv_obj_t *) id(pk_r_cv), cv[(s + 1) % 5]->get_lv_image_dsc());

  # taps on the LPs: middle = play, sides = bring it to the middle
  - id: pick_tap
    mode: restart
    parameters:
      which: int
    then:
      - delay: 80ms
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && millis() - id(swipe_ms) > 300;'}
          then:
            - script.execute: screen_timeout_timer
            - if:
                condition: {lambda: 'return which == 0;'}
                then: [{script.execute: pick_play}]
                else: [{script.execute: {id: pick_move, dir: !lambda 'return which;'}}]

  - id: pick_play
    then:
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && millis() - id(pick_open_ms) > 600;'}
          then:
            - homeassistant.action:
                action: script.rotary_play
                data:
                  entity: "${player}"
                  pick: !lambda 'return id(pick_sel);'
            - lambda: 'id(pick_started_ms) = millis();'
            - script.execute: switch_to_now
            - script.execute: {id: toast, msg: "STARTING"}

  # ══ HOME PAGES (has_home: the coffee-table knob) ══════════════════════════
  # Media · Climate · Blinds · Lights sit side by side. Swipe between them or hold
  # for the menu. Turn = the page's value, press = its main action, taps = chips.
  # State lives in HA; the knob only shows targets early while you turn.
  - id: home_render
    then:
      - lambda: |-
          if (!${has_home}) return;
          auto show = [](lv_obj_t *o, bool s) { if (s) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); };
          auto txt = [](lv_obj_t *o, const std::string &v) { lv_label_set_text(o, v.c_str()); };
          auto up = [](std::string v) { for (auto &c : v) if ((unsigned char) c < 0x80) c = toupper((unsigned char) c); return v; };
          auto chip = [](lv_obj_t *o, lv_obj_t *l, bool on, uint32_t col) {
            lv_obj_set_style_bg_color(o, lv_color_hex(on ? col : 0xEDF2EF), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(o, on ? LV_OPA_COVER : 20, LV_PART_MAIN);
            lv_obj_set_style_border_width(o, on ? 0 : 1, LV_PART_MAIN);
            lv_obj_set_style_text_color(l, lv_color_hex(on ? 0x12201E : 0xEDF2EF), LV_PART_MAIN);
          };
          auto mcol = [](const std::string &m) -> uint32_t {
            if (m == "heat") return 0xEAC3BD; if (m == "heat_cool") return 0x8FB3C2;
            if (m == "dry") return 0xA3BBAE; if (m == "fan_only") return 0xEDF2EF; return 0x8CBDB5; };
          auto mname = [](const std::string &m) -> std::string {
            if (m == "cool") return "Cool"; if (m == "heat") return "Heat"; if (m == "heat_cool") return "Auto";
            if (m == "dry") return "Dry"; if (m == "fan_only") return "Fan"; return "Off"; };
          auto pname = [](int p) -> std::string {
            if (p <= 0) return "Closed"; if (p >= 100) return "Open"; if (p == 50) return "Half open";
            char b[16]; snprintf(b, sizeof(b), "%d%% open", p); return std::string(b); };
          static const char *const PAGE[4] = {"Media", "Climate", "Blinds", "Lights"};
          static const char *const SCN[7] = {"Bae", "White", "Tokyo", "Miami", "Santorini", "Soho", "Night"};
          static const uint32_t SC0[7] = {0xE6BCB6, 0xFFFFFF, 0xE3ACA4, 0xE6BCB6, 0x8FB3C2, 0x7A2E43, 0x2F3E4C};
          static const uint32_t SC1[7] = {0x8CBDB5, 0xC9D6D0, 0x33596A, 0x8FB3C2, 0xEDF2EF, 0xE6BCB6, 0x456A78};
          int m = id(current_mode);
          bool homem = m >= 20 && m <= 24;
          int page = m == 20 ? id(hm_sel) : (m >= 21 && m <= 23 ? m - 20 : (m == 24 ? 3 : 0));
          const std::string &am = id(ac_mode);
          bool ac_on = !(am == "off" || am == "unknown" || am == "unavailable" || am.empty());
          int p0 = id(bl_pos0) < 0 ? 0 : id(bl_pos0), p1 = id(bl_pos1) < 0 ? 0 : id(bl_pos1);
          int t0 = id(bl_tgt0) < 0 ? p0 : id(bl_tgt0), t1 = id(bl_tgt1) < 0 ? p1 : id(bl_tgt1);
          // page dots: wide = this page; colour = status (music, aircon, a blind open, lights on)
          bool has[4] = {id(media_playing), ac_on, p0 > 0 || p1 > 0, id(li_on)};
          uint32_t sc[4] = {0xEDF2EF, mcol(am), 0xA3BBAE, 0xF5D76E};
          lv_obj_t *dots[4] = {((lv_obj_t *) id(hd_0)), ((lv_obj_t *) id(hd_1)), ((lv_obj_t *) id(hd_2)), ((lv_obj_t *) id(hd_3))};
          for (int i = 0; i < 4; i++) {
            bool on = i == page;
            lv_obj_set_width(dots[i], on ? 20 : 8);
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(has[i] ? sc[i] : 0xEDF2EF), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(dots[i], has[i] ? LV_OPA_COVER : (on ? 230 : 66), LV_PART_MAIN);
          }
          show(((lv_obj_t *) id(grp_menu)), m == 20); show(((lv_obj_t *) id(grp_clim)), m == 21); show(((lv_obj_t *) id(grp_blind)), m == 22);
          show(((lv_obj_t *) id(grp_light)), m == 23); show(((lv_obj_t *) id(grp_scene)), m == 24);
          show(((lv_obj_t *) id(sh_sofa)), m == 22); show(((lv_obj_t *) id(sh_sheer)), m == 22);
          show(((lv_obj_t *) id(noc_wm)), m != 22);           // the blind stops need the bottom of the arc
          if (!homem) return;
          for (lv_obj_t *o : {((lv_obj_t *) id(noc_room)), ((lv_obj_t *) id(noc_title)), ((lv_obj_t *) id(noc_artist)), ((lv_obj_t *) id(noc_num)), ((lv_obj_t *) id(pk_grp)), ((lv_obj_t *) id(noc_prog))}) show(o, false);
          show(((lv_obj_t *) id(noc_clk)), m == 20);
          // the ring shows the page's value (in the menu: a faint preview)
          lv_obj_t *R = ((lv_obj_t *) id(noc_ring)), *G = ((lv_obj_t *) id(noc_glow));
          lv_opa_t ro = m == 20 ? 128 : LV_OPA_COVER;
          auto ring = [&](int v, int g, uint32_t col, lv_opa_t opa) {
            lv_arc_set_value(R, v); lv_arc_set_value(G, g);
            lv_obj_set_style_arc_color(R, lv_color_hex(col), LV_PART_INDICATOR);
            lv_obj_set_style_arc_opa(R, opa, LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(G, lv_color_hex(col), LV_PART_INDICATOR);
            lv_obj_set_style_arc_width(R, 3, LV_PART_INDICATOR);
          };
          int sel = id(bl_sel), pos = sel ? p1 : p0, tgt = sel ? t1 : t0, dir = sel ? id(bl_dir1) : id(bl_dir0);
          if (page == 0) { int v = (int) roundf(id(vol_local) * 100); ring(v, v, 0xF2F4F7, ro); }
          else if (page == 1) { int v = (id(ac_set) - 16) * 100 / 14; ring(v, v, ac_on ? mcol(am) : 0xEDF2EF, ac_on ? ro : 115); }
          else if (page == 2) ring(pos, tgt, 0xEDF2EF, ro);
          else { int v = id(li_on) ? id(li_bri) : 0; ring(v, v, 0xF5D76E, ro); }
          char b[64];
          if (m == 20) {
            int s = id(hm_sel);
            txt(((lv_obj_t *) id(hm_cur)), PAGE[s]); txt(((lv_obj_t *) id(hm_prev)), s > 0 ? PAGE[s - 1] : ""); txt(((lv_obj_t *) id(hm_next)), s < 3 ? PAGE[s + 1] : "");
            std::string st;
            if (s == 0) {
              std::string a = id(media_artist).state; size_t amp = a.find(" & "); if (amp != std::string::npos) a = a.substr(0, amp);
              st = id(media_playing) ? (a.empty() || a == "unknown" ? std::string("Now playing") : "Now playing · " + a)
                                     : std::string(id(media_state).state == "paused" ? "Paused" : "Nothing playing");
            } else if (s == 1) {
              if (ac_on) snprintf(b, sizeof(b), "%s to %d° · %.1f° in", mname(am).c_str(), id(ac_set), id(ac_room));
              else if (!isnan(id(ac_room))) snprintf(b, sizeof(b), "Off · %.1f° in the room", id(ac_room));
              else snprintf(b, sizeof(b), "Off");
              st = b;
            } else if (s == 2) { snprintf(b, sizeof(b), "Sofa %d%% · Sheer %d%% open", p0, p1); st = b; }
            else { if (id(li_on)) snprintf(b, sizeof(b), "On · %d%%", id(li_bri)); else snprintf(b, sizeof(b), "All off"); st = b; }
            txt(((lv_obj_t *) id(hm_stat)), up(st));
          } else if (m == 21) {
            snprintf(b, sizeof(b), "%d", id(ac_set));
            txt(((lv_obj_t *) id(hc_big)), b);
            lv_obj_set_style_text_opa(((lv_obj_t *) id(hc_big)), ac_on ? LV_OPA_COVER : 115, LV_PART_MAIN);
            lv_obj_set_style_text_opa(((lv_obj_t *) id(hc_deg)), ac_on ? LV_OPA_COVER : 115, LV_PART_MAIN);
            lv_obj_update_layout(((lv_obj_t *) id(hc_big)));
            lv_obj_align_to(((lv_obj_t *) id(hc_deg)), ((lv_obj_t *) id(hc_big)), LV_ALIGN_OUT_RIGHT_TOP, 2, 8);
            show(((lv_obj_t *) id(hc_state)), !ac_on);
            if (!isnan(id(ac_room))) snprintf(b, sizeof(b), "%.1f° IN THE ROOM", id(ac_room)); else b[0] = 0;
            txt(((lv_obj_t *) id(hc_room)), b);
            lv_obj_align(((lv_obj_t *) id(hc_room)), LV_ALIGN_CENTER, 0, ac_on ? 30 : 62);
            txt(((lv_obj_t *) id(hc_mode_l)), up(mname(ac_on ? am : id(ac_last_mode))));
            chip(((lv_obj_t *) id(hc_mode)), ((lv_obj_t *) id(hc_mode_l)), ac_on, mcol(am));
            txt(((lv_obj_t *) id(hc_fan_l)), "FAN " + up(id(ac_fan)));
            chip(((lv_obj_t *) id(hc_fan)), ((lv_obj_t *) id(hc_fan_l)), false, 0);
          } else if (m == 22) {
            txt(((lv_obj_t *) id(hb_head)), dir > 0 ? std::string("Opening") : dir < 0 ? std::string("Closing") : pname(tgt));
            if (dir != 0) snprintf(b, sizeof(b), "TO %s · NOW %d%%", up(pname(tgt)).c_str(), pos);
            else snprintf(b, sizeof(b), "%s", tgt > 0 ? "PRESS TO CLOSE" : "PRESS TO OPEN");
            txt(((lv_obj_t *) id(hb_sub)), b);
            chip(((lv_obj_t *) id(hb_sofa)), ((lv_obj_t *) id(hb_sofa_l)), sel == 0, 0x8CBDB5);
            chip(((lv_obj_t *) id(hb_sheer)), ((lv_obj_t *) id(hb_sheer_l)), sel == 1, 0x8CBDB5);
            lv_obj_t *st[5] = {((lv_obj_t *) id(hb_s0)), ((lv_obj_t *) id(hb_s1)), ((lv_obj_t *) id(hb_s2)), ((lv_obj_t *) id(hb_s3)), ((lv_obj_t *) id(hb_s4))};
            lv_obj_t *sl[5] = {((lv_obj_t *) id(hb_s0_l)), ((lv_obj_t *) id(hb_s1_l)), ((lv_obj_t *) id(hb_s2_l)), ((lv_obj_t *) id(hb_s3_l)), ((lv_obj_t *) id(hb_s4_l))};
            for (int k = 0; k < 5; k++) {
              bool on = tgt == k * 25;
              lv_obj_set_style_bg_color(st[k], lv_color_hex(on ? 0xEDF2EF : 0x0A0D0F), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(st[k], on ? LV_OPA_COVER : 115, LV_PART_MAIN);
              lv_obj_set_style_text_color(sl[k], lv_color_hex(on ? 0x12201E : 0xEDF2EF), LV_PART_MAIN);
              lv_obj_set_style_text_opa(sl[k], on ? LV_OPA_COVER : 210, LV_PART_MAIN);
            }
            lv_obj_set_height(((lv_obj_t *) id(sh_sofa)), (100 - p0) * 480 / 100);
            lv_obj_set_height(((lv_obj_t *) id(sh_sheer)), (100 - p1) * 480 / 100);
          } else if (m == 23) {
            txt(((lv_obj_t *) id(hl_head)), id(li_on) ? std::string(id(li_scene) >= 0 ? SCN[id(li_scene)] : "On") : std::string("Off"));
            lv_obj_set_style_text_opa(((lv_obj_t *) id(hl_head)), id(li_on) ? LV_OPA_COVER : 128, LV_PART_MAIN);
            if (id(li_on)) snprintf(b, sizeof(b), "%d%% · PRESS FOR ALL OFF", id(li_bri)); else snprintf(b, sizeof(b), "PRESS FOR ALL ON");
            txt(((lv_obj_t *) id(hl_sub)), b);
          } else if (m == 24) {
            int i = id(sc_idx);
            auto paint = [&](lv_obj_t *o, int k) {
              show(o, k >= 0 && k < 7); if (k < 0 || k >= 7) return;
              lv_obj_set_style_bg_color(o, lv_color_hex(SC0[k]), LV_PART_MAIN);
              lv_obj_set_style_bg_grad_color(o, lv_color_hex(SC1[k]), LV_PART_MAIN);
            };
            paint(((lv_obj_t *) id(sc_c)), i); paint(((lv_obj_t *) id(sc_l)), i - 1); paint(((lv_obj_t *) id(sc_r)), i + 1);
            txt(((lv_obj_t *) id(sc_name)), SCN[i]);
          }

  # back to the Media face: put the now-playing widgets and the ring back
  - id: home_leave
    then:
      - lambda: |-
          if (!${has_home}) return;
          for (lv_obj_t *o : {(lv_obj_t *) id(grp_menu), (lv_obj_t *) id(grp_clim), (lv_obj_t *) id(grp_blind), (lv_obj_t *) id(grp_light),
                              (lv_obj_t *) id(grp_scene), (lv_obj_t *) id(sh_sofa), (lv_obj_t *) id(sh_sheer)})
            lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          for (lv_obj_t *o : {(lv_obj_t *) id(noc_clk), (lv_obj_t *) id(noc_room), (lv_obj_t *) id(noc_wm)})
            lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *R = (lv_obj_t *) id(noc_ring), *G = (lv_obj_t *) id(noc_glow);
          int v = (int) roundf(id(vol_local) * 100);
          lv_arc_set_value(R, v); lv_arc_set_value(G, v);
          lv_obj_set_style_arc_color(R, lv_color_hex(0xF2F4F7), LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(R, LV_OPA_COVER, LV_PART_INDICATOR);
          lv_obj_set_style_arc_width(R, 2, LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(G, lv_color_hex(0xE9EDF2), LV_PART_INDICATOR);

  - id: home_timeout
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(return_after).state * 1000);'
      # never leave a blind page while a blind is still moving
      - while:
          condition: {lambda: 'return id(bl_dir0) != 0 || id(bl_dir1) != 0;'}
          then: [{delay: 2s}]
      - if:
          condition: {lambda: 'return id(current_mode) >= 20 && id(current_mode) <= 24;'}
          then: [{script.execute: home_go_media}]

  # Media is Pick to play whenever nothing is playing
  - id: home_go_media
    then:
      - script.execute: pick_check
      - if:
          condition: {lambda: 'return id(pick_turn_ok);'}
          then: [{script.execute: open_picker}]
          else: [{script.execute: switch_to_now}]

  - id: home_enter
    parameters:
      page: int
    then:
      - if:
          condition: {lambda: 'return page <= 0;'}
          then: [{script.execute: home_go_media}]
          else:
            - script.stop: pick_timeout
            - lambda: 'id(current_mode) = 20 + (page > 3 ? 3 : page);'
            - script.execute: home_render
            - script.execute: home_timeout

  - id: open_menu
    then:
      - script.stop: pick_timeout
      - lambda: |-
          int m = id(current_mode);
          id(hm_sel) = (m >= 21 && m <= 23) ? m - 20 : (m == 24 ? 3 : 0);
          id(current_mode) = 20;
      - script.execute: home_render
      - script.execute: home_timeout

  - id: home_turn
    parameters:
      dir: int
    then:
      - lambda: |-
          int m = id(current_mode);
          auto cl = [](int v, int a, int b) { return v < a ? a : (v > b ? b : v); };
          if (m == 20) id(hm_sel) = cl(id(hm_sel) + dir, 0, 3);
          else if (m == 21) { id(ac_set) = cl(id(ac_set) + dir, 16, 30); id(ac_touched_ms) = millis(); }
          else if (m == 22) {
            int &t = id(bl_sel) ? id(bl_tgt1) : id(bl_tgt0);
            int p = id(bl_sel) ? id(bl_pos1) : id(bl_pos0);
            int cur = t < 0 ? (p < 0 ? 0 : p) : t, v;
            if (dir > 0) { v = 100; for (int k = 0; k <= 100; k += 25) if (k > cur) { v = k; break; } }
            else { v = 0; for (int k = 100; k >= 0; k -= 25) if (k < cur) { v = k; break; } }
            t = v; id(bl_touched_ms) = millis();
          }
          else if (m == 23) {
            if (id(li_on)) { id(li_bri) = cl(id(li_bri) + dir * 10, 1, 100); id(li_acc) += dir; id(li_scene) = -1; id(li_touched_ms) = millis(); }
          }
          else if (m == 24) id(sc_idx) = cl(id(sc_idx) + dir, 0, 6);
      - script.execute: home_render
      - script.execute: home_timeout
      - if:
          condition: {lambda: 'return id(current_mode) == 21;'}
          then: [{script.execute: ac_temp_send}]
      - if:
          condition: {lambda: 'return id(current_mode) == 22 && id(bl_sel) == 0;'}
          then: [{script.execute: bl_send0}]
      - if:
          condition: {lambda: 'return id(current_mode) == 22 && id(bl_sel) == 1;'}
          then: [{script.execute: bl_send1}]
      - if:
          condition: {lambda: 'return id(current_mode) == 23 && id(li_acc) != 0;'}
          then: [{script.execute: li_send}]

  - id: home_press
    then:
      - lambda: |-
          int m = id(current_mode);
          id(htp) = m;
          if (m == 22) {
            int s = id(bl_sel);
            if ((s ? id(bl_dir1) : id(bl_dir0)) != 0) id(htp) = 220;          // moving: stop
            else {
              int &t = s ? id(bl_tgt1) : id(bl_tgt0); int p = s ? id(bl_pos1) : id(bl_pos0);
              int cur = t < 0 ? (p < 0 ? 0 : p) : t;
              t = cur > 0 ? 0 : 100; id(bl_touched_ms) = millis();
            }
          }
      - if:
          condition: {lambda: 'return id(htp) == 20;'}
          then: [{script.execute: {id: home_enter, page: !lambda 'return id(hm_sel);'}}]
      - if:
          condition: {lambda: 'return id(htp) == 21;'}
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: climate.aircon
                  hvac_mode: !lambda |-
                    const std::string &am = id(ac_mode);
                    bool on = !(am == "off" || am == "unknown" || am == "unavailable" || am.empty());
                    return on ? std::string("off") : id(ac_last_mode);
            - lambda: |-
                const std::string am = id(ac_mode);
                bool on = !(am == "off" || am == "unknown" || am == "unavailable" || am.empty());
                id(ac_mode) = on ? std::string("off") : id(ac_last_mode);
      - if:
          condition: {lambda: 'return id(htp) == 22 && id(bl_sel) == 0;'}
          then: [{script.execute: bl_send0}]
      - if:
          condition: {lambda: 'return id(htp) == 22 && id(bl_sel) == 1;'}
          then: [{script.execute: bl_send1}]
      - if:
          condition: {lambda: 'return id(htp) == 220;'}
          then:
            - homeassistant.action:
                action: cover.stop_cover
                data:
                  entity_id: !lambda 'return std::string(id(bl_sel) ? "cover.sheer_blinds" : "cover.blinds");'
      - if:
          condition: {lambda: 'return id(htp) == 23;'}
          then:
            - if:
                condition: {lambda: 'return id(li_on);'}
                then: [{homeassistant.action: {action: light.turn_off, data: {entity_id: light.ckub_all}}}]
                else: [{homeassistant.action: {action: light.turn_on, data: {entity_id: light.ckub_all}}}]
            - lambda: 'id(li_on) = !id(li_on); id(li_scene) = -1;'
      - if:
          condition: {lambda: 'return id(htp) == 24;'}
          then: [{script.execute: scene_go}]
      - script.execute: home_render
      - script.execute: home_timeout

  # glass taps on the home pages (chips, blind stops, menu sides, scene discs)
  - id: home_tap
    mode: restart
    parameters:
      which: int
    then:
      - delay: 80ms
      - if:
          condition: {lambda: 'return millis() - id(swipe_ms) > 300 && id(current_mode) >= 20 && id(current_mode) <= 24;'}
          then:
            - lambda: |-
                int m = id(current_mode), w = which;
                auto cl = [](int v, int a, int b) { return v < a ? a : (v > b ? b : v); };
                id(htp) = 0;
                if (m == 20) { if (w == 1) id(hm_sel) = cl(id(hm_sel) - 1, 0, 3); else if (w == 3) id(hm_sel) = cl(id(hm_sel) + 1, 0, 3); else if (w == 2) id(htp) = 1; }
                else if (m == 21 && (w == 10 || w == 11)) id(htp) = w;
                else if (m == 22 && (w == 20 || w == 21)) id(bl_sel) = w - 20;
                else if (m == 22 && w >= 30 && w <= 34) {
                  int &t = id(bl_sel) ? id(bl_tgt1) : id(bl_tgt0);
                  t = (w - 30) * 25; id(bl_touched_ms) = millis(); id(htp) = 30;
                }
                else if (m == 23 && w == 40) { id(sc_idx) = id(li_scene) >= 0 ? id(li_scene) : 2; id(current_mode) = 24; }
                else if (m == 24) { if (w == 50) id(sc_idx) = cl(id(sc_idx) - 1, 0, 6); else if (w == 52) id(sc_idx) = cl(id(sc_idx) + 1, 0, 6); else if (w == 51) id(htp) = 51; }
            - if:
                condition: {lambda: 'return id(htp) == 1;'}
                then: [{script.execute: {id: home_enter, page: !lambda 'return id(hm_sel);'}}]
            - if:
                condition: {lambda: 'return id(htp) == 10;'}
                then:
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: climate.aircon
                        hvac_mode: !lambda |-
                          static const char *const M[5] = {"cool", "heat", "heat_cool", "dry", "fan_only"};
                          const std::string &am = id(ac_mode);
                          bool on = !(am == "off" || am == "unknown" || am == "unavailable" || am.empty());
                          const std::string &cur = on ? am : id(ac_last_mode);
                          int i = 0; for (int k = 0; k < 5; k++) if (cur == M[k]) i = k;
                          id(ac_last_mode) = M[(i + 1) % 5];
                          return id(ac_last_mode);
                  - lambda: 'id(ac_mode) = id(ac_last_mode);'
            - if:
                condition: {lambda: 'return id(htp) == 11;'}
                then:
                  - homeassistant.action:
                      action: climate.set_fan_mode
                      data:
                        entity_id: climate.aircon
                        fan_mode: !lambda |-
                          static const char *const F[6] = {"auto", "quiet", "low", "medium", "high", "strong"};
                          int i = 0; for (int k = 0; k < 6; k++) if (id(ac_fan) == F[k]) i = k;
                          id(ac_fan) = F[(i + 1) % 6];
                          return id(ac_fan);
            - if:
                condition: {lambda: 'return id(htp) == 30 && id(bl_sel) == 0;'}
                then: [{script.execute: bl_send0}]
            - if:
                condition: {lambda: 'return id(htp) == 30 && id(bl_sel) == 1;'}
                then: [{script.execute: bl_send1}]
            - if:
                condition: {lambda: 'return id(htp) == 51;'}
                then: [{script.execute: scene_go}]
            - script.execute: home_render
            - script.execute: home_timeout

  - id: scene_go
    then:
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda |-
              static const char *const E[7] = {"scene.bae", "scene.white", "scene.home_home_tokyo", "scene.home_home_miami",
                                               "scene.home_home_santorini", "scene.home_home_soho", "scene.night"};
              return std::string(E[id(sc_idx)]);
      - lambda: 'id(li_scene) = id(sc_idx); id(li_on) = true; id(current_mode) = 23;'
      - script.execute: home_render

  # sends wait for the turning to stop, so the aircon beeps once and the motor doesn't stutter
  - id: ac_temp_send
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: climate.aircon
            temperature: !lambda 'return id(ac_set);'
  # cover.blinds is inverted: its position 0 is physically open
  - id: bl_send0
    mode: restart
    then:
      - delay: 700ms
      - homeassistant.action:
          action: cover.set_cover_position
          data:
            entity_id: cover.blinds
            position: !lambda 'return 100 - (id(bl_tgt0) < 0 ? 0 : id(bl_tgt0));'
  - id: bl_send1
    mode: restart
    then:
      - delay: 700ms
      - homeassistant.action:
          action: cover.set_cover_position
          data:
            entity_id: cover.sheer_blinds
            position: !lambda 'return id(bl_tgt1) < 0 ? 0 : id(bl_tgt1);'
  # brightness moves only the lights that are already on (script.rotary_light_step)
  - id: li_send
    mode: restart
    then:
      - delay: 350ms
      - homeassistant.action:
          action: script.rotary_light_step
          data:
            step: !lambda 'return id(li_acc) * 10;'
      - lambda: 'id(li_acc) = 0;'

  # ══ INPUT ═════════════════════════════════════════════════════════════════
  - id: knob_turn
    parameters:
      dir: int
    then:
      - lambda: 'id(user_wake) = true;'
      - script.execute: screen_timeout_timer
      - script.execute: pick_check
      - lambda: |-
          id(pa) = id(current_mode);
          if (id(rotary_button).state) { id(turned_while_held) = true; id(pa) += 100; }
          // nothing playing: the first turn opens the picker instead of moving the volume
          if (id(pa) == 0 && id(pick_turn_ok)) id(pa) = 50;
          // home pages (menu, Climate, Blinds, Lights, Scenes) take the turn
          if (id(current_mode) >= 20 && id(current_mode) <= 24) id(pa) = 200;
      - if:
          condition: {lambda: 'return id(pa) == 200;'}
          then: [{script.execute: {id: home_turn, dir: !lambda 'return dir;'}}]
      - if:
          condition: {lambda: 'return id(pa) == 50;'}
          then: [{script.execute: open_picker}]
      - if:
          condition: {lambda: 'return id(pa) == 5 || id(pa) == 105;'}
          then: [{script.execute: {id: pick_move, dir: !lambda 'return dir;'}}]
      # now playing: volume
      - if:
          condition: {lambda: 'return id(pa) == 0;'}
          then:
            - lambda: |-
                float v = id(vol_local) + dir * 0.02f;
                id(vol_local) = v < 0 ? 0 : (v > 1 ? 1 : v);
                id(vol_touched_ms) = millis();
            - script.execute: {id: hud_show, kind: 1}
            - script.execute: vol_send
      # now playing + held: scrub through the track
      - if:
          condition: {lambda: 'return id(pa) == 100 && id(dur_s) > 0;'}
          then:
            - lambda: |-
                float step = id(dur_s) / 60.0f; if (step < 5) step = 5;
                float p = id(pos_s) + dir * step;
                id(pos_s) = p < 0 ? 0 : (p > id(dur_s) - 1 ? id(dur_s) - 1 : p);
                id(seek_touched_ms) = millis();
            - script.execute: {id: hud_show, kind: 2}
            - script.execute: seek_send
      # turning cancels a pending "hold to stop" (hold + turn = scrub)
      - if:
          condition: {lambda: 'return id(hold_hint);'}
          then: [{script.execute: hold_hint_end}]

  - id: knob_press
    then:
      - lambda: 'id(user_wake) = true;'
      - script.execute: screen_timeout_timer
      - script.execute: pick_check
      - lambda: |-
          id(pa) = id(current_mode);
          // picker when allowed; a Bedroom pause (any length) still just resumes
          bool paused = id(media_state).state == "paused";
          if (id(pa) == 0 && id(pick_ok) && (${pick_more} || !paused)) id(pa) = 50;
          // a pick is still starting: a second press would pause it
          if (id(pa) == 0 && id(pick_started_ms) != 0 && millis() - id(pick_started_ms) < 15000 && !id(media_playing)) id(pa) = 51;
          if (id(current_mode) >= 20 && id(current_mode) <= 24) id(pa) = 200;
      - if:
          condition: {lambda: 'return id(pa) == 200;'}
          then: [{script.execute: home_press}]
      - if:
          condition: {lambda: 'return id(pa) == 0;'}
          then:
            - homeassistant.action: {action: media_player.media_play_pause, data: {entity_id: "${player}"}}
      - if:
          condition: {lambda: 'return id(pa) == 50;'}
          then: [{script.execute: open_picker}]
      - if:
          condition: {lambda: 'return id(pa) == 51;'}
          then: [{script.execute: {id: toast, msg: "STARTING"}}]
      - if:
          condition: {lambda: 'return id(pa) == 5;'}
          then:
            - lambda: 'id(pick_open_ms) = 0;'
            - script.execute: pick_play

  - id: knob_next
    then:
      - script.execute: screen_timeout_timer
      - if:
          condition: {lambda: 'return id(current_mode) == 0;'}
          then:
            - homeassistant.action: {action: media_player.media_next_track, data: {entity_id: "${player}"}}
            - script.execute: {id: toast, msg: "NEXT"}

  - id: knob_prev
    then:
      - script.execute: screen_timeout_timer
      - if:
          condition: {lambda: 'return id(current_mode) == 0;'}
          then:
            - homeassistant.action: {action: media_player.media_previous_track, data: {entity_id: "${player}"}}
            - script.execute: {id: toast, msg: "PREVIOUS"}

  # hold: stop the music on every speaker in the house. Works from the night clock
  # too (a deliberate hold isn't a stray bump), never under the alarm popup.
  # coffee-table knob (has_home): hold opens the menu; hold in the menu goes back to Media.
  - id: knob_long
    then:
      - lambda: 'id(pa) = id(current_mode);'
      - script.execute: screen_timeout_timer
      - if:
          condition: {lambda: 'return ${has_home} && id(pa) == 20;'}
          then: [{script.execute: home_go_media}]
      - if:
          condition: {lambda: 'return ${has_home} && (id(pa) == 0 || id(pa) == 5 || (id(pa) >= 21 && id(pa) <= 24));'}
          then: [{script.execute: open_menu}]
      - if:
          condition: {lambda: 'return !${has_home} && id(pa) == 5;'}
          then: [{script.execute: switch_to_now}]
      - if:
          condition: {lambda: 'return !${has_home} && (id(pa) == 0 || (id(pa) == 9 && !id(alarm_popup_up)));'}
          then:
            - homeassistant.action: {action: script.turn_on, data: {entity_id: script.rotary_stop_all}}
            - script.execute: {id: toast, msg: "ALL MUSIC STOPPED"}

  # held long enough without turning: say what letting go will do
  - id: hold_hint_start
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition: {lambda: 'return !${has_home} && id(rotary_button).state && !id(turned_while_held) && id(current_mode) == 0;'}
          then:
            - lambda: 'id(hold_hint) = true;'
            - script.execute: {id: toast, msg: "LET GO TO STOP ALL"}

  - id: hold_hint_end
    then:
      - script.stop: hold_hint_start
      - if:
          condition: {lambda: 'return id(hold_hint);'}
          then:
            - lambda: 'id(hold_hint) = false; id(toast_ms) = 0;'
            - script.execute: update_np

  # a short line in place of the artist, so a press is acknowledged at once
  - id: toast
    mode: restart
    parameters:
      msg: std::string
    then:
      - lambda: |-
          id(toast_ms) = millis() + (id(hold_hint) ? 60000 : 1600);
          lv_label_set_text((lv_obj_t *) id(noc_artist), msg.c_str());
      - delay: 1600ms
      - if:
          condition: {lambda: 'return !id(hold_hint);'}
          then:
            - lambda: 'id(toast_ms) = 0;'
            - script.execute: update_np

  # ══ NOW PLAYING ═══════════════════════════════════════════════════════════
  # Volume goes to HA as the player's new level plus the change since the last
  # send; script.rotary_volume moves every grouped room by that same change.
  - id: vol_send
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition: {lambda: 'return ${group_vol};'}
          then:
            - homeassistant.action:
                action: script.rotary_volume
                data:
                  entity: ${player}
                  level: !lambda 'return id(vol_local);'
                  delta: !lambda 'return id(vol_local) - id(vol_sent);'
          else:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${player}
                  volume_level: !lambda 'return id(vol_local);'
      - lambda: 'id(vol_sent) = id(vol_local);'

  - id: seek_send
    mode: restart
    then:
      - delay: 400ms
      - homeassistant.action:
          action: media_player.media_seek
          data:
            entity_id: ${player}
            seek_position: !lambda 'return (int) id(pos_s);'

  # Pill's second line doubles as the readout while turning (1) or scrubbing (2)
  - id: hud_show
    mode: restart
    parameters:
      kind: int
    then:
      - lambda: 'id(hud_active) = true; id(hud_kind) = kind;'
      - script.execute: face_hud
      - delay: 1400ms
      - lambda: 'id(hud_active) = false;'
      - script.execute: face_hud_end
      - script.execute: update_np

  # Club on the TV input: borrow title + poster from whatever the TV is playing,
  # Plex client first (it has the real poster), then ABC iview (title only), then the Google TV Streamer.
  - id: tv_refresh
    then:
      - lambda: |-
          auto ok = [](const std::string &v) { return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None"); };
          auto live = [](const std::string &s) { return s == "playing" || s == "paused"; };
          std::string title, sub, pic;
          if (live(id(tv_plex_state).state) && ok(id(tv_plex_title).state)) {
            title = id(tv_plex_title).state;
            sub = (id(tv_plex_type).state == "episode" && ok(id(tv_plex_series).state)) ? id(tv_plex_series).state : std::string("Plex");
          } else if (id(tv_atv_app).state == "au.net.abc.iview") {
            title = "ABC";              // iview doesn't say what it's playing
          } else if (ok(id(tv_cast_state).state) && ok(id(tv_cast_title).state)) {
            title = id(tv_cast_title).state;
            sub = ok(id(tv_cast_app).state) ? id(tv_cast_app).state : std::string("");
          }
          if (live(id(tv_plex_state).state) && ok(id(tv_plex_pic).state)) pic = id(tv_plex_pic).state;
          else if (live(id(tv_cast_state).state) && ok(id(tv_cast_pic).state)) pic = id(tv_cast_pic).state;
          else if (live(id(tv_atv_state).state) && ok(id(tv_atv_pic).state)) pic = id(tv_atv_pic).state;
          id(tv_title) = title; id(tv_sub) = sub; id(tv_pic) = pic;
      - if:
          condition:
            lambda: |-
              if (!id(media_is_tv) || id(tv_pic).empty()) return false;
              const std::string &x = id(tv_pic);
              std::string k = "tv:" + x;
              if (k == id(art_key)) return false;
              id(art_key) = k;
              id(art_tries) = 0;
              return true;
          then:
            - online_image.set_url:
                id: album_blur
                url: !lambda |-
                  const std::string &x = id(tv_pic);
                  return x[0] == '/' ? std::string("http://<ha-ip>:8123") + x : x;
      - script.execute: update_np

  - id: update_np
    then: [{script.execute: update_faces}, {script.execute: home_render}]

  - id: update_faces
    then:
      - lambda: |-
          auto ok = [](const std::string &v) { return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None"); };
          std::string t = ok(id(media_title).state) ? id(media_title).state : std::string("Nothing playing");
          std::string a = ok(id(media_artist).state) ? id(media_artist).state : std::string("");
          if (id(media_is_tv)) { t = id(tv_title).empty() ? std::string("TV") : id(tv_title); a = id(tv_sub); }
          size_t amp = a.find(" & "); if (amp != std::string::npos) a = a.substr(0, amp);
          if (!id(media_playing)) a = "Paused";
          for (auto &c : a) if ((unsigned char) c < 0x80) c = toupper((unsigned char) c);
          lv_label_set_text((lv_obj_t *) id(noc_title), t.c_str());
          if (millis() >= id(toast_ms)) lv_label_set_text((lv_obj_t *) id(noc_artist), a.c_str());
          lv_label_set_text((lv_obj_t *) id(noc_room), id(current_mode) == 5 ? "PLAY IN ${room_name}" : id(room_txt).c_str());
          lv_obj_set_style_opa((lv_obj_t *) id(noc_title), id(media_playing) ? LV_OPA_COVER : LV_OPA_50, LV_PART_MAIN);
          lv_obj_set_style_image_opa((lv_obj_t *) id(noc_bg), id(media_playing) ? 235 : 120, LV_PART_MAIN);
          // the progress hairline only makes sense for a track with a length
          if (id(dur_s) > 0 && !id(media_is_tv)) lv_obj_remove_flag((lv_obj_t *) id(noc_prog), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag((lv_obj_t *) id(noc_prog), LV_OBJ_FLAG_HIDDEN);
          // night face: track info only while something is actually playing
          bool on = id(media_playing) && ok(t) && t != "Nothing playing";
          lv_label_set_text((lv_obj_t *) id(nt_title), on ? t.c_str() : "");
          lv_label_set_text((lv_obj_t *) id(nt_artist), on ? a.c_str() : "");


interval:
  # --- work alarm: pulse + clock + countdown twice a second while the popup is up
  - interval: 500ms
    then:
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then:
            - script.execute: alarm_refresh_text
            - if:
                condition: {lambda: 'return id(alarm_state) == 1;'}
                then:
                  - lambda: 'id(alarm_pulse) = !id(alarm_pulse);'
                  - if:
                      condition: {lambda: 'return id(alarm_pulse);'}
                      then: [{lvgl.obj.update: {id: alarm_icon_bg, bg_opa: 70%}}]
                      else: [{lvgl.obj.update: {id: alarm_icon_bg, bg_opa: 25%}}]
  # --- work alarm: while RINGING, keep the screen on even if someone hits sleep
  - interval: 20s
    then:
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            - lambda: 'id(night_active) = false;'
            - lvgl.widget.hide: grp_night
            - light.control: {id: display_backlight, brightness: 100%}
  # --- night clock tick + arm the idle timer once after boot
  - interval: 5s
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then: [{script.execute: update_night_clock}]
      - if:
          condition: {lambda: 'return !id(night_armed);'}
          then:
            - lambda: 'id(night_armed) = true;'
            - script.execute: screen_timeout_timer
            - script.execute: switch_to_now
  # --- track position (HA only reports it on changes) -> tonearm
  - interval: 1s
    then:
      - lambda: |-
          if (id(media_playing) && millis() - id(seek_touched_ms) > 1500) {
            id(pos_s) += 1;
            if (id(dur_s) > 0 && id(pos_s) > id(dur_s)) id(pos_s) = id(dur_s);
          }
          int pv = id(dur_s) > 0 ? (int) (id(pos_s) * 1000.0f / id(dur_s)) : 0;
          if (pv != lv_arc_get_value((lv_obj_t *) id(noc_prog))) lv_arc_set_value((lv_obj_t *) id(noc_prog), pv);
  # --- album art: retry a failed download
  - interval: 30s
    then:
      - if:
          condition: {lambda: 'return !id(art_ok) && !id(art_key).empty() && id(art_tries) < 2;'}
          then:
            - lambda: 'id(art_tries)++;'
            - component.update: album_blur
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: update_clock

binary_sensor:
  # --- auto-stay (party mode): no night clock
  - platform: homeassistant
    id: party_mode
    entity_id: input_boolean.auto_stay
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(night_active);'}
            then:
              - lvgl.widget.hide: grp_night
              - lambda: 'id(night_active) = false;'
              - script.execute: switch_to_now
        - script.execute: screen_timeout_timer
    on_release:
      then:
        - script.execute: screen_timeout_timer
  # --- work alarm (mirrors Home Assistant)
  - platform: homeassistant
    id: alarm_ringing
    entity_id: input_boolean.work_alarm_ringing
    on_state:
      then:
        - script.execute: update_alarm
  - platform: gpio
    id: rotary_button
    pin:
      pcf8574: pcf
      number: 5
      mode: INPUT
      inverted: true
    on_press:
      - lambda: 'id(turned_while_held) = false;'
      - script.execute: hold_hint_start
    on_release:
      - script.execute: hold_hint_end
    # press = play/pause · double = next · triple = previous · hold = stop everywhere
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 400ms
        then: [{script.execute: knob_prev}]
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 400ms
        then: [{script.execute: knob_next}]
      - timing:
          - ON for 50ms to 500ms
          - OFF for at least 400ms
        then:
          - if:
              condition: {lambda: 'return !id(turned_while_held);'}
              then: [{script.execute: knob_press}]
      # fires on release, so hold + turn (scrub) never stops the music
      - timing:
          - ON for at least 800ms
          - OFF for at least 20ms
        then:
          - if:
              condition: {lambda: 'return !id(turned_while_held);'}
              then: [{script.execute: knob_long}]

sensor:
  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: 4
      mode: INPUT_PULLUP
    pin_b:
      number: 42
      mode: INPUT_PULLUP
    on_clockwise:
      - script.execute: {id: knob_turn, dir: 1}
    on_anticlockwise:
      - script.execute: {id: knob_turn, dir: -1}

  - platform: homeassistant
    id: ha_media_volume
    entity_id: ${player}
    attribute: volume_level
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            if (millis() - id(vol_touched_ms) > 2500) { id(vol_local) = x; id(vol_sent) = x; }

  - platform: homeassistant
    id: ha_media_pos
    entity_id: ${player}
    attribute: media_position
    on_value:
      then:
        - lambda: 'if (!isnan(x) && millis() - id(seek_touched_ms) > 2500) id(pos_s) = x;'
  - platform: homeassistant
    id: ha_media_dur
    entity_id: ${player}
    attribute: media_duration
    on_value:
      then:
        - lambda: 'id(dur_s) = isnan(x) ? 0 : x;'
        - script.execute: update_np

  # --- home pages
  - platform: homeassistant
    id: ha_ac_target
    entity_id: climate.aircon
    attribute: temperature
    on_value:
      then:
        - lambda: 'if (!isnan(x) && millis() - id(ac_touched_ms) > 3000) id(ac_set) = (int) roundf(x);'
        - script.execute: home_render
  - platform: homeassistant
    id: ha_ac_room
    entity_id: climate.aircon
    attribute: current_temperature
    on_value:
      then:
        - lambda: 'id(ac_room) = x;'
        - script.execute: home_render
  - platform: homeassistant
    id: ha_bl0_pos
    entity_id: cover.blinds
    attribute: current_position
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bl_pos0) = 100 - (int) roundf(x);           // inverted
            if (id(bl_dir0) == 0 && millis() - id(bl_touched_ms) > 3000) id(bl_tgt0) = id(bl_pos0);
        - script.execute: home_render
  - platform: homeassistant
    id: ha_bl1_pos
    entity_id: cover.sheer_blinds
    attribute: current_position
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bl_pos1) = (int) roundf(x);
            if (id(bl_dir1) == 0 && millis() - id(bl_touched_ms) > 3000) id(bl_tgt1) = id(bl_pos1);
        - script.execute: home_render
  - platform: homeassistant
    id: ha_li_bri
    entity_id: light.ckub_all
    attribute: brightness
    on_value:
      then:
        - lambda: 'if (!isnan(x) && millis() - id(li_touched_ms) > 3000) id(li_bri) = (int) roundf(x * 100.0f / 255.0f);'
        - script.execute: home_render

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

touchscreen:
  - platform: cst816
    id: touch_screen
    # no reset line: after a soft restart the chip can still be asleep and
    # fail the chip-ID probe, so don't let the probe disable touch
    skip_probe: true
    on_touch:
      - lambda: 'id(tx0) = touch.x; id(tx1) = touch.x; id(ty0) = touch.y; id(ty1) = touch.y;'
      # the CST816 throws phantom touches at the (479,479) corner every minute or two;
      # anything outside the round glass must not wake the screen. Taps do nothing else.
      - if:
          condition:
            lambda: 'int dx = touch.x - 240, dy = touch.y - 240; return dx * dx + dy * dy < 236 * 236;'
          then:
            - lambda: 'id(user_wake) = true;'
            - script.execute: screen_timeout_timer
            - script.execute: pick_check
            - if:
                condition: {lambda: 'return id(current_mode) == 0 && !id(night_active) && id(pick_ok);'}
                then: [{script.execute: open_picker}]
    on_update:
      - lambda: 'for (auto &t : touches) { id(tx1) = t.x; id(ty1) = t.y; break; }'
    on_release:
      # coffee-table knob: swipe left / right moves between pages (menu: highlight, Scenes: browse)
      - if:
          condition:
            lambda: |-
              int dx = id(tx1) - id(tx0), dy = id(ty1) - id(ty0);
              int m = id(current_mode);
              return ${has_home} && abs(dx) > 60 && abs(dx) > abs(dy) && (m == 0 || m == 5 || (m >= 20 && m <= 24));
          then:
            - lambda: |-
                id(swipe_ms) = millis();
                int d = id(tx1) < id(tx0) ? 1 : -1, m = id(current_mode);
                auto cl = [](int v, int a, int b) { return v < a ? a : (v > b ? b : v); };
                id(htp) = -1;
                if (m == 0 || m == 5) { if (d > 0) id(htp) = 1; }
                else if (m == 20) id(hm_sel) = cl(id(hm_sel) + d, 0, 3);
                else if (m == 24) id(sc_idx) = cl(id(sc_idx) + d, 0, 6);
                else { int p = cl(m - 20 + d, 0, 3); if (p != m - 20) id(htp) = p; }
            - if:
                condition: {lambda: 'return id(htp) >= 0;'}
                then: [{script.execute: {id: home_enter, page: !lambda 'return id(htp);'}}]
                else:
                  - script.execute: home_render
                  - script.execute: home_timeout
      # picker (bedroom knob): swipe left / right to browse
      - if:
          condition: {lambda: 'return !${has_home} && id(current_mode) == 5 && abs(id(tx1) - id(tx0)) > 60;'}
          then:
            - lambda: 'id(swipe_ms) = millis();'
            - script.execute: {id: pick_move, dir: !lambda 'return id(tx1) < id(tx0) ? 1 : -1;'}

spi:
  clk_pin: 2
  mosi_pin: 1

display:
  - platform: st7701s
    id: my_display
    update_interval: 50ms
    spi_mode: MODE3
    dimensions:
      width: 480
      height: 480
    cs_pin: 16
    de_pin: 40
    hsync_pin: 15
    vsync_pin: 7
