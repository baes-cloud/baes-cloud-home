  text_color: 0xEEF1F7
  default_font: mr_20
  theme:
    button:
      shadow_width: 0
    label:
      text_font: mr_20

  pages:
    - id: main_page
      scrollable: false
      pad_all: 0
      border_width: 0
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:
        # ── BÆO III · Nocturne
        - obj:
            id: grp_noc
