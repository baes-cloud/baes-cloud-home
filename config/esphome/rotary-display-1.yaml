            # panel (inset 14 px from the rim). The scrim itself swallows every tap.
            - obj:
                align: center
                width: 452
                height: 452
                radius: 226
                bg_color: 0x10151C
                border_width: 2
                border_color: 0x27313D
                pad_all: 0
                clickable: false
                scrollbar_mode: "OFF"
            - obj:
                id: alarm_icon_bg
                align: center
                y: -180
                width: 60
                height: 60
                radius: 30
                bg_color: 0xF59E0B
                bg_opa: 40%
                border_width: 0
                pad_all: 0
                clickable: false
                scrollbar_mode: "OFF"
            - label:
                id: alarm_icon_lbl
                text: "\uF0F3"
                align: center
                y: -180
                text_font: montserrat_28
                text_color: 0xF59E0B
            - label:
                id: alarm_caps_lbl
                text: "ALARM"
                align: center
                y: -136
                text_font: alarm_btn
                text_letter_space: 4
                text_color: 0xF59E0B
            - label:
                id: alarm_time_lbl
                text: "--:--"
                align: center
                y: -78
                text_font: alarm_time
                text_color: 0xF1F5F9
            - label:
                id: alarm_ampm_lbl
                text: ""
                align: center
                y: -24
                text_font: alarm_t18
                text_color: 0x94A3B8
            - label:
                id: alarm_what_lbl
                text: ""
                align: center
                y: 8
                width: 360
                long_mode: DOT
                text_align: center
                text_font: alarm_t24
                text_color: 0xE2E8F0
            - label:
                id: alarm_start_lbl
                text: ""
                align: center
                y: 37
                text_font: alarm_t18
                text_color: 0x94A3B8
            - label:
                id: alarm_back_lbl
                text: ""
                hidden: true
                align: center
                y: 64
                text_font: alarm_t24
                text_color: 0x60A5FA
            # RINGING: one big tap
            - button:
                id: btn_alarm_snooze
                align: center
                y: 96
                width: 300
                height: 60
                radius: 30
                bg_color: 0xF59E0B
                shadow_width: 0
                border_width: 0
                pad_all: 0
                on_click:
                  - homeassistant.action: {action: script.turn_on, data: {entity_id: script.work_alarm_snooze}}
                widgets:
                  - label: {text: "Snooze 5 min", align: center, text_font: alarm_btn, text_color: 0x1A1205}
            # SNOOZED: quiet text button, hides the popup on this screen only
            - button:
                id: btn_alarm_hide
                hidden: true
                align: center
                y: 100
                width: 280
                height: 48
                radius: 24
                bg_opa: 0
                shadow_width: 0
                border_width: 0
                pad_all: 0
                on_click:
                  - lambda: 'id(alarm_view_hidden) = true;'
                  - script.execute: update_alarm
                widgets:
                  - label: {text: "Hide until it rings again", align: center, text_font: alarm_t18, text_color: 0x8FA3BF}
            # ALWAYS: hold to dismiss
            - button:
                id: btn_alarm_dismiss
                align: center
                y: 172
                width: 250
                height: 60
                radius: 30
                bg_color: 0x3A1616
                border_width: 2
                border_color: 0x7F2A2A
                shadow_width: 0
                pad_all: 0
                on_press:
                  - script.execute: alarm_hold
                on_release:
                  - script.stop: alarm_hold
                  - lvgl.bar.update: {id: alarm_hold_bar, value: 0, animated: true}
                on_press_lost:
                  - script.stop: alarm_hold
                  - lvgl.bar.update: {id: alarm_hold_bar, value: 0, animated: true}
                widgets:
                  - bar:
                      id: alarm_hold_bar
                      align: center
                      width: 244
                      height: 54
                      min_value: 0
                      max_value: 100
                      value: 0
                      clickable: false
                      radius: 27
                      bg_opa: 0
                      indicator:
                        bg_color: 0xB91C1C
                        bg_opa: 85%
                        radius: 27
                  - label:
                      text: "Hold to dismiss for today"
                      align: center
                      width: 200
                      text_align: center
                      text_font: alarm_btn
                      text_color: 0xFCA5A5
      - obj:
          id: grp_night
