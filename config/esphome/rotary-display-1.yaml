substitutions:
  night_idle: 180s              # no interaction for this long -> faded clock
  night_clock_color: "0x9A5F2C" # warm amber: no blue light while sleeping
  night_date_color: "0x6E4526"

esphome:
  name: rotary-display-1
  friendly_name: rotary-display-1
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    - priority: 800
      then:
        - output.turn_on: lcd_power
        - output.turn_on: display_reset
        - delay: 100ms
        - output.turn_off: display_reset
        - delay: 500ms
    # after LVGL is up: paint the face canvases
    - priority: -100
      then:
        - script.execute: paint_vignette
        - script.execute: paint_faces
        - script.execute: {id: paint_bg, live: false}
        - script.execute: apply_offset
        - script.execute: set_face

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    
psram:
  mode: octal
  speed: 80MHz 

logger:
  hardware_uart: UART0

api:
  actions:
    # Test hook only: preview the alarm popup without touching Home Assistant.
    # mode 1 = ringing, 2 = snoozed, 0 = back to live. Reverts by itself after 25 s.
    - action: alarm_preview
      variables:
        mode: int
      then:
        - lambda: 'id(alarm_preview) = mode;'
        - script.execute: update_alarm
        - script.execute: alarm_preview_timeout
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Rotary-Display-1"
    password: !secret ap_password

  use_address: <device-ip>
captive_portal:

web_server:
  port: 80

# --------------------------------------------------------


# HARDWARE & I2C
# --------------------------------------------------------
i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: true
  frequency: 400kHz

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz

  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode: output

  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode: output
      inverted: true

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0.5s
    restore_mode: ALWAYS_ON
    # Never let the screen go fully dark: if anything (HA, web UI) turns it
    # off, bounce it straight back on at the dim level.
    on_turn_off:
      - delay: 50ms
      - light.turn_on:
          id: display_backlight
          brightness: 55%

# --------------------------------------------------------
# IMAGE ASSETS
# --------------------------------------------------------

# --------------------------------------------------------
# BÆO REMOTE (media-only UI; turntable retired 2026-09-27)
#   Face 1 "Nocturne": smoked glass over a blurred cover, lit volume ring.
#   Swipe left/right toggles faces; hold the knob for Playlists (+ ungroup).
# current_mode: 0 now-playing · 6 playlists · 9 inert
# idle -> night face: dim amber Face A on near-black (grp_night, top layer)
# --------------------------------------------------------
http_request:
  verify_ssl: false
  timeout: 2s

image:
  - file: "tt/pl_disc_140.png"
    id: pl_disc_140
    type: RGB565
    transparency: alpha_channel
  - file: "tt/art_ph.png"
    id: art_ph
    type: RGB565
  - file: "icon_disco_w.png"
    id: icon_disco
    type: RGB565
    transparency: alpha_channel
    resize: 38x44
  - file: "icon_house_w.png"
    id: icon_house
    type: RGB565
    transparency: alpha_channel
    resize: 50x40
  - file: "icon_mos_w.png"
    id: icon_mos
    type: RGB565
    transparency: alpha_channel
    resize: 46x42
  - file: "icon_pdm.png"
    id: icon_pdm
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - file: "icon_dfp_w.png"
    id: icon_dfp
    type: RGB565
    transparency: alpha_channel
    resize: 44x44
  - file: "icon_fav_w.png"
    id: icon_fav
    type: RGB565
    transparency: alpha_channel
    resize: 46x40
  - file: "icon_alb_w.png"
    id: icon_alb
    type: RGB565
    transparency: alpha_channel
