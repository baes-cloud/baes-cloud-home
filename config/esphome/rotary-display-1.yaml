            - label: {id: night_clock_lbl, text: "--:--", align: CENTER, y: 0, text_font: mr_num, text_color: 0xB8704A}
            - label: {text: "BÆOREMOTE", align: CENTER, y: 120, text_font: hk_22, text_letter_space: 7, text_color: 0xA56444}
  displays:
    - my_display
  touchscreens:
    - touch_screen
