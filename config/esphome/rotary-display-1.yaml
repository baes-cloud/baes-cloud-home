text_sensor:
  # --- work alarm (mirrors Home Assistant)
  - platform: homeassistant
    id: alarm_snooze_state
    entity_id: timer.work_alarm_snooze
    on_value:
      then:
        - script.execute: update_alarm
  - platform: homeassistant
    id: alarm_snooze_finish
    entity_id: timer.work_alarm_snooze
    attribute: finishes_at
  - platform: homeassistant
    id: alarm_work_start
    entity_id: sensor.work_start
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(alarm_popup_up);'}
            then: [{script.execute: alarm_refresh_text}]
  - platform: homeassistant
    id: alarm_work_summary
    entity_id: sensor.work_start
    attribute: summary
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(alarm_popup_up);'}
            then: [{script.execute: alarm_refresh_text}]
  - platform: homeassistant
    id: alarm_work_location
    entity_id: sensor.work_start
    attribute: location
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(alarm_popup_up);'}
            then: [{script.execute: alarm_refresh_text}]
  - platform: homeassistant
    id: media_title
    entity_id: ${player}
    attribute: media_title
    on_value:
      then:
        - lambda: 'id(media_is_tv) = ${has_tv} && (x == std::string("TV") || x == std::string("TV Audio"));'
        - if:
            condition: {lambda: 'return id(media_playing) && !id(media_is_tv) && id(current_mode) == 5;'}
            then: [{script.execute: switch_to_now}]
        - script.execute: tv_refresh
        # back from the TV: put the music artwork back
        - if:
            condition:
              lambda: |-
                if (id(media_is_tv) || id(art_key).rfind("tv:", 0) != 0) return false;
                const std::string &pic = id(media_picture).state;
                if (pic.empty() || pic[0] != '/') return false;
                id(art_key) = pic;
                id(art_tries) = 0;
                return true;
            then:
              - online_image.set_url:
                  id: album_blur
                  url: !lambda 'return std::string("http://<ha-ip>:8123") + id(media_picture).state;'
        - if:
            condition: {lambda: 'return x != id(last_title);'}
            then:
              - lambda: 'id(last_title) = x;'
        - script.execute: update_np
        - script.execute: apply_awake_brightness
  - platform: homeassistant
    id: media_artist
    entity_id: ${player}
    attribute: media_artist
    on_value:
      then: [{script.execute: update_np}]
  - platform: homeassistant
    id: media_state
    entity_id: ${player}
    on_value:
      then:
        - lambda: |-
            id(media_playing) = (x == std::string("playing"));
            if (x != "paused") id(paused_ms) = 0;
            if (id(media_playing)) id(pick_started_ms) = 0;
            else if (id(paused_ms) == 0) id(paused_ms) = millis();
        - script.execute: update_np
        # music started (not the TV): the picker has done its job
        - if:
            condition: {lambda: 'return id(media_playing) && !id(media_is_tv) && id(current_mode) == 5;'}
            then: [{script.execute: switch_to_now}]
        # play/pause changes the idle behaviour (dim vs night clock): restart the timer
        - script.execute: screen_timeout_timer
  # Album art: HA's proxy URL carries a rotating token plus a "cache=" hash of
  # the artwork; only refetch when that hash changes.
  - platform: homeassistant
    id: media_picture
    entity_id: ${player}
    attribute: entity_picture
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                if (id(media_is_tv) || x.empty() || x[0] != '/') return false;
                if (x == id(art_key)) return false;
                id(art_key) = x;
                id(art_tries) = 0;
                return true;
            then:
              - online_image.set_url:
                  id: album_blur
                  url: !lambda 'return std::string("http://<ha-ip>:8123") + x;'
  # --- the TV session (for when Club is on the TV input), as the Astrion TV card does
  - platform: homeassistant
    id: tv_plex_title
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_series
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_series_title
    on_value:
      then: [{script.execute: tv_refresh}]
  # HA sends nothing when an attribute is missing, so a movie (no series title)
  # would keep the last show's name — gate the series on the content type.
  - platform: homeassistant
    id: tv_plex_type
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_content_type
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_pic
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_state
    entity_id: media_player.plex_plex_for_android_tv_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_title
    entity_id: media_player.the_club_tv
    attribute: media_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_app
    entity_id: media_player.the_club_tv
    attribute: app_name
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_pic
    entity_id: media_player.the_club_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_state
    entity_id: media_player.the_club_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_atv_pic
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_atv_state
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  # which app the Streamer has in front (ABC iview shows as just "ABC")
  - platform: homeassistant
    id: tv_atv_app
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    attribute: app_id
    on_value:
      then: [{script.execute: tv_refresh}]
  # --- home pages: aircon, blinds, lights
  - platform: homeassistant
    id: ha_ac_state
    entity_id: climate.aircon
    on_value:
      then:
        - lambda: |-
            id(ac_mode) = x;
            if (x != "off" && x != "unknown" && x != "unavailable" && !x.empty()) id(ac_last_mode) = x;
        - script.execute: home_render
  - platform: homeassistant
    id: ha_ac_fan
    entity_id: climate.aircon
    attribute: fan_mode
    on_value:
      then:
        - lambda: 'id(ac_fan) = x;'
        - script.execute: home_render
  # cover.blinds (Sofa) reports inverted: "opening" means it is physically closing
  - platform: homeassistant
    id: ha_bl0_state
    entity_id: cover.blinds
    on_value:
      then:
        - lambda: |-
            id(bl_dir0) = x == "opening" ? -1 : (x == "closing" ? 1 : 0);
            if (id(bl_dir0) == 0 && millis() - id(bl_touched_ms) > 3000) id(bl_tgt0) = id(bl_pos0);
        - script.execute: home_render
  - platform: homeassistant
    id: ha_bl1_state
    entity_id: cover.sheer_blinds
    on_value:
      then:
        - lambda: |-
            id(bl_dir1) = x == "opening" ? 1 : (x == "closing" ? -1 : 0);
            if (id(bl_dir1) == 0 && millis() - id(bl_touched_ms) > 3000) id(bl_tgt1) = id(bl_pos1);
        - script.execute: home_render
  - platform: homeassistant
    id: ha_li_state
    entity_id: light.ckub_all
    on_value:
      then:
        - lambda: 'id(li_on) = x == "on";'
        - script.execute: home_render
  # rooms grouped with this player, for the line under the clock
  - platform: homeassistant
    id: room_group
    entity_id: ${player}
    attribute: group_members
    on_value:
      then:
        - lambda: |-
            static const char *const ent[] = {"media_player.club", "media_player.unnamed_room_5", "media_player.office_sonos",
                                              "media_player.bathroom_sonos", "media_player.bedroom_sonos"};
            static const char *const nm[] = {"CLUB", "LIVING ROOM", "OFFICE", "BATHROOM", "BEDROOM"};
            std::string others; int n = 0;
            for (int i = 0; i < 5; i++)
              if (std::string(ent[i]) != "${player}" && x.find(ent[i]) != std::string::npos) { n++; others = nm[i]; }
            std::string r = "${room_name}";
            if (n == 1) r += " + " + others;
            else if (n > 1) r += " + " + to_string(n) + " ROOMS";
            id(room_txt) = r;
        - script.execute: update_np

