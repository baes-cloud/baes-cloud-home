substitutions:
  name: ble-proxy-s3cam
  friendly_name: BLE Proxy S3 Cam

# ESP32-S3 (QFN56, rev v0.2), 16MB flash, 8MB embedded PSRAM, MAC <mac>.
# Camera board repurposed as a dedicated Bermuda BLE scanner (2026-09-13).
# The camera is intentionally not configured. Original flash backed up to
# ~/esphome/backups/s3cam-ecda3b5843f8-flash-16MB-20260913.bin

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# Logger on the default USB-Serial/JTAG port (2026-09-13). The UART0 variant
# hung silently before WiFi (same symptom as the LD2450 C3 builds that moved
# logging off USB), so keep the default and verify on a wall charger.

# Freenove ESP32-S3-WROOM CAM (FNK0085) — front door face gate for Frigate.
#
# Module:  ESP32-S3-N16R8  = 16 MB flash, 8 MB *octal* PSRAM
# Chip:    ESP32-S3 rev v0.2, MAC <mac>
# Flash:   over the USB-UART port (CH343, /dev/ttyACM0). The USB-OTG port
#          does NOT drive the auto-reset lines — use USB-UART for the first flash.
# Design:  docs/superpowers/specs/2026-08-10-esp32-cam-frigate-design.md

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password



# R8 in "N16R8" means 8 MB of OCTAL PSRAM. Declaring it as quad here would
# leave the camera with no frame buffer and produce black frames at runtime.
psram:
  mode: octal
  speed: 80MHz

logger:
  # UART0 doubles as the camera's own noise source at high framerates; keep the
  # level modest so logging never becomes the bottleneck.
  level: INFO

# --- Diagnostics -------------------------------------------------------------
# These are the availability signal Frigate cannot give us: if the camera stops
# streaming, HA still tells us whether the board is alive and how strong its
# signal is.




button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

# --- LEDs: off, and actively held off ----------------------------------------
# The board's only software-controllable LED is the WS2812 on GPIO48 (the stock
# "RGB Demo" firmware was cycling it). A WS2812 latches its last colour across a
# warm reset, so simply not defining it is not enough — it would keep glowing
# whatever the previous firmware left behind. Declaring it with ALWAYS_OFF makes
# the boot sequence write a real "off" frame to it.
#
# internal: true keeps it out of Home Assistant, so it cannot be switched on by
# accident. At a front door an LED is both a night-time glare source pointed at
# the faces we are trying to recognise, and a needless advertisement.
#
# Any purely hardwired power LED cannot be disabled in software — cover it with
# tape if it bothers you once mounted.
light:
  - platform: esp32_rmt_led_strip
    name: Status LED
    internal: true
    restore_mode: ALWAYS_OFF
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB

# --- Camera ------------------------------------------------------------------
# Pin map is Freenove's for this board. It is not interchangeable with the
# AI-Thinker ESP32-CAM map; a wrong map boots cleanly and streams black.
esp32_camera:
  name: Front Door
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_pins:
    sda: GPIO4
    scl: GPIO5
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  # Starting point, not a final answer. Face recognition wants pixels on the
  # face; the detector does not benefit from high framerate. Tune after
  # measuring the real hit rate at the door.
  resolution: 1024x768
  jpeg_quality: 10
  max_framerate: 10 fps
  idle_framerate: 0.2 fps

esp32_camera_web_server:
  - port: 8080
    mode: stream # Frigate ingests this one
  - port: 8081
    mode: snapshot # handy for eyeballing framing while aiming the camera

# ---- BLE proxy for Bermuda (scan params match the Apollo / S3 Box proxies) ----
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

bluetooth_proxy:
  active: true

