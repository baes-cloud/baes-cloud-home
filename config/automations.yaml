- id: '1785400000033'
  alias: 'RMM: LD2412 latch auto-recover'
  description: 'The LD2412 latches: observed 2026-08-11 reporting still_energy 100
    against a threshold of 15 while still_target stayed off for ~45s+, recovering
    only on movement or a mode toggle. Detector = strong static energy with no target
    declared, sustained 10 min. Uses the AGGREGATE still_energy, which is published
    without engineering mode, so this costs nothing in recorder volume. Restart the
    module, verify, retry once, then notify rather than loop - same shape as the LD2450
    ghost recover (...024). Created by Claude 2026-08-11.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.club_apollo_r_pro_1_ld2412_still_energy
    above: 30
    for: 00:10:00
  conditions:
  - condition: state
    entity_id: binary_sensor.club_apollo_r_pro_1_ld2412_still_target
    state: 'off'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 3600 }}'
  actions:
  - action: logbook.log
    data:
      name: LD2412 study
      message: LD2412 latched (high still_energy, no target) - restarting module
      entity_id: binary_sensor.club_apollo_r_pro_1_ld2412_still_target
  - action: button.press
    target:
      entity_id: button.club_apollo_r_pro_1_ld2412_restart
  - delay: 00:01:30
  - if:
    - condition: state
      entity_id: binary_sensor.club_apollo_r_pro_1_ld2412_still_target
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.club_apollo_r_pro_1_ld2412_still_energy
      above: 30
    then:
    - action: logbook.log
      data:
        name: LD2412 study
        message: LD2412 still latched after restart - retrying once
        entity_id: binary_sensor.club_apollo_r_pro_1_ld2412_still_target
    - action: button.press
      target:
        entity_id: button.club_apollo_r_pro_1_ld2412_restart
    - delay: 00:01:30
    - if:
      - condition: state
        entity_id: binary_sensor.club_apollo_r_pro_1_ld2412_still_target
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.club_apollo_r_pro_1_ld2412_still_energy
        above: 30
      then:
      - action: persistent_notification.create
        data:
          title: LD2412 stuck
          message: The Apollo LD2412 is reporting strong static energy but will not
            declare a target, and two module restarts did not clear it. Presence detection
            in the club is degraded - the sleep automation is falling back to the
            RMM sofa zone. Needs a look.
          notification_id: ld2412_stuck
  mode: single
- id: '1786000000001'
  alias: Bathroom leak alarm
  description: 'IKEA BADRING leak sensor next to the washing machine. On leak: immediate
    push to the Razr + persistent notification, snapshot every Sonos speaker''s current
    volume into scene.leak_alarm_volume_snapshot, then every ~3 min while the sensor
    stays wet - raise volume and speak an alert + alarm tone on every Sonos speaker
    currently on/paused/idle (offline speakers skipped automatically). The moment
    the sensor reports dry: stop, restore every speaker''s original volume from the
    snapshot, and send an all-clear push + TTS. Created by Claude 2026-07-27/08-12.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.0x0c2a6ffffe605def_water_leak
    to: 'on'
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Water leak detected!
        message: Bathroom leak sensor (washing machine) has detected water.
        data:
          ttl: 0
          priority: high
          channel: alarm_stream
    continue_on_error: true
  - action: persistent_notification.create
    data:
      title: Water leak
      message: Water leak detected in the bathroom, near the washing machine. Check
        it now.
      notification_id: bathroom_leak
  - variables:
      leak_speakers: '{{ ["media_player.club", "media_player.bathroom_sonos", "media_player.bathroom_2",
        "media_player.bedroom_sonos", "media_player.office_sonos", "media_player.living_room_sonos"]
        | select(''is_state'',[''on'',''paused'',''idle'']) | list }}'
  - action: scene.create
    data:
      scene_id: leak_alarm_volume_snapshot
      snapshot_entities: '{{ leak_speakers }}'
    continue_on_error: true
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.0x0c2a6ffffe605def_water_leak
        state: 'on'
      sequence:
      - variables:
          leak_speakers: '{{ ["media_player.club", "media_player.bathroom_sonos",
            "media_player.bathroom_2", "media_player.bedroom_sonos", "media_player.office_sonos",
            "media_player.living_room_sonos"] | select(''is_state'',[''on'',''paused'',''idle''])
            | list }}'
      - action: media_player.volume_set
        target:
          entity_id: '{{ leak_speakers }}'
        data:
          volume_level: 0.55
        continue_on_error: true
      - action: tts.speak
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: '{{ leak_speakers }}'
          cache: true
          message: Beep. Beep. Beep.
        continue_on_error: true
      - delay: 00:00:04
      - action: tts.speak
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: '{{ leak_speakers }}'
          cache: true
          message: Water leak detected in the bathroom, near the washing machine.
            Check it now.
        continue_on_error: true
      - delay: 00:00:03
      - action: tts.speak
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: '{{ leak_speakers }}'
          cache: true
          message: Beep. Beep. Beep.
        continue_on_error: true
      - delay: 00:03:00
  - action: scene.turn_on
    target:
      entity_id: scene.leak_alarm_volume_snapshot
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Leak cleared
        message: The bathroom leak sensor is now dry.
        data:
          ttl: 0
          priority: normal
          channel: alarm_stream
    continue_on_error: true
  - action: persistent_notification.dismiss
    data:
      notification_id: bathroom_leak
  - variables:
      leak_speakers: '{{ ["media_player.club", "media_player.bathroom_sonos", "media_player.bathroom_2",
        "media_player.bedroom_sonos", "media_player.office_sonos", "media_player.living_room_sonos"]
        | select(''is_state'',[''on'',''paused'',''idle'']) | list }}'
  - action: tts.speak
    target:
      entity_id: tts.home_assistant_cloud
    data:
      media_player_entity_id: '{{ leak_speakers }}'
      cache: true
      message: The bathroom leak sensor has cleared. All good.
    continue_on_error: true
  mode: restart
- id: '1788089324149'
