      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_cupboard_light_3
          - light.bedroom_cupboard_light_2
          - light.bedlamps
  mode: restart
- id: '1785400000010'
  alias: 'RMM: Sonos follows you'
  description: 'Music follows occupancy: entering a zone joins that room''s Sonos
    to the Club; zone empty 5 min un-joins it. Created by Claude 2026-07-25. 2026-09-26:
    no longer copies the Club''s volume on join - each room keeps its own level (capped
    to 20 each morning by ''RMM: Sonos morning volume reset''). Speaker actions are
    guarded on availability. 2026-09-27: joins only when input_boolean.music_follows_me
    is on (un-join always runs).'
  triggers:
  - trigger: state
    entity_id: binary_sensor.rmm_default_bedroom_occupancy
    to: 'on'
    id: bedroom_on
  - trigger: state
    entity_id: binary_sensor.rmm_default_bedroom_occupancy
    to: 'off'
    for: 00:05:00
    id: bedroom_off
  - trigger: state
    entity_id: binary_sensor.rmm_default_office_occupancy
    to: 'on'
    id: office_on
  - trigger: state
    entity_id: binary_sensor.rmm_default_office_occupancy
    to: 'off'
    for: 00:05:00
    id: office_off
  - trigger: state
    entity_id: binary_sensor.rmm_default_bathroom_occupancy
    to: 'on'
    id: bathroom_on
  - trigger: state
    entity_id: binary_sensor.rmm_default_bathroom_occupancy
    to: 'off'
    for: 00:05:00
    id: bathroom_off
  conditions:
  - alias: 'Guest mode off - OR auto-stay on (party: keep following me)'
    condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
    - condition: state
      entity_id: input_boolean.auto_stay
      state: 'on'
  actions:
  - choose:
    - alias: Entered the zone - join the Club, leave the room's own volume alone
      conditions:
      - condition: state
        entity_id: input_boolean.music_follows_me
        state: 'on'
      - condition: template
        value_template: '{{ edge == ''on'' }}'
      - condition: state
        entity_id: media_player.club
        state: playing
      - condition: template
        value_template: '{{ states(speaker) not in [''unavailable'', ''unknown'']
          }}'
      sequence:
      - action: media_player.join
        target:
          entity_id: media_player.club
        data:
          group_members:
          - '{{ speaker }}'
    - alias: Zone empty 5 min - un-join, but only if it is actually in the Club group
      conditions:
      - condition: template
        value_template: '{{ edge == ''off'' }}'
      - condition: template
        value_template: '{{ states(speaker) not in [''unavailable'', ''unknown'']
          }}'
      - condition: template
        value_template: '{{ speaker in (state_attr(''media_player.club'', ''group_members'')
          or []) }}'
      sequence:
      - action: media_player.unjoin
        target:
          entity_id: '{{ speaker }}'
  variables:
    speakers:
      bedroom: media_player.bedroom_sonos
      office: media_player.office_sonos
      bathroom: media_player.bathroom_sonos
    room: '{{ trigger.id.split(''_'')[0] }}'
    edge: '{{ trigger.id.split(''_'')[1] }}'
    speaker: '{{ speakers[room] }}'
  mode: queued
  max: 10
- id: '1785400000011'
  alias: 'RMM: Fall alert'
  description: Radar fall detection -> persistent notification. Created by Claude
    2026-07-25.
  triggers:
  - trigger: state
    entity_id: binary_sensor.rmm_default_fall_alert
    to: 'on'
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: Fall detected
      message: RMM radar fall detection triggered at {{ now().strftime('%H:%M:%S')
        }}. Check the radar map.
      notification_id: rmm_fall_alert
  mode: single
- id: '1785400000012'
  alias: 'RMM: Away mode - arm'
  description: Arms away mode ONLY when person.bae is not_home AND the Motorola Razr
    is not home AND every radar zone is clear. device_tracker.pixel_6a is deliberately
    EXCLUDED - I leaves that phone at home, so it is not a presence signal. Radar-empty
    alone is NOT sufficient; it loses very still people.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.rmm_default_master
    below: 1
    for: 00:15:00
  - trigger: state
    entity_id: binary_sensor.bae_home
    to: 'off'
    for: 00:05:00
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: input_boolean.away_mode
    state: 'off'
  - condition: state
    entity_id: binary_sensor.bae_home
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: device_tracker.motorola_razr_50
      state: home
  - condition: template
    value_template: '{{ expand(''binary_sensor.rmm_default_lounge_occupancy'',''binary_sensor.rmm_default_sofa_occupancy'',''binary_sensor.rmm_default_bed_occupancy'',''binary_sensor.rmm_default_bedroom_occupancy'',''binary_sensor.rmm_default_kitchen_occupancy'',''binary_sensor.rmm_default_office_occupancy'',''binary_sensor.rmm_default_bathroom_occupancy'',''binary_sensor.rmm_default_wardrobe_occupancy'')
      | selectattr(''state'',''eq'',''on'') | list | count == 0 }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.away_mode
  - action: light.turn_off
    target:
      entity_id: all
  - action: media_player.media_pause
    target:
      entity_id: media_player.club
    continue_on_error: true
  - action: remote.turn_off
    target:
      entity_id: remote.the_club_tvv
    continue_on_error: true
  - action: media_player.turn_off
    target:
      entity_id: media_player.55_the_serif_3
    continue_on_error: true
  - action: climate.turn_off
    target:
      entity_id: climate.aircon
    continue_on_error: true
  - action: radar_map_manager.reset_tracking_history
    data: {}
    continue_on_error: true
  mode: single
- id: '1785400000013'
  alias: 'RMM: Away mode - welcome home'
  description: 'Disarms away mode on any sign of life - radar target, a zone going
    occupied, person.bae home, or the Razr arriving. Ignores pixel_6a (always home).
    Deliberately permissive: a false disarm is harmless, a stuck away mode is not.
    Welcome TTS moved to "Front door · BLE arrival unlock + welcome" (plays on door
    open) on 2026-09-23.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.rmm_default_master
    above: 0
    id: radar
  - trigger: state
    entity_id: person.bae
    to: home
    id: person
  - trigger: state
    entity_id: binary_sensor.bae_home
    to: 'on'
    id: person
  - trigger: state
    entity_id: device_tracker.motorola_razr_50
    to: home
    id: person
  - trigger: state
    entity_id:
    - binary_sensor.rmm_default_lounge_occupancy
    - binary_sensor.rmm_default_sofa_occupancy
    - binary_sensor.rmm_default_bedroom_occupancy
    - binary_sensor.rmm_default_kitchen_occupancy
    to: 'on'
    id: radar
  conditions:
  - condition: state
    entity_id: input_boolean.away_mode
    state: 'on'
  - alias: Radar only counts when the Roborock isn't running
    condition: template
    value_template: '{{ trigger.id == ''person'' or is_state(''binary_sensor.roborock_active'',''off'')
      }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.away_mode
    data: {}
  mode: single
- id: '1785400000014'
  alias: 'RMM: Intruder alert'
  description: Radar sees a person while away mode is armed and neither person.bae
    nor the Razr is home -> push alert with camera snapshot. pixel_6a excluded (always
    home).
  triggers:
  - trigger: numeric_state
    entity_id: sensor.rmm_default_master
    above: 0
    for: 00:01:00
  conditions:
  - condition: state
    entity_id: input_boolean.away_mode
    state: 'on'
  - condition: state
    entity_id: binary_sensor.bae_home
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: device_tracker.motorola_razr_50
      state: home
  - alias: Not just the Roborock (unless a door moved in the last 10 min)
    condition: template
    value_template: '{{ is_state(''binary_sensor.roborock_active'',''off'') or (now()
      - states.binary_sensor.ikea_of_sweden_parasoll_door_window_sensor.last_changed).total_seconds()
      < 600 or (now() - states.lock.lock_pro_0fa0.last_changed).total_seconds() <
      600 }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.intruder_alert_active
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Intruder?
        message: Radar sees {{ states('sensor.rmm_default_master') }} person(s) in
          the flat while away mode is armed.
        data:
          ttl: 0
          priority: high
    continue_on_error: true
  - action: persistent_notification.create
    data:
      title: Intruder alert
      message: Radar occupancy while away at {{ now().strftime('%H:%M:%S') }}.
      notification_id: rmm_intruder
  mode: single
- id: '1785400000015'
  alias: 'RMM: Occupancy climate'
  description: Club aircon runs only when the open-plan zones are actually occupied
    (5 min on, 20 min empty off). Created by Claude 2026-07-25.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.rmm_default_lounge_occupancy
    - binary_sensor.rmm_default_sofa_occupancy
    - binary_sensor.rmm_default_kitchen_occupancy
    - binary_sensor.rmm_default_office_occupancy
    to: 'on'
    for: 00:05:00
    id: occupied
  - trigger: state
    entity_id:
    - binary_sensor.rmm_default_lounge_occupancy
    - binary_sensor.rmm_default_sofa_occupancy
    - binary_sensor.rmm_default_kitchen_occupancy
    - binary_sensor.rmm_default_office_occupancy
    to: 'off'
    for: 00:20:00
    id: empty
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: state
        entity_id: climate.aircon
        state: 'off'
      sequence:
      - action: climate.turn_on
        target:
          entity_id: climate.aircon
    - conditions:
      - condition: trigger
        id: empty
      - condition: state
        entity_id: binary_sensor.rmm_default_lounge_occupancy
        state: 'off'
      - condition: state
        entity_id: binary_sensor.rmm_default_sofa_occupancy
        state: 'off'
      - condition: state
        entity_id: binary_sensor.rmm_default_kitchen_occupancy
        state: 'off'
      - condition: state
        entity_id: binary_sensor.rmm_default_office_occupancy
        state: 'off'
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.aircon
  mode: restart
- id: '1785400000016'
  alias: 'RMM: Guest mode auto'
  description: 2+ radar targets for 10 min -> guest mode on (suppresses sleep lights-off
    and Sonos-follow); back to <=1 for 30 min -> off. Created by Claude 2026-07-25.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.rmm_default_master
    above: 1
    for: 00:10:00
    id: guests
  - trigger: numeric_state
    entity_id: sensor.rmm_default_master
    below: 2
    for: 00:30:00
    id: alone
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: guests
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guest_mode
    - conditions:
      - condition: trigger
        id: alone
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guest_mode
  mode: restart
- id: '1785400000017'
  alias: 'RMM: Weekday morning routine'
  description: 'First bed-exit on a weekday morning while home: fade lights to Santorini,
    Serif on to HDMI4, Google TV Streamer opens the ABC News live stream. Created
    by Claude 2026-07-25.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.rmm_default_bed_occupancy
    to: 'off'
    for: 00:03:00
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: time
    after: 07:00:00
    before: 09:30:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: binary_sensor.bae_home
    state: 'on'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 21600 }}'
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.home_home_santorini
    data:
      transition: 20
  - action: media_player.turn_on
    target:
      entity_id: media_player.55_the_serif_3
    continue_on_error: true
  - delay: 00:00:06
  - action: media_player.select_source
    target:
      entity_id: media_player.55_the_serif_3
    data:
      source: hdmi4
    continue_on_error: true
  - action: remote.turn_on
    target:
      entity_id: remote.the_club_tvv
    continue_on_error: true
  - delay: 00:00:10
  - action: androidtv.adb_command
    target:
      entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    data:
      command: am start -a android.intent.action.VIEW -d "https://www.youtube.com/@abcnewsaustralia/live"
    continue_on_error: true
  mode: single
- id: '1785400000018'
  alias: 'RMM: Morning calendar briefing'
  description: 'First bathroom visit on a weekday morning: the bathroom Sonos reads
    today''s calendar, then joins the Club (TV audio / news). Created by Claude 2026-07-25.
    Skipped entirely if media_player.bathroom_sonos is unavailable.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.rmm_default_bathroom_occupancy
    to: 'on'
    id: zone
  - trigger: state
    entity_id: binary_sensor.bathroom_occupancy_sonoff_snzb_06p
    to: 'on'
    id: pir
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: time
    after: 06:00:00
    before: '10:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: binary_sensor.bae_home
    state: 'on'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 21600 }}'
  - condition: template
    value_template: '{{ states(''media_player.bathroom_sonos'') not in [''unavailable'',''unknown'']
      }}'
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.work
    data:
      start_date_time: '{{ today_at() }}'
      end_date_time: '{{ today_at(''23:59:59'') }}'
    response_variable: agenda
  - action: tts.speak
    target:
      entity_id: tts.home_assistant_cloud
    data:
      media_player_entity_id: media_player.bathroom_sonos
      cache: false
      message: '{% set evs = agenda[''calendar.work''][''events'']
        %}Good morning. {% if evs | count == 0 %}Your calendar is clear today.{% else
        %}You have {{ evs | count }} thing{{ ''s'' if evs | count > 1 }} on today.
        {% for e in evs %}{% if ''T'' in e.start %}At {{ as_timestamp(e.start) | timestamp_custom(''%-I:%M
        %p'') }}, {% endif %}{{ e.summary }}. {% endfor %}{% endif %}'
  - wait_template: '{{ states(''media_player.bathroom_sonos'') != ''playing'' }}'
    timeout: 00:01:30
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set g = state_attr('sensor.daily_news','generated_at')
          %} {{ state_attr('sensor.daily_news','tts_chunks') is iterable\n   and state_attr('sensor.daily_news','tts_chunks')
          | count > 0\n   and g is not none\n   and (now() - (g | as_datetime)).total_seconds()
          < 86400 }}"
      sequence:
      - repeat:
          for_each: '{{ state_attr(''sensor.daily_news'',''tts_chunks'') }}'
          sequence:
          - action: tts.speak
            target:
              entity_id: tts.home_assistant_cloud
            data:
              media_player_entity_id: media_player.bathroom_sonos
              cache: false
              message: '{{ repeat.item }}'
          - wait_template: '{{ states(''media_player.bathroom_sonos'') != ''playing''
              }}'
            timeout: 00:01:30
            continue_on_timeout: true
    default:
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.bathroom_sonos
        cache: false
        message: News digest unavailable this morning.
  - wait_template: '{{ states(''media_player.bathroom_sonos'') != ''playing'' }}'
    timeout: 00:06:00
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: input_boolean.music_follows_me
      state: 'on'
    - condition: state
      entity_id: media_player.club
      state: playing
    then:
    - alias: Cap the bathroom at 20 before joining (never raise it)
      action: media_player.volume_set
      target:
        entity_id: media_player.bathroom_sonos
      data:
        volume_level: '{{ [ state_attr(''media_player.bathroom_sonos'', ''volume_level'')
          | float(0.2), 0.2 ] | min | round(2) }}'
      continue_on_error: true
    - action: media_player.join
      target:
        entity_id: media_player.club
      data:
        group_members:
        - media_player.bathroom_sonos
  mode: single
- id: '1785400000019'
  alias: 'RMM: Ambient day lights'
  description: Movement anywhere in the house during the day -> art pendants + club
    LEDs, each gated by its manual-override helper. Night schedule / sleep / away
    handle the off. Created by Claude 2026-07-25.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.rmm_default_lounge_occupancy
    - binary_sensor.rmm_default_kitchen_occupancy
    - binary_sensor.rmm_default_office_occupancy
    - binary_sensor.rmm_default_wardrobe_occupancy
    - binary_sensor.rmm_default_bathroom_occupancy
    - binary_sensor.rmm_default_bedroom_occupancy
    - binary_sensor.rmm_default_sofa_occupancy
    - binary_sensor.rmm_default_bed_occupancy
    to: 'on'
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: template
    value_template: '{% set d = now().weekday() %}{% set t = now().hour*60 + now().minute
      %}{{ not ((d in [6,0,1,2,3] and t >= 21*60) or (d in [0,1,2,3,4] and t < 7*60)
      or (d in [4,5] and t >= 23*60) or (d in [5,6] and t < 9*60)) }}'
  - condition: state
    entity_id: input_boolean.away_mode
    state: 'off'
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.override_art_pendants
      state: 'off'
    then:
    - action: light.turn_on
      target:
        entity_id: light.club_art_pendants
    - action: light.turn_on
      data: {}
      target:
        entity_id:
        - light.club_accent_chair_lights
        - light.club_accent_lights
  - if:
    - condition: state
      entity_id: input_boolean.override_club_leds
      state: 'off'
    then:
    - action: light.turn_on
      target:
        entity_id: light.club_led_group
  mode: single
  max_exceeded: silent
- id: '1785400000020'
  alias: 'RMM: Light override tracker'
  description: 'A light turned off/on BY A HUMAN (context.user_id set - UI, app or
    voice) locks or unlocks that light for automation. Uses user_id, NOT parent_id:
    time-triggered automations (the sweeper, the 21:00 scene) also have parent_id=None
    and were false-locking lights. Reset daily 06:00.'
  triggers:
  - trigger: state
    entity_id:
    - light.couch
    - light.club_accent_lights
    - light.club_art_pendants
    - light.club_led_group
    to: 'off'
    id: manual_off
  - trigger: state
    entity_id:
    - light.couch
    - light.club_accent_lights
    - light.club_art_pendants
    - light.club_led_group
    to: 'on'
    id: manual_on
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.context.user_id is not none }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: manual_off
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: '{% set m = {"light.couch": "input_boolean.override_couch_light",
            "light.club_accent_lights": "input_boolean.override_accent_lights", "light.club_art_pendants":
            "input_boolean.override_art_pendants", "light.club_led_group": "input_boolean.override_club_leds"}
            %}{{ m[trigger.entity_id] }}'
    - conditions:
      - condition: trigger
        id: manual_on
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: '{% set m = {"light.couch": "input_boolean.override_couch_light",
            "light.club_accent_lights": "input_boolean.override_accent_lights", "light.club_art_pendants":
            "input_boolean.override_art_pendants", "light.club_led_group": "input_boolean.override_club_leds"}
            %}{{ m[trigger.entity_id] }}'
  mode: queued
  max: 10
- id: '1785400000021'
  alias: 'RMM: Light overrides daily reset'
  description: Manual light lockouts last until the next day. Created by Claude 2026-07-25.
  triggers:
  - trigger: time
    at: 06:00:00
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.override_accent_lights
      - input_boolean.override_art_pendants
      - input_boolean.override_club_leds
      - input_boolean.override_couch_light
  mode: single
- id: '1785400000022'
  alias: 'RMM: Weekday scene schedule'
  description: 'Mon-Fri: script.club at sunset while home; Sun-Thu 21:00 scene.night
    (which itself dims couch/leds/pendants to night ambiance) + accent lights off.
    Created by Claude 2026-07-25. (Sunrise Santorini removed 2026-09-22 — morning
    lights now come from the work alarms, packages/work_alarms.yaml.)'
  triggers:
  - trigger: sun
    event: sunset
    id: sunset
  - trigger: time
    at: '21:00:00'
    id: night
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      - condition: state
        entity_id: binary_sensor.bae_home
        state: 'on'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.club
    - conditions:
      - condition: trigger
        id: night
