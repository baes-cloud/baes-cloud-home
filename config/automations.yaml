          entity_id: light.club_apollo_r_pro_1_rgb_light
        data:
          rgb_color:
          - 0
          - 255
          - 0
          transition: 0.6
      - delay:
          milliseconds: 700
      - action: light.turn_off
        target:
          entity_id: light.club_apollo_r_pro_1_rgb_light
        data:
          transition: 0.6
      - delay:
          milliseconds: 700
  mode: restart
- id: '1788089356727'
  alias: Assist LED - Idle Off
  description: Turn light off once satellite returns to idle
  triggers:
  - trigger: state
    entity_id:
    - assist_satellite.esp32_s3_box_5a7e34_assist_satellite
    to: idle
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id: light.club_apollo_r_pro_1_rgb_light
    data:
      transition: 0.3
  mode: single
- id: '1788089364633'
  alias: Assist LED - Safety Timeout
  description: Force light off if on for 15s straight, no matter why
  triggers:
  - trigger: state
    entity_id:
    - light.club_apollo_r_pro_1_rgb_light
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 15
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id: light.club_apollo_r_pro_1_rgb_light
  mode: restart
- id: '1789400000001'
  alias: Presence · restart Razr BLE transmitter
  description: Safety net for Bermuda room presence. If the Companion app (GPS) says
    Bae is home but Bermuda cannot hear the Razr's BLE transmitter, send the Companion
    app command to switch the transmitter back on. Rate-limited to once per 10 minutes.
    Added by Claude 2026-09-13.
  mode: single
  triggers:
  - trigger: state
    entity_id: device_tracker.bermuda_razr_bermuda_tracker
    to: not_home
    id: ble_lost
  - trigger: state
    entity_id: device_tracker.motorola_razr_50
    to: home
    for: 00:02:00
    id: arrived
  - trigger: time_pattern
    minutes: /15
    id: periodic
  conditions:
  - condition: state
    entity_id: device_tracker.motorola_razr_50
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: device_tracker.bermuda_razr_bermuda_tracker
      state: home
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 600 }}'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        message: command_ble_transmitter
        data:
          command: turn_on
  - action: logbook.log
    data:
      name: Razr BLE transmitter
      message: 'restart sent ({{ trigger.id }}): Companion app says home, Bermuda
        BLE says {{ states(''device_tracker.bermuda_razr_bermuda_tracker'') }}'
- id: '1789500000001'
  alias: Standby · health alert
  description: 'Warns when the failover standby is not fit for purpose: the Pi400
    is unreachable, or the nightly config sync has gone stale. A standby that is quietly
    offline is worse than none, because you only find out during an outage. The 06:00
    sync on 2026-09-21 failed silently, which is what prompted this. Added by Claude
    2026-09-21.'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.pi400_standby_online
    to: 'off'
    for: 00:15:00
    id: offline
  - trigger: template
    value_template: "{{ states('sensor.ha_standby_last_sync') not in ['unknown', 'unavailable']\n
      \  and (now() - (states('sensor.ha_standby_last_sync') | as_datetime)).total_seconds()
      > 108000 }}"
    id: stale
  - trigger: state
    entity_id: sensor.ha_standby_last_sync
    to: unavailable
    for: 02:00:00
    id: nosensor
  conditions: []
  actions:
  - variables:
      msg: '{% if trigger.id == ''offline'' %}Pi400 standby unreachable for 15 minutes
        - there is nothing to promote if the Pi5 fails. {% elif trigger.id == ''stale''
        %}Standby config sync last succeeded {{ states(''sensor.ha_standby_last_sync'')
        }} - it would boot an old config. {% else %}Standby sync heartbeat has stopped
        - check the Pi400 and its cron job.{% endif %}'
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Failover standby problem
        message: '{{ msg }}'
        data:
          channel: Failover
          importance: high
          tag: standby_health
  - action: persistent_notification.create
    data:
      title: Failover standby problem
      message: '{{ msg }}'
      notification_id: standby_health
- id: '1788110000001'
  alias: Front door · auto-lock
  description: Locks 30s after the contact sensor reads closed. If the sensor is unavailable/unknown,
    falls back to a blind 45s timer. If the door is genuinely open this does nothing
    and waits for it to close — the 10-minute backstop handles a door left standing
    open. Suppressed during a tag unlock and while the keep-unlocked override is on.
  triggers:
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: unlocked
  - trigger: state
    entity_id: binary_sensor.front_door_open
    to:
    - 'on'
    - 'off'
    - unavailable
    - unknown
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: unlocked
  - condition: state
    entity_id: input_boolean.front_door_tag_grace
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_unlock_hold
    state: 'off'
  actions:
  - choose:
    - alias: Contact sensor is dead — blind 45 second timer
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.front_door_open
          state:
          - 'on'
          - 'off'
      sequence:
      - delay: 00:00:45
    - alias: Door reads closed — 30 second timer
      conditions:
      - condition: state
        entity_id: binary_sensor.front_door_open
        state: 'off'
      sequence:
      - delay: 00:00:30
    default:
    - stop: Door is open — waiting for it to close (mode:restart re-runs on close)
  - alias: Re-check before throwing the bolt
    condition: state
    entity_id: lock.lock_pro_0fa0
    state: unlocked
  - condition: state
    entity_id: input_boolean.front_door_tag_grace
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_unlock_hold
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: binary_sensor.front_door_open
      state: 'on'
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - action: lock.lock
    target:
      entity_id: lock.lock_pro_0fa0
  mode: restart
- id: '1788110000002'
  alias: Front door · Sonos announcement
  description: Speaks over whatever the Sonos speakers are already playing using the
    native announce path — ducks the music at low volume, then resumes. Skipped for
    tag unlocks and for a silenced overnight sweep lock.
  triggers:
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: unlocked
    id: unlocked
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: locked
    id: locked
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_tag_grace
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_quiet_lock
    state: 'off'
  actions:
  - action: media_player.play_media
    target:
      entity_id:
      - media_player.club
      - media_player.bedroom_sonos
      - media_player.bathroom_sonos
    data:
      media_content_type: music
      media_content_id: media-source://tts/tts.home_assistant_cloud?message={{ phrase
        | urlencode }}
      announce: true
      extra:
        volume: 15
  mode: queued
  max: 5
  variables:
    phrase: '{{ ''Front door unlocked'' if trigger.id == ''unlocked'' else ''Front
      door locked'' }}'
- id: '1788110000003'
  alias: Front door · push to Razr
  description: Every lock/unlock, on a quiet channel. Replaces itself rather than
    stacking.
  mode: queued
  max: 10
  triggers:
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: unlocked
    id: unlocked
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: locked
    id: locked
  variables:
    heading: '{{ ''Front door unlocked'' if trigger.id == ''unlocked'' else ''Front
      door locked'' }}'
    door: '{% set d = states(''binary_sensor.front_door_open'') %} {{ ''door closed''
      if d == ''off'' else ''door open'' if d == ''on'' else ''door sensor offline''
      }}'
    detail: '{% if is_state(''input_boolean.front_door_tag_grace'', ''on'') %}tag
      scan · relocking in 30s {%- else %}{{ door }}{% endif %}'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: '{{ heading }}'
        message: '{{ now().strftime(''%-I:%M %p'') }} · {{ detail }}'
        data:
          channel: Front door
          importance: low
          tag: front_door_lock_state
          group: front_door
          notification_icon: '{{ ''mdi:lock-open-variant'' if trigger.id == ''unlocked''
            else ''mdi:lock'' }}'
- id: '1788110000004'
  alias: Front door · lock when I leave
  description: One minute after binary_sensor.bae_home goes off (Companion app GPS
    AND Bermuda BLE agree you left), lock up if it was left unlocked. Skipped while
    the keep-unlocked override is on.
  triggers:
  - trigger: state
    entity_id: binary_sensor.bae_home
    to: 'off'
    for: 00:01:00
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: unlocked
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  actions:
  - action: lock.lock
    target:
      entity_id: lock.lock_pro_0fa0
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Front door locked
        message: You left and it was still unlocked — locked it for you.
        data:
          channel: Front door
          importance: default
          tag: front_door_away_autolock
  mode: single
- id: '1788110000005'
  alias: Front door · ALERT unlocked while away
  description: High-priority alert if the lock opens while you are not home, with
    a 60s grace period you can override from the notification itself. The alert always
    fires; the relock is skipped while the keep-unlocked override is on.
  triggers:
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: unlocked
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: binary_sensor.bae_home
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_tag_grace
    state: 'off'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Front door unlocked while you're away
        message: Unlocked at {{ now().strftime('%-I:%M %p') }}. Relocking in 60 seconds.
        data:
          channel: Front door security
          importance: high
          priority: high
          ttl: 0
          color: red
          sticky: true
          tag: front_door_away_alert
          notification_icon: mdi:lock-alert
          actions:
          - action: FRONT_DOOR_HOLD_UNLOCKED
            title: Leave it unlocked
          - action: FRONT_DOOR_LOCK_NOW
            title: Lock now
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: FRONT_DOOR_HOLD_UNLOCKED
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: FRONT_DOOR_LOCK_NOW
    timeout: 00:01:00
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
        == ''FRONT_DOOR_HOLD_UNLOCKED'' }}'
    then:
    - stop: You chose to leave it unlocked
  - alias: Keep-unlocked override wins over the automatic relock
    condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: unlocked
  - action: lock.lock
    target:
      entity_id: lock.lock_pro_0fa0
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Front door relocked
        message: Relocked automatically while you're away.
        data:
          channel: Front door security
          importance: high
          tag: front_door_away_alert
  mode: restart
- id: '1788110000006'
  alias: Front door · NFC tag unlock (Razr only)
  description: Only fires when tag <nfc-tag-1> or <nfc-tag-2> is scanned by the motorola
    razr 50. Unlocks, holds 30s, relocks. TTS and the 5s auto-lock are gated off for
    the duration. The relock is skipped while the keep-unlocked override is on.
  mode: restart
  triggers:
  - trigger: tag
    tag_id: <nfc-tag-id>
    device_id: <device-id>
  - trigger: tag
    tag_id: <nfc-tag-id>
    device_id: <device-id>
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.front_door_tag_grace
  - action: lock.unlock
    target:
      entity_id: lock.lock_pro_0fa0
  - delay: 00:00:30
  - if:
    - condition: state
      entity_id: input_boolean.front_door_keep_unlocked
      state: 'off'
    then:
    - action: lock.lock
      target:
        entity_id: lock.lock_pro_0fa0
  - delay: 00:00:03
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.front_door_tag_grace
- id: '1788110000007'
  alias: Front door · clear stuck suppression flags
  description: Safety net. If the tag automation or the sweep is interrupted (or HA
    restarts) mid-run, the tag-grace or quiet-lock flag would otherwise stay on and
    permanently disable auto-locking or the announcements. Does NOT touch the keep-unlocked
    override — that one is yours to clear.
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.front_door_tag_grace
    to: 'on'
    for: 00:01:30
  - trigger: state
    entity_id: input_boolean.front_door_quiet_lock
    to: 'on'
    for: 00:01:30
  - trigger: state
    entity_id: input_boolean.front_door_unlock_hold
    to: 'on'
    for: 00:01:00
  - trigger: homeassistant
    event: start
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.front_door_tag_grace
      - input_boolean.front_door_quiet_lock
      - input_boolean.front_door_unlock_hold
- id: '1788110000008'
  alias: Front door · 10-minute backstop and 3-hourly sweep
  description: Locks the door once it has been unlocked for 10 minutes, whatever the
    door is doing, and sweeps every 3 hours as a safety net for missed events or an
    HA restart. Never acts within 10 minutes of an unlock. A sweep lock between 22:00
    and 07:00 is silenced so it does not announce over the Sonos speakers.
  triggers:
  - trigger: state
    entity_id: lock.lock_pro_0fa0
    to: unlocked
    for: 00:10:00
    id: backstop
  - trigger: time_pattern
    hours: /3
    minutes: 0
    seconds: 0
    id: sweep
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: unlocked
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  - condition: state
    entity_id: input_boolean.front_door_tag_grace
    state: 'off'
  - alias: Only if it has been unlocked for at least 10 minutes
    condition: template
    value_template: '{{ (now() - states.lock.lock_pro_0fa0.last_changed).total_seconds()
      >= 600 }}'
  actions:
  - alias: Silence an overnight sweep lock so it does not wake the house
    if:
    - condition: trigger
      id: sweep
    - condition: time
      after: '22:00:00'
      before: 07:00:00
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.front_door_quiet_lock
  - action: lock.lock
    target:
      entity_id: lock.lock_pro_0fa0
  - wait_template: '{{ is_state(''lock.lock_pro_0fa0'', ''locked'') }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Front door locked
        message: '{{ ''Unlocked for 10 minutes'' if trigger.id == ''backstop'' else
          ''Routine check found it unlocked'' }} — {{ ''locked it'' if is_state(''lock.lock_pro_0fa0'',
          ''locked'') else ''lock did not confirm'' }}{{ '', door was open'' if is_state(''binary_sensor.front_door_open'',
          ''on'') else '''' }}.'
        data:
          channel: Front door
          importance: low
          tag: front_door_lock_state
          group: front_door
          notification_icon: mdi:lock-clock
  - delay: 00:00:05
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.front_door_quiet_lock
  mode: single
  max_exceeded: silent
- id: '1788110000009'
  alias: Front door · keep-unlocked override
  description: input_boolean.front_door_keep_unlocked is the manual override button.
    Turning it on unlocks the door and holds it against every auto-lock. Turning it
    off resumes normal behaviour and locks up if the door is closed. Reminds you every
    3 hours while it is on.
  mode: queued
  max: 5
  triggers:
  - trigger: state
    entity_id: input_boolean.front_door_keep_unlocked
    to: 'on'
    id: enabled
  - trigger: state
    entity_id: input_boolean.front_door_keep_unlocked
    to: 'off'
    id: disabled
  - trigger: time_pattern
    hours: /3
    minutes: 5
    seconds: 0
    id: reminder
  actions:
  - choose:
    - alias: Turned on — unlock and hold
      conditions:
      - condition: trigger
        id: enabled
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.lock_pro_0fa0
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Front door held unlocked
            message: Auto-locking is off until you turn this back off.
            data:
              channel: Front door
              importance: default
              sticky: true
              color: '#ff9800'
              tag: front_door_keep_unlocked
              notification_icon: mdi:lock-open-alert
              actions:
              - action: FRONT_DOOR_RESUME_AUTOLOCK
                title: Resume auto-locking
    - alias: Turned off — resume and lock up
      conditions:
      - condition: trigger
        id: disabled
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: front_door_keep_unlocked
      - condition: state
        entity_id: lock.lock_pro_0fa0
        state: unlocked
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.front_door_open
          state: 'on'
      - action: lock.lock
        target:
          entity_id: lock.lock_pro_0fa0
    - alias: Still on — periodic reminder
      conditions:
      - condition: trigger
        id: reminder
      - condition: state
        entity_id: input_boolean.front_door_keep_unlocked
        state: 'on'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Front door is still held unlocked
            message: On since {{ as_local(states.input_boolean.front_door_keep_unlocked.last_changed).strftime('%-I:%M
              %p') }}. Auto-locking stays off until you turn it back off.
            data:
              channel: Front door
              importance: default
              sticky: true
              color: '#ff9800'
              tag: front_door_keep_unlocked
              notification_icon: mdi:lock-open-alert
              actions:
              - action: FRONT_DOOR_RESUME_AUTOLOCK
                title: Resume auto-locking
- id: '1788110000010'
  alias: Front door · notification action — resume auto-locking
  description: Handles the "Resume auto-locking" button on the keep-unlocked notification.
    Clearing the override triggers the resume-and-lock-up branch above.
  mode: single
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: FRONT_DOOR_RESUME_AUTOLOCK
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.front_door_keep_unlocked
- id: '1789000000001'
  alias: 'News: mirror digest into local storage'
  description: Copies the published digest into /config/www/news so it is reachable
    at /local/news/index.html through Nabu Casa when away from home.
  triggers:
  - trigger: time
    at: 05:05:00
  conditions: []
  actions:
  - action: shell_command.mirror_news_digest
- id: '1789000000002'
  alias: 'News: alert on repeated curation failures'
  description: Two consecutive failed runs means the job is broken rather than unlucky.
    The usual cause is expired headless Claude Code auth on baelap.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.daily_news_health
    attribute: failure_count
    above: 1
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: News digest is failing
      message: '{{ state_attr(''sensor.daily_news_health'',''failure_count'') }} consecutive
        failures. Last error: {{ state_attr(''sensor.daily_news_health'',''last_error'')
        }}. Check `journalctl -u news-digest` on baelap — headless Claude Code auth
        may have expired.'
      notification_id: news_digest_failing
  mode: single
- id: '1789000000003'
  alias: 'News: alert when the digest goes stale'
  description: 'Catches the case health.json cannot report: baelap down or SSH to
    Unraid broken, so nothing new arrives at all.'
  triggers:
  - trigger: time_pattern
    hours: /6
  conditions:
  - condition: template
    value_template: '{% set g = state_attr(''sensor.daily_news'',''generated_at'')
      %} {{ g is not none and (now() - (g | as_datetime)).total_seconds() > 93600
      }}'
  actions:
  - action: persistent_notification.create
    data:
      title: News digest is stale
      message: No fresh digest since {{ state_attr('sensor.daily_news','generated_at')
        }}. baelap may be down or unable to reach Unraid.
      notification_id: news_digest_stale
  mode: single
- id: '1788110000011'
  alias: Front door · door sensors disagree
  description: The Zigbee contact sensor and the SwitchBot Lock Pro's built-in door
    sensor should always agree. If they disagree for 10 minutes one of them is stuck,
    which silently degrades the 5s auto-lock into the 10-minute backstop.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_open
    attribute: disagree
    to: 'yes'
    for: 00:10:00
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Front door sensors disagree
        message: Contact sensor says {{ state_attr('binary_sensor.front_door_open',
          'contact_sensor') }}, lock says {{ state_attr('binary_sensor.front_door_open',
          'lock_sensor') }}. One is probably stuck — the 5s auto-lock is falling back
          to the 10-minute backstop.
        data:
          channel: Front door
          importance: default
          tag: front_door_sensor_disagree
          notification_icon: mdi:alert-decagram
- id: '1788110000012'
  alias: Front door · BLE arrival unlock + welcome
  description: 'When a Bermuda proxy spots the Razr after it has been away for 10+
    minutes, AND RMM away mode was armed (on, or disarmed <10 min ago — blocks false
    ''arrivals'' when the phone''s beacon sleeps overnight) AND the Companion app
    GPS also says home (waits up to 2 min for GPS — BLE alone is spoofable), unlocks
    and holds the door for 60s. If the door opens: says ''Welcome home, Bay'' on the
    Club Sonos and hands back to the normal auto-lock (locks 30s after it closes).
    If nobody opens it within 60s: relocks.'
  triggers:
  - trigger: state
    entity_id: device_tracker.bermuda_razr_bermuda_tracker
    from: not_home
    to: home
  conditions:
  - alias: Auto-stay is off (party mode suspends this)
    condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - alias: 'Away mode was really armed (radar-confirmed empty house): still on, or
      disarmed within the last 10 min by the arrival'
    condition: template
    value_template: '{{ is_state(''input_boolean.away_mode'',''on'') or (is_state(''input_boolean.away_mode'',''off'')
      and (now() - states.input_boolean.away_mode.last_changed).total_seconds() <
      600) }}'
  - alias: Was away for at least 10 minutes
    condition: template
    value_template: '{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
      >= 600 }}'
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: locked
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  actions:
  - alias: 'Second factor: Companion GPS must agree (up to 2 min)'
    wait_template: '{{ is_state(''device_tracker.motorola_razr_50'', ''home'') }}'
    timeout: 00:02:00
    continue_on_timeout: false
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.front_door_unlock_hold
  - action: lock.unlock
    target:
      entity_id: lock.lock_pro_0fa0
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.front_door_open
      to: 'on'
    timeout: 00:01:00
    continue_on_timeout: true
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.front_door_unlock_hold
  - if:
    - condition: template
      value_template: '{{ wait.trigger is not none }}'
    then:
    - action: media_player.play_media
      target:
        entity_id: media_player.club
      data:
        media_content_type: music
        media_content_id: media-source://tts/tts.home_assistant_cloud?message=Welcome%20home%2C%20Bay.
        announce: true
        extra:
          volume: 25
    else:
    - alias: Nobody came in — relock
      if:
      - condition: state
        entity_id: lock.lock_pro_0fa0
        state: unlocked
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.front_door_open
          state: 'on'
      then:
      - action: lock.lock
        target:
          entity_id: lock.lock_pro_0fa0
  mode: single
  max_exceeded: silent
- id: '1788110000013'
  alias: Front door · re-throw bolt after inside handle
  description: The inside lever (and an outside key) retracts the bolt mechanically
    without turning the SwitchBot, so the lock keeps reporting 'locked' while the
    door is really unbolted. If the door opens while the lock says locked, wait until
    it has been closed for 30s, then cycle unlock→lock so the motor throws the bolt
    again and the state is true. Uses the tag-grace flag to silence the Sonos announcement
    and keep the normal auto-lock out of the way.
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_open
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: locked
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.front_door_open
      to: 'off'
      for: 00:00:30
    timeout: 01:00:00
    continue_on_timeout: false
  - condition: state
    entity_id: lock.lock_pro_0fa0
    state: locked
  - condition: state
    entity_id: input_boolean.front_door_keep_unlocked
    state: 'off'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.front_door_tag_grace
  - action: lock.unlock
    target:
      entity_id: lock.lock_pro_0fa0
  - wait_template: '{{ is_state(''lock.lock_pro_0fa0'', ''unlocked'') }}'
    timeout: 00:00:20
    continue_on_timeout: true
  - action: lock.lock
    target:
      entity_id: lock.lock_pro_0fa0
  - wait_template: '{{ is_state(''lock.lock_pro_0fa0'', ''locked'') }}'
    timeout: 00:00:20
    continue_on_timeout: true
  - delay: 00:00:03
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.front_door_tag_grace
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: lock.lock_pro_0fa0
        state: locked
    then:
    - action: script.turn_on
      target:
        entity_id: script.notify_bae
      data:
        variables:
          title: Front door did not re-lock
          message: Tried to re-throw the bolt after the inside handle was used, lock
            reports {{ states('lock.lock_pro_0fa0') }}.
          data:
            channel: Front door
            importance: high
            tag: front_door_rethrow_failed
            notification_icon: mdi:lock-alert
  mode: single
  max_exceeded: silent
- id: '1789500000002'
  alias: Failover · notify on switchover
  description: 'Pushes events from baelap''s failover watchdog (/srv/ha-failover)
    to the phone: failed over to the Pi400, back on the Pi5, or failover blocked.
    Lives in both instances via the nightly sync, so whichever HA is live sends it.
    Added by Claude 2026-09-23.'
  triggers:
  - trigger: mqtt
    topic: ha-failover/event
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: '{{ trigger.payload_json.title }}'
        message: '{{ trigger.payload_json.message }}'
        data:
          channel: Failover
          importance: high
          tag: ha_failover
  - action: persistent_notification.create
    data:
      title: '{{ trigger.payload_json.title }}'
      message: '{{ trigger.payload_json.message }} ({{ now().strftime(''%a %H:%M'')
        }})'
      notification_id: ha_failover_event
  mode: queued
- id: '1789500000003'
  alias: Failover · watchdog health alert
  description: 'Warns when automatic failover would not happen: baelap''s watchdog
    heartbeat has stopped, or the hold switch was left on. Added by Claude 2026-09-23.'
  triggers:
  - trigger: template
    id: stale
    value_template: '{{ states(''sensor.ha_failover_watchdog_heartbeat'') not in [''unknown'',''unavailable'']
      and (now() - (states(''sensor.ha_failover_watchdog_heartbeat'') | as_datetime)).total_seconds()
      > 600 }}'
  - trigger: state
    id: nosensor
    entity_id: sensor.ha_failover_watchdog_heartbeat
    to: unavailable
    for: 00:15:00
  - trigger: state
    id: hold
    entity_id: switch.ha_failover_hold_pause_auto_failover
    to: 'on'
    for: 04:00:00
  conditions: []
  actions:
  - variables:
      msg: '{% if trigger.id == ''hold'' %}Auto-failover has been paused (hold switch)
        for 4 hours - turn it off once maintenance is done.{% else %}baelap''s failover
        watchdog has stopped reporting - if the Pi5 fails now, the Pi400 will NOT
        take over. Check: journalctl -u ha-failover on baelap.{% endif %}'
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Auto-failover not armed
        message: '{{ msg }}'
        data:
          channel: Failover
          importance: high
          tag: ha_failover_health
  - action: persistent_notification.create
    data:
      title: Auto-failover not armed
      message: '{{ msg }}'
      notification_id: ha_failover_health
  mode: single
- id: '1790100000001'
  alias: Auto-stay · controller
  description: Party mode. The gated automations each carry an 'auto_stay is off'
    condition; this one kills their in-flight runs when it turns on, holds the departure
    board on the full board, keeps the S3 Box screen + voice on, re-arms door auto-lock
    when it turns off, and nags at 10:00 if it was left on.
  triggers:
  - trigger: state
    entity_id: input_boolean.auto_stay
    to: 'on'
    id: 'on'
  - trigger: state
    entity_id: input_boolean.auto_stay
    to: 'off'
    id: 'off'
  - trigger: state
    entity_id: input_boolean.departure_board_wake
    to: 'off'
    id: hold
  - trigger: state
    entity_id: light.esp32_s3_box_5a7e34_screen
    to: 'off'
    id: hold
  - trigger: state
    entity_id: switch.esp32_s3_box_5a7e34_mute
    to: 'on'
    id: hold
  - trigger: time_pattern
    minutes: /1
    id: hold
  - trigger: homeassistant
    event: start
    id: hold
  - trigger: time
    at: '10:00:00'
    id: reminder
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: AUTO_STAY_OFF
    id: notif_off
  conditions:
  - alias: The once-a-minute hold only matters during party mode (saves ~1,400 idle
      runs a day)
    condition: template
    value_template: '{{ trigger.id != ''hold'' or is_state(''input_boolean.auto_stay'',
      ''on'') }}'
  actions:
  - choose:
    - alias: Turned on - stop in-flight runs (pending light-off timers, lock countdowns)
      conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - repeat:
          for_each: '{{ gated | select(''is_state'',''on'') | list }}'
          sequence:
          - action: automation.turn_off
            target:
              entity_id: '{{ repeat.item }}'
            data:
              stop_actions: true
          - action: automation.turn_on
            target:
              entity_id: '{{ repeat.item }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.departure_board_wake
      - action: switch.turn_off
        target:
          entity_id: switch.esp32_s3_box_5a7e34_mute
      - action: switch.turn_on
        target:
          entity_id: switch.esp32_s3_box_5a7e34_speaker_enable
      - action: light.turn_on
        target:
          entity_id: light.esp32_s3_box_5a7e34_screen
        data:
          brightness_pct: 100
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Auto-stay on
            message: Lights, scenes, door auto-lock and door announcements are paused.
              Bathroom light and Sonos follow-me still run.
            data:
              tag: auto_stay
              channel: Auto-stay
              importance: low
              notification_icon: mdi:party-popper
              actions:
              - action: AUTO_STAY_OFF
                title: Turn off auto-stay
    - alias: Hold departure board + S3 Box while on
      conditions:
      - condition: trigger
        id: hold
      - condition: state
        entity_id: input_boolean.auto_stay
        state: 'on'
      sequence:
      - alias: Board wake expires 10 min after last_changed (Pi flips it off) - re-pulse
          before then
        if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.departure_board_wake'',''off'')
            or (now() - states.input_boolean.departure_board_wake.last_changed).total_seconds()
            > 420 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.departure_board_wake
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.departure_board_wake
      - if:
        - condition: state
          entity_id: light.esp32_s3_box_5a7e34_screen
          state: 'off'
        then:
        - action: light.turn_on
          target:
            entity_id: light.esp32_s3_box_5a7e34_screen
          data:
            brightness_pct: 100
      - if:
        - condition: state
          entity_id: switch.esp32_s3_box_5a7e34_mute
          state: 'on'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.esp32_s3_box_5a7e34_mute
    - alias: Turned off - hand back to normal
      conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: auto_stay
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.departure_board_wake
      - alias: Door left unlocked during the party - let the normal auto-lock (30
          s once closed) take over
        if:
        - condition: state
          entity_id: lock.lock_pro_0fa0
          state: unlocked
        then:
        - action: automation.trigger
          target:
            entity_id: automation.front_door_auto_lock
          data:
            skip_condition: false
    - alias: Left on in the morning - nudge
      conditions:
      - condition: trigger
        id: reminder
      - condition: state
        entity_id: input_boolean.auto_stay
        state: 'on'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Auto-stay is still on
            message: Door auto-lock and presence lights are still paused since {{
              as_local(states.input_boolean.auto_stay.last_changed).strftime('%-I:%M
              %p %a') }}.
            data:
              tag: auto_stay
              channel: Auto-stay
              importance: default
              notification_icon: mdi:party-popper
              actions:
              - action: AUTO_STAY_OFF
                title: Turn off auto-stay
    - conditions:
      - condition: trigger
        id: notif_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.auto_stay
  mode: queued
  max: 25
  variables:
    gated:
    - automation.art_on_door_open
    - automation.bae_leaves_home_away_mode
    - automation.rmm_ambient_day_lights
    - automation.rmm_away_mode_arm
    - automation.rmm_bedroom_presence_light
    - automation.rmm_console_candles
    - automation.rmm_couch_light
    - automation.rmm_fell_asleep_all_lights_off
    - automation.rmm_kitchen_presence_light
    - automation.rmm_night_path_to_bathroom
    - automation.rmm_office_presence_light
    - automation.rmm_wardrobe_presence_light
    - automation.rmm_weekday_morning_routine
    - automation.rmm_weekday_scene_schedule
    - automation.rmm_zone_empty_sweep
    - automation.rmm_morning_calendar_briefing
    - automation.front_door_10_minute_backstop_and_3_hourly_sweep
    - automation.front_door_auto_lock
    - automation.front_door_ble_arrival_unlock_welcome
    - automation.front_door_lock_when_i_leave
    - automation.front_door_sonos_announcement
- id: ma_club_hue_light_sync
  alias: Club Lights follow Club
  description: When the Club Sonos plays from Music Assistant and Club Lights is on,
    join the Club Lights beat-sync player to it. Only works
    for MA-played music, not Spotify/TV played natively on the Sonos.
  triggers:
  - trigger: state
    entity_id: media_player.club_2
    to: playing
    for:
      seconds: 2
  - trigger: state
    entity_id: input_boolean.club_lights
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.club_lights
    state: 'on'
  - condition: state
    entity_id: media_player.club_2
    state: playing
  - condition: template
    value_template: '{{ state_attr("media_player.club_2","app_id") == "music_assistant"
      and "media_player.club_lights" not in (state_attr("media_player.club_2","group_members")
      or []) }}'
  actions:
  - action: media_player.join
    target:
      entity_id: media_player.club_2
    data:
      group_members:
      - media_player.club_lights
  mode: single
- id: '1789700000001'
  alias: 'RMM: Sonos morning volume reset'
  description: Once each morning, cap the non-Club Sonos rooms at 20 (never raises
    a quieter room). This is the ONLY automated volume change for these rooms - the
    rest of the day they keep whatever you set. Retries a speaker that comes back
    online before 06:00 (bathroom Sonos flakes). Created by Claude 2026-09-26.
  triggers:
  - trigger: time
    at: 04:00:00
    id: daily
  - trigger: state
    entity_id: media_player.bedroom_sonos
    from: unavailable
    id: back
  - trigger: state
    entity_id: media_player.office_sonos
    from: unavailable
    id: back
  - trigger: state
    entity_id: media_player.bathroom_sonos
    from: unavailable
    id: back
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: daily
    - condition: time
      after: 04:00:00
      before: 06:00:00
  actions:
  - variables:
      cap: 0.2
      targets: '{{ ["media_player.bedroom_sonos", "media_player.office_sonos", "media_player.bathroom_sonos"]
        if trigger.id == ''daily'' else [trigger.entity_id] }}'
  - repeat:
      for_each: '{{ targets }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(repeat.item) not in [''unavailable'',''unknown'']
            and (state_attr(repeat.item,''volume_level'') | float(1)) > cap }}'
        then:
        - action: media_player.volume_set
          target:
            entity_id: '{{ repeat.item }}'
          data:
            volume_level: '{{ cap }}'
          continue_on_error: true
  mode: queued
  max: 10
- id: '1790500000001'
  alias: Roborock · alerts
  description: Push to the Razr when the robot or dock has an error, a tank needs
    attention, or a consumable is due. Consumable pushes carry a 'Done' button that
    resets the counter (handled by Roborock · notification actions).
  triggers:
  - trigger: state
    entity_id: sensor.roborock_qrevo_master_vacuum_error
    not_to:
    - none
    - unavailable
    - unknown
    for: 00:00:30
    id: error
  - trigger: state
    entity_id: sensor.roborock_qrevo_master_dock_dock_error
    not_to:
    - ok
    - unavailable
    - unknown
    for: 00:00:30
    id: dock_error
  - trigger: state
    entity_id: binary_sensor.roborock_qrevo_master_water_shortage
    to: 'on'
    for: 00:01:00
    id: water_shortage
  - trigger: state
    entity_id: binary_sensor.roborock_qrevo_master_dock_clean_water_box
    to: 'on'
    for: 00:01:00
    id: clean_water
  - trigger: state
    entity_id: binary_sensor.roborock_qrevo_master_dock_dirty_water_box
    to: 'on'
    for: 00:01:00
    id: dirty_water
  - trigger: numeric_state
    entity_id: sensor.roborock_qrevo_master_main_brush_time_left
    below: 1
    id: main_brush
  - trigger: numeric_state
    entity_id: sensor.roborock_qrevo_master_side_brush_time_left
    below: 1
    id: side_brush
  - trigger: numeric_state
    entity_id: sensor.roborock_qrevo_master_filter_time_left
    below: 1
    id: filter
  - trigger: numeric_state
    entity_id: sensor.roborock_qrevo_master_sensor_time_left
    below: 1
    id: sensor
  - trigger: numeric_state
    entity_id: sensor.roborock_qrevo_master_dock_strainer_time_left
    below: 1
    id: strainer
  conditions: []
  actions:
  - variables:
      titles:
        error: Roborock needs help
        dock_error: Roborock dock problem
        water_shortage: Roborock is out of water
        clean_water: Refill the Roborock
        dirty_water: Empty the Roborock
        main_brush: 'Roborock maintenance: Main brush'
        side_brush: 'Roborock maintenance: Side brush'
        filter: 'Roborock maintenance: Filter'
        sensor: 'Roborock maintenance: Sensors'
        strainer: 'Roborock maintenance: Dock strainer'
      resettable:
      - main_brush
      - side_brush
      - filter
      - sensor
      - strainer
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: '{{ titles[trigger.id] }}'
        message: '{% if trigger.id == ''error'' %}{{ states(''sensor.roborock_qrevo_master_vacuum_error'')
          | replace(''_'','' '') | capitalize }} — stopped in the {{ states(''sensor.roborock_qrevo_master_current_room'')
          }}.{% elif trigger.id == ''dock_error'' %}Dock reports: {{ states(''sensor.roborock_qrevo_master_dock_dock_error'')
          | replace(''_'','' '') }}.{% elif trigger.id == ''water_shortage'' %}The
          robot''s water is low — check the dock''s clean-water tank.{% elif trigger.id
          == ''clean_water'' %}The dock''s clean-water tank is empty.{% elif trigger.id
          == ''dirty_water'' %}The dock''s dirty-water tank is full.{% elif trigger.id
          == ''main_brush'' %}Clean or replace the main brush. Tap Done once it''s
          sorted to reset the counter.{% elif trigger.id == ''side_brush'' %}Replace
          the side brush. Tap Done once it''s sorted to reset the counter.{% elif
          trigger.id == ''filter'' %}Replace the dust filter. Tap Done once it''s
          sorted to reset the counter.{% elif trigger.id == ''sensor'' %}Wipe the
          robot''s sensors (cliff sensors, LiDAR cover, camera). Tap Done once it''s
          sorted to reset the counter.{% elif trigger.id == ''strainer'' %}Clean the
          dock''s strainer/filter under the water tanks. Tap Done once it''s sorted
          to reset the counter.{% endif %}'
        data:
          tag: roborock_{{ trigger.id }}
          group: roborock
          channel: Roborock
          actions: '{% if trigger.id in resettable %}{{ [{''action'':''RR_RESET_''
            ~ trigger.id|upper,''title'':''Done – reset''}] }}{% elif trigger.id ==
            ''error'' %}{{ [{''action'':''RR_HOME'',''title'':''Send to dock''}] }}{%
            else %}{{ [] }}{% endif %}'
  mode: queued
  max: 10
- id: '1790500000002'
  alias: Roborock · notification actions
  description: 'Handles the buttons on Roborock pushes: reset a consumable counter,
    or send the robot back to the dock.'
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action is string and trigger.event.data.action.startswith(''RR_'')
      }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_RESET_MAIN_BRUSH'' }}'
      sequence:
      - action: button.press
        target:
          entity_id: button.roborock_qrevo_master_reset_main_brush_consumable
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: roborock_main_brush
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_RESET_SIDE_BRUSH'' }}'
      sequence:
      - action: button.press
        target:
          entity_id: button.roborock_qrevo_master_reset_side_brush_consumable
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: roborock_side_brush
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_RESET_FILTER'' }}'
      sequence:
      - action: button.press
        target:
          entity_id: button.roborock_qrevo_master_reset_air_filter_consumable
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: roborock_filter
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_RESET_SENSOR'' }}'
      sequence:
      - action: button.press
        target:
          entity_id: button.roborock_qrevo_master_reset_sensor_consumable
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: roborock_sensor
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_RESET_STRAINER'' }}'
      sequence:
      - action: button.press
        target:
          entity_id: button.roborock_qrevo_master_dock_reset_strainer_consumable
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: roborock_strainer
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_HOME'' }}'
      sequence:
      - action: vacuum.return_to_base
        target:
          entity_id: vacuum.roborock_qrevo_master
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RR_SL68_HOME'' }}'
      sequence:
      - action: vacuum.return_to_base
        target:
          entity_id: vacuum.sl68
  mode: queued
- id: '1790500000003'
  alias: Roborock · clean while away
  description: Once away mode has been on 10 min (08:00–20:00, nothing cleaned in
    the last 12 h), start a full clean. The radars see the robot as a person, so the
    radar-driven presence/sleep/guest/ghost automations are paused for the run and
    resumed when it docks or when you get home (also on HA start, as a safety net).
    Intruder + welcome-home ignore radar while binary_sensor.roborock_active is on.
    If the Roborock finishes cleanly while you're still out, script.sl68_followup_clean
    runs the SL68 (smart clean, then a second one if the first went fine) before the
    radar automations are resumed. Skipped if the robots were sent home because I'm
    nearly home (input_boolean.robots_sent_home).
  triggers:
  - trigger: state
    entity_id: input_boolean.away_mode
    to: 'on'
    for: 00:10:00
    id: away
  - trigger: state
    entity_id: vacuum.roborock_qrevo_master
    to: docked
    for: 00:02:00
    id: docked
  - trigger: state
    entity_id: input_boolean.away_mode
    to: 'off'
    id: home
  - trigger: homeassistant
    event: start
    id: start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: away
      - condition: state
        entity_id: input_boolean.auto_stay
        state: 'off'
      - condition: state
        entity_id: vacuum.roborock_qrevo_master
        state: docked
      - condition: time
        after: 08:00:00
        before: '20:00:00'
      - condition: template
        value_template: '{% set b = states(''sensor.roborock_qrevo_master_last_clean_begin'')
          | as_datetime(none) %}{{ b is none or (now() - b).total_seconds() > 12*3600
          }}'
      - condition: numeric_state
        entity_id: sensor.roborock_qrevo_master_battery
        above: 60
      sequence:
      - action: automation.turn_off
        target:
          entity_id:
          - automation.rmm_kitchen_presence_light
          - automation.rmm_office_presence_light
          - automation.rmm_wardrobe_presence_light
          - automation.rmm_bedroom_presence_light
          - automation.rmm_bathroom_light_with_shower_hold
          - automation.rmm_couch_light
          - automation.rmm_console_candles
          - automation.rmm_night_path_to_bathroom
          - automation.rmm_fell_asleep_all_lights_off
          - automation.rmm_sonos_follows_you
          - automation.rmm_guest_mode_auto
          - automation.rmm_fall_alert
          - automation.rmm_ambient_day_lights
          - automation.rmm_ld2450_ghost_auto_recover
        data:
          stop_actions: true
      - action: vacuum.start
        target:
          entity_id: vacuum.roborock_qrevo_master
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Roborock
            message: You're out — started a clean. Room lights won't react to it.
            data:
              tag: roborock_away
              group: roborock
              channel: Roborock
              actions:
              - action: RR_HOME
                title: Stop & dock
    - conditions:
      - condition: trigger
        id: docked
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'on'
      - condition: template
        value_template: '{{ is_state(''automation.rmm_kitchen_presence_light'',''off'')
          }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Roborock finished
            message: Cleaned {{ states('sensor.roborock_qrevo_master_cleaning_area')
              }} m² in {{ states('sensor.roborock_qrevo_master_cleaning_time') | int(0)
              }} min.
            data:
              tag: roborock_away
              group: roborock
              channel: Roborock
      - if:
        - alias: Roborock finished cleanly, the SL68 is docked, problem-free and charged,
            and I'm not on my way home
          condition: template
          value_template: "{{ is_state('sensor.roborock_qrevo_master_vacuum_error',
            'none')\n   and is_state('sensor.roborock_qrevo_master_dock_dock_error',
            'ok')\n   and states('sensor.roborock_qrevo_master_cleaning_area') | float(0)
            > 1\n   and is_state('vacuum.sl68', 'docked')\n   and is_state('binary_sensor.sl68_problem',
            'off')\n   and states('sensor.sl68_battery') | int(0) >= 50\n   and is_state('input_boolean.robots_sent_home',
            'off') }}"
        then:
        - alias: SL68 follow-up smart cleans (that script resumes the radar automations
            when done)
          action: script.turn_on
          target:
            entity_id: script.sl68_followup_clean
        else:
        - action: script.radar_presence_resume
    - conditions:
      - condition: trigger
        id:
        - home
        - start
      sequence:
      - action: automation.turn_on
        target:
          entity_id:
          - automation.rmm_kitchen_presence_light
          - automation.rmm_office_presence_light
          - automation.rmm_wardrobe_presence_light
          - automation.rmm_bedroom_presence_light
          - automation.rmm_bathroom_light_with_shower_hold
          - automation.rmm_couch_light
          - automation.rmm_console_candles
          - automation.rmm_night_path_to_bathroom
          - automation.rmm_fell_asleep_all_lights_off
          - automation.rmm_sonos_follows_you
          - automation.rmm_guest_mode_auto
          - automation.rmm_fall_alert
          - automation.rmm_ambient_day_lights
          - automation.rmm_ld2450_ghost_auto_recover
      - if:
        - condition: trigger
          id: home
        - condition: state
          entity_id: vacuum.roborock_qrevo_master
          state:
          - cleaning
          - paused
          - returning
        then:
        - action: script.turn_on
          target:
            entity_id: script.notify_bae
          data:
            variables:
              title: Roborock is still cleaning
              message: Welcome home — it's in the {{ states('sensor.roborock_qrevo_master_current_room')
                }}.
              data:
                tag: roborock_away
                group: roborock
                channel: Roborock
                actions:
                - action: RR_HOME
                  title: Send to dock
  mode: queued
- id: '1791000000001'
  alias: Robots · dock when I'm nearly home
  description: 'While away mode is on and I''m within 1 km of home and heading towards
    it (Proximity: sensor.home_bae_distance / direction_of_travel), send whichever
    robot is out back to its dock and stop the SL68 follow-up/backup cleans. Sets
    input_boolean.robots_sent_home so the SL68 doesn''t start after the Roborock docks
    (clears whenever away mode changes). Added by Claude 2026-10-06.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.home_bae_distance
    below: 1000
    id: near
  - trigger: state
    entity_id: sensor.home_bae_direction_of_travel
    to: towards
    id: near
  - trigger: state
    entity_id: input_boolean.away_mode
    id: reset
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: reset
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.robots_sent_home
    - conditions:
      - condition: trigger
        id: near
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'on'
      - condition: state
        entity_id: input_boolean.robots_sent_home
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.home_bae_distance
        below: 1000
      - condition: state
        entity_id: sensor.home_bae_direction_of_travel
        state: towards
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.robots_sent_home
      - alias: Stop the SL68 follow-up/backup chain so it does not start another run
        action: script.turn_off
        target:
          entity_id:
          - script.sl68_followup_clean
          - script.sl68_smart_clean_once
      - variables:
          out: '{{ [''vacuum.roborock_qrevo_master'', ''vacuum.sl68''] | select(''is_state'',
            [''cleaning'', ''paused'', ''returning'']) | list }}'
      - if:
        - condition: template
          value_template: '{{ out | count > 0 }}'
        then:
        - action: vacuum.return_to_base
          target:
            entity_id: '{{ out }}'
        - action: script.turn_on
          target:
            entity_id: script.notify_bae
          data:
            variables:
              title: Robots heading home
              message: Looks like you're nearly home, so {{ out | map('state_attr',
                'friendly_name') | join(' and ') }} {{ 'is' if out | count == 1 else
                'are' }} going back to the dock.
              data:
                tag: roborock_away
                group: roborock
                channel: Roborock
  mode: queued
  max: 5
- id: '1791000000002'
  alias: SL68 · backup when the Roborock gets stuck
  description: If the Roborock stops with an error for 3 minutes in the middle of
    an away-mode clean (stuck, trapped, shut in a room, can't get back to the dock),
    send the SL68 out for one smart clean as a backup and tell me how it went. The
    radar automations stay paused until I get home, because the stuck Roborock is
    still out. Added by Claude 2026-10-06.
  triggers:
  - trigger: state
    entity_id: vacuum.roborock_qrevo_master
    to: error
    for: 00:03:00
  - trigger: state
    entity_id: sensor.roborock_qrevo_master_vacuum_error
    to:
    - lidar_blocked
    - bumper_stuck
    - wheels_suspended
    - cliff_sensor_error
    - main_brush_jammed
    - side_brush_jammed
    - wheels_jammed
    - robot_trapped
    - robot_tilted
    - side_brush_error
    - fan_error
    - vertical_bumper_pressed
    - dock_locator_error
    - return_to_dock_fail
    - nogo_zone_detected
    - vibrarise_jammed
    - robot_on_carpet
    - invisible_wall_detected
    - cannot_cross_carpet
    - compass_error
    - optical_flow_sensor_dirt
    - wall_sensor_dirty
    - filter_blocked
    - no_dustbin
    - internal_error
    for: 00:03:00
  conditions:
  - alias: Stopped away from the dock
    condition: state
    entity_id: vacuum.roborock_qrevo_master
    state:
    - error
    - idle
    - paused
  - condition: state
    entity_id: input_boolean.away_mode
    state: 'on'
  - condition: state
    entity_id: input_boolean.auto_stay
    state: 'off'
  - condition: state
    entity_id: input_boolean.robots_sent_home
    state: 'off'
  - alias: An away-mode clean is running (Roborock · clean while away paused the radar
      automations)
    condition: state
    entity_id: automation.rmm_kitchen_presence_light
    state: 'off'
  - condition: state
    entity_id:
    - script.sl68_followup_clean
    - script.sl68_smart_clean_once
    state: 'off'
  actions:
  - variables:
      err: '{{ states(''sensor.roborock_qrevo_master_vacuum_error'') | replace(''_'',
        '' '') }}'
      room: '{{ states(''sensor.roborock_qrevo_master_current_room'') }}'
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: Roborock is stuck
        message: It reports {{ err }}{{ ' in the ' ~ room if room not in ['unknown',
          'unavailable', ''] else '' }}, so the SL68 is going out as a backup.
        data:
          tag: roborock_stuck
          group: roborock
          channel: Roborock
  - action: script.sl68_smart_clean_once
    data:
      go: true
    response_variable: sl68
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: SL68 backup clean
        message: '{% if sl68.ok %}Done: {{ sl68.area }} m² in {{ sl68.minutes }} min.
          The Roborock still needs rescuing.{% else %}It didn''t finish: {{ sl68.reason
          }}.{% endif %}'
        data:
          tag: roborock_stuck
          group: roborock
          channel: Roborock
  mode: single
  max_exceeded: silent
- id: '1790500000004'
  alias: Washer · done
  description: Washer finished → Washer done flag on (shows on the remotes), push
    with an Emptied button, Sonos announce if you're home and it isn't night / party
    mode. One reminder after 45 min. Flag clears on Emptied, on the remote popup,
    or when the next wash starts.
  triggers:
  - trigger: state
    entity_id: sensor.washer_job_state
    to: finish
    id: done
  - trigger: state
    entity_id: input_boolean.washer_done
    to: 'on'
    for: 00:45:00
    id: remind
  - trigger: state
    entity_id: sensor.washer_machine_state
    to: run
    id: start
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: WASHER_EMPTIED
    id: emptied
  - trigger: state
    entity_id: input_boolean.washer_done
    to: 'off'
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: done
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.washer_done
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Washing's done
            message: Finished at {{ now().strftime('%-I:%M %p') }}.
            data:
              tag: washer
              channel: Washer
              actions:
              - action: WASHER_EMPTIED
                title: Emptied
      - if:
        - condition: state
          entity_id: binary_sensor.bae_home
          state: 'on'
        - condition: state
          entity_id: input_boolean.auto_stay
          state: 'off'
        - condition: template
          value_template: '{% set d = now().weekday() %}{% set t = now().hour*60 +
            now().minute %}{{ not ((d in [6,0,1,2,3] and t >= 21*60) or (d in [0,1,2,3,4]
            and t < 7*60) or (d in [4,5] and t >= 23*60) or (d in [5,6] and t < 9*60))
            }}'
        then:
        - action: media_player.play_media
          target:
            entity_id:
            - media_player.club
            - media_player.bedroom_sonos
            - media_player.bathroom_sonos
          data:
            media_content_type: music
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=The%20washing%20is%20done
            announce: true
            extra:
              volume: 15
          continue_on_error: true
    - conditions:
      - condition: trigger
        id: remind
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: Washing's still in the machine
            message: Done {{ relative_time(states.input_boolean.washer_done.last_changed)
              }} ago.
            data:
              tag: washer
              channel: Washer
              actions:
              - action: WASHER_EMPTIED
                title: Emptied
      - if:
        - condition: state
          entity_id: binary_sensor.bae_home
          state: 'on'
        - condition: state
          entity_id: input_boolean.auto_stay
          state: 'off'
        - condition: template
          value_template: '{% set d = now().weekday() %}{% set t = now().hour*60 +
            now().minute %}{{ not ((d in [6,0,1,2,3] and t >= 21*60) or (d in [0,1,2,3,4]
            and t < 7*60) or (d in [4,5] and t >= 23*60) or (d in [5,6] and t < 9*60))
            }}'
        then:
        - action: media_player.play_media
          target:
            entity_id:
            - media_player.club
            - media_player.bedroom_sonos
            - media_player.bathroom_sonos
          data:
            media_content_type: music
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Reminder,%20the%20washing%20is%20still%20in%20the%20machine
            announce: true
            extra:
              volume: 15
          continue_on_error: true
    - conditions:
      - condition: trigger
        id:
        - start
        - emptied
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.washer_done
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            message: clear_notification
            data:
              tag: washer
  mode: queued
- id: '1790500000005'
  alias: Attic camera · alert while away
  description: Nest attic camera motion/person/sound while away → Gemini describes
    the event clip (best effort) and a push with the event thumbnail. Silent when
    the camera is unplugged (no events). 2-min cooldown.
  triggers:
  - trigger: state
    entity_id: event.attic_attic_camera_motion
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.away_mode
      state: 'on'
    - condition: not
      conditions:
      - condition: state
        entity_id: person.bae
        state: home
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 120 }}'
  actions:
  - variables:
      kind: '{{ trigger.to_state.attributes.event_type | default(''camera_motion'')
        }}'
      eid: '{{ trigger.to_state.attributes.nest_event_id }}'
      dev: '{{ device_id(''camera.attic_attic_camera'') }}'
  - variables:
      label: '{{ {''camera_person'':''Person'',''camera_sound'':''Sound'',''camera_motion'':''Motion''}.get(kind,''Motion'')
        }}'
  - action: ai_task.generate_data
    data:
      task_name: attic camera
      entity_id: ai_task.google_ai_task
      instructions: This is a home security camera event. In one short sentence (max
        20 words), say what is happening. Mention any people or animals; say 'nothing
        notable' if there is nothing.
      attachments:
      - media_content_id: media-source://nest/{{ dev }}/{{ eid }}
        media_content_type: video/mp4
    response_variable: ai
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: 'Attic camera: {{ label }}'
        message: '{{ ai.data if (ai is defined and ai.data is defined and ai.data)
          else label ~ '' detected at '' ~ now().strftime(''%-I:%M %p'') ~ ''.'' }}'
        data:
          image: /api/nest/event_media/{{ dev }}/{{ eid }}/thumbnail
          tag: attic_cam
          group: camera
          channel: Camera
          clickAction: entityId:camera.attic_attic_camera
          priority: high
          ttl: 0
  mode: single
- id: '1790500000006'
  alias: Intruder flag · clear
  description: Clears input_boolean.intruder_alert_active (the remotes' red popup)
    when away mode ends or after 2 h.
  triggers:
  - trigger: state
    entity_id: input_boolean.away_mode
    to: 'off'
  - trigger: state
    entity_id: input_boolean.intruder_alert_active
    to: 'on'
    for: 02:00:00
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.intruder_alert_active
  mode: single
- id: '1790500000007'
  alias: BOM · weather warning push
  description: Pushes each NEW Bureau of Meteorology warning for my suburb (new
    / upgraded / renewed; cancellations and repeats are ignored). Major warnings go
    out high-priority.
  triggers:
  - trigger: state
    entity_id: sensor.bom_local_warnings
    attribute: warnings
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none }}'
  actions:
  - variables:
      old_ids: '{{ (trigger.from_state.attributes.warnings or []) | map(attribute=''id'')
        | list }}'
      fresh: '{{ (trigger.to_state.attributes.warnings or []) | rejectattr(''id'',''in'',old_ids)
        | rejectattr(''phase'',''in'',[''cancelled'',''final'']) | list }}'
  - repeat:
      for_each: '{{ fresh }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.notify_bae
        data:
          variables:
            title: 'BOM: {{ repeat.item.short_title | default(repeat.item.title) }}'
            message: '{{ repeat.item.title }}{% if repeat.item.expiry_time is defined
              %} — until {{ as_timestamp(repeat.item.expiry_time) | timestamp_custom(''%a
              %-I:%M %p'') }}{% endif %}'
            data:
              tag: bom_{{ repeat.item.id }}
              group: bom
              channel: Weather warnings
              clickAction: https://www.bom.gov.au/vic/warnings/
              priority: '{{ ''high'' if repeat.item.warning_group_type == ''major''
                else ''normal'' }}'
  mode: queued
- id: astrion_club_sonos_follows_tv
  alias: Club · Sonos plays the TV when the TV is playing
  description: Created for the Astrion remotes (D1). Only when the Sonos can actually
    hear the TV over HDMI, so unplugging the Sonos HDMI keeps the music. Hold SCENE
    stays as the manual way.
  triggers:
  - trigger: state
    entity_id:
    - media_player.the_club_tv
    - media_player.club_android_tv_10_0_0_248_club_tv
    to: playing
    for:
      seconds: 5
  - trigger: state
    entity_id: sensor.club_audio_input_format
  conditions:
  - alias: Something is playing on the TV
    condition: template
    value_template: '{{ is_state(''media_player.the_club_tv'',''playing'') or is_state(''media_player.club_android_tv_10_0_0_248_club_tv'',''playing'')
      }}'
  - alias: The Sonos can hear the TV (HDMI connected, audio present)
    condition: template
    value_template: '{{ (states(''sensor.club_audio_input_format'') | lower) not in
      [''no input'',''no input connected'',''no audio'',''pcm 2.0 no audio'',''unavailable'',''unknown'','''']
      and ''no audio'' not in (states(''sensor.club_audio_input_format'') | lower)
      }}'
  - alias: Not already on the TV
    condition: template
    value_template: '{{ state_attr(''media_player.club'',''source'') != ''TV'' }}'
  actions:
  - action: media_player.select_source
    target:
      entity_id: media_player.club
    data:
      source: TV
  - variables:
      others: '{{ (state_attr(''media_player.club'',''group_members'') or []) | reject(''eq'',''media_player.club'')
        | list }}'
  - if:
    - condition: template
      value_template: '{{ others | count > 0 }}'
    then:
    - action: media_player.unjoin
      target:
        entity_id: '{{ others }}'
  mode: single
- id: astrion_remote_battery_alerts
  alias: Astrion remotes · battery alerts
  description: Created for the Astrion remotes (E3). Phone notification when a remote
    is on its dock but not charging (or losing charge), or off the dock and low.
  triggers:
  - trigger: template
    id: dock_fault
    value_template: '{{ state_attr(''sensor.club_remote_113_battery'',''dock_fault'')
      == true }}'
    for:
      minutes: 3
    variables:
      remote: sensor.club_remote_113_battery
  - trigger: template
    id: dock_fault
    value_template: '{{ state_attr(''sensor.club_remote_141_battery'',''dock_fault'')
      == true }}'
    for:
      minutes: 3
    variables:
      remote: sensor.club_remote_141_battery
  - trigger: numeric_state
    id: low
    entity_id:
    - sensor.club_remote_113_battery
    - sensor.club_remote_141_battery
    below: 20
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''dock_fault'' or state_attr(trigger.entity_id,''docked'')
      != true }}'
  actions:
  - variables:
      who: '{{ remote if trigger.id == ''dock_fault'' else trigger.entity_id }}'
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: '{{ state_attr(who,''friendly_name'') or who }}'
        message: '{% if trigger.id == ''dock_fault'' %}On its dock but not charging
          ({{ states(who) }}%). Reseat it or clean the contacts.{% else %}Off the
          dock at {{ states(who) }}%. Pop it on the dock.{% endif %}'
  mode: parallel
- id: astrion_voice_shortcuts
  alias: Astrion · voice shortcuts
  description: Created for the Astrion remotes (D14). Handled locally by HA (the Piks
    pipeline prefers local intents), so these skip Gemini.
  triggers:
  - trigger: conversation
    command:
    - tv mode
    - watch tv
    - tv sound
    - tv audio
    - '[put the ]sonos on [the ]tv'
    - sonos to [the ]tv
    id: tv
  - trigger: conversation
    command:
    - goodnight
    - good night
    - everything off
    - all [the ]lights off
    - turn off all [the ]lights
    id: goodnight
  - trigger: conversation
    command:
    - night mode
    - night lights
    - night scene
    id: night
  - trigger: conversation
    command:
    - day mode
    - day lights
    - day scene
    id: day
  - trigger: conversation
    command:
    - blinds
    - '[toggle ][the ]blinds'
    - all [the ]blinds
    id: blinds
  - trigger: conversation
    command:
    - blinds half
    - half [the ]blinds
    - sheer[s] half
    - half [the ]sheer[s]
    id: blinds_half
  - trigger: conversation
    command:
    - dim [the ]lights
    - dim [the ]club
    - lights down
    id: dim
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: tv
      sequence:
      - action: media_player.select_source
        target:
          entity_id: media_player.club
        data:
          source: TV
      - variables:
          others: '{{ (state_attr(''media_player.club'',''group_members'') or [])
            | reject(''eq'',''media_player.club'') | list }}'
      - if:
        - condition: template
          value_template: '{{ others | count > 0 }}'
        then:
        - action: media_player.unjoin
          target:
            entity_id: '{{ others }}'
      - set_conversation_response: TV sound on the Sonos.
    - conditions:
      - condition: trigger
        id: goodnight
      sequence:
      - action: script.long_lights
      - set_conversation_response: Goodnight. Lights off.
    - conditions:
      - condition: trigger
        id: night
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.night
      - set_conversation_response: Night lights.
    - conditions:
      - condition: trigger
        id: day
      sequence:
      - action: script.day
      - set_conversation_response: Day lights.
    - conditions:
      - condition: trigger
        id: blinds
      sequence:
      - action: script.club_blinds_all
      - set_conversation_response: Blinds.
    - conditions:
      - condition: trigger
        id: blinds_half
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.club_sheer_blinds
        data:
          position: 50
      - set_conversation_response: Sheers to half.
    - conditions:
      - condition: trigger
        id: dim
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ area_entities(''club'') | select(''match'',''light\\.'')
            | select(''is_state'',''on'') | list }}'
        data:
          brightness_pct: 30
          transition: 2
      - set_conversation_response: Dimmed.
  mode: parallel
- id: astrion_club_tv_stop_paused_plex
  alias: Club TV · stop a Plex session left paused
  description: Created for the Astrion remotes (E2). A paused Plex session on the
    Club TV's Cast reports its playhead about 4 times a second, all day. Stopping
    it after 5 minutes paused ends that; Plex keeps the resume point.
  triggers:
  - trigger: state
    entity_id: media_player.the_club_tv
    to: paused
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: '{{ state_attr(''media_player.the_club_tv'',''app_name'') == ''Plex''
      }}'
  actions:
  - action: media_player.media_stop
    target:
      entity_id: media_player.the_club_tv
  mode: single
- id: astrion_sonos_reconnect
  alias: Sonos · reconnect a speaker HA lost
  description: Created for the Astrion remotes. HA's Sonos integration sometimes marks
    a speaker unavailable after a network blip (or an IP change) and never retries,
    e.g. the bathroom Play after the 2026-10-04 router restart. If a Sonos speaker
    stays unavailable for 10 minutes, reload the Sonos integration (at most once an
    hour). Playback isn't interrupted; HA just re-discovers the speakers.
  triggers:
  - trigger: state
    entity_id:
    - media_player.bathroom_sonos
    - media_player.bedroom_sonos
    - media_player.office_sonos
    - media_player.club
    to: unavailable
    for:
      minutes: 10
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 3600 }}'
  actions:
  - action: logbook.log
    data:
      name: Sonos
      message: '{{ state_attr(trigger.entity_id,''friendly_name'') }} unavailable
        10 min - reloading the Sonos integration'
      entity_id: '{{ trigger.entity_id }}'
  - action: homeassistant.reload_config_entry
    target:
      entity_id: '{{ trigger.entity_id }}'
  mode: single
- id: system_pi5_health_alert
  alias: System · Pi5 health alert
  description: Push alert when the HA Pi5 runs hot, its data disk fills up, or memory
    runs out (System Monitor sensors, added 2026-10-05). numeric_state only fires
    on crossing the threshold, so a sustained problem alerts once.
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.system_monitor_processor_temperature
    above: 80
    for: 00:10:00
    id: temp
  - trigger: numeric_state
    entity_id: sensor.system_monitor_disk_usage_config
    above: 85
    for: 00:10:00
    id: disk
  - trigger: numeric_state
    entity_id: sensor.system_monitor_memory_usage
    above: 90
    for: 00:15:00
    id: memory
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.notify_bae
    data:
      variables:
        title: HA Pi5 needs attention
        message: "{{ {'temp': 'CPU has been above 80 °C for 10 min (now ' ~ states('sensor.system_monitor_processor_temperature')
          ~ ' °C).',\n    'disk': 'Data disk is ' ~ states('sensor.system_monitor_disk_usage_config')
          ~ '% full (' ~ states('sensor.system_monitor_disk_free_config') ~ ' GiB
          free).',\n    'memory': 'Memory has been above 90% for 15 min (now ' ~ states('sensor.system_monitor_memory_usage')
          ~ '%).'}[trigger.id] }}"
        data:
          tag: pi5_health_{{ trigger.id }}
          channel: System
- id: astrion_rmm_reload_after_start
  alias: RMM · reload automations once RMM is up after a restart
  description: Created 2026-10-05. Radar Map Manager creates sensor.rmm_default_master
    after automations load, so after an HA restart the numeric_state triggers on it
    fail to initialise (Intruder alert, Away mode arm / welcome home, Guest mode auto,
    LD2412 study) and stay dead until automations are reloaded. This waits for the
    sensor, then reloads once.
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - wait_template: '{{ states(''sensor.rmm_default_master'') not in [''unknown'',''unavailable'']
      }}'
    timeout: 00:10:00
    continue_on_timeout: true
  - delay:
      seconds: 20
  - action: automation.reload
  mode: single
