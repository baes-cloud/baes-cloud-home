  - delay:
      milliseconds: 1500
  - action: remote.send_command
    target:
      entity_id: remote.the_serif_qa55ls01dawxxy
    data:
      command: KEY_ENTER
  - delay:
      milliseconds: 2000
  - action: remote.send_command
    target:
      entity_id: remote.the_serif_qa55ls01dawxxy
    data:
