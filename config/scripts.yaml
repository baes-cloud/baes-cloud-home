tv_remote_guide_show:
  alias: TV remote guide · show
  description: Puts the full-screen remote guide on the Serif (baehp HDMI2 kiosk,
    Bæovision /guide). Remembers what the TV was doing so script.tv_remote_guide_hide
    can put it back. Called by the Astrion remotes when their guide opens (hold Menu).
    The Samsung's reported input can go stale (SmartThings), so 'was the Google TV
    in use' comes from the Streamer's own state.
  icon: mdi:remote-tv
  mode: single
  sequence:
  - condition: state
    entity_id: input_boolean.tv_remote_guide
    state: 'off'
  - action: input_text.set_value
    target:
      entity_id: input_text.tv_remote_guide_return
    data:
      value: '{% set streamer = states(''media_player.club_android_tv_10_0_0_248_club_tv'')
        %}{% if not is_state(''media_player.55_the_serif_3'', ''on'') %}off{% elif
        streamer in [''playing'', ''paused''] or state_attr(''media_player.55_the_serif_3'',
        ''source'') == ''hdmi4'' %}streamer{% else %}{{ state_attr(''media_player.55_the_serif_3'',
        ''source'') or ''streamer'' }}{% endif %}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tv_remote_guide
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.55_the_serif_3
        state: 'on'
    then:
    - action: media_player.turn_on
      target:
        entity_id: media_player.55_the_serif_3
    - wait_template: '{{ is_state(''media_player.55_the_serif_3'', ''on'') }}'
      timeout:
        seconds: 20
      continue_on_timeout: true
    - delay:
        seconds: 3
  - action: media_player.select_source
    target:
      entity_id: media_player.55_the_serif_3
    data:
      source: hdmi2
tv_remote_guide_hide:
  alias: TV remote guide · hide
  description: Takes the remote guide off the Serif and puts the TV back as script.tv_remote_guide_show
    found it (same input, or off).
  icon: mdi:remote-tv-off
  mode: single
  sequence:
  - condition: state
    entity_id: input_boolean.tv_remote_guide
    state: 'on'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tv_remote_guide
  - variables:
      back: '{{ states(''input_text.tv_remote_guide_return'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ back == ''off'' }}'
      sequence:
      - action: media_player.turn_off
        target:
          entity_id: media_player.55_the_serif_3
    - conditions:
      - condition: template
        value_template: '{{ back == ''streamer'' }}'
      sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.club_android_tv_10_0_0_248_club_tv
        data:
          command: input keyevent KEYCODE_WAKEUP; sleep 1; cmd hdmi_control onetouchplay
    - conditions:
      - condition: template
        value_template: '{{ back not in ['''', ''unknown'', ''hdmi2''] }}'
      sequence:
      - action: media_player.select_source
        target:
          entity_id: media_player.55_the_serif_3
        data:
          source: '{{ back }}'
intercom_let_in:
  alias: Intercom let in
  description: Releases the elevator, then the main door (order swapped 2026-10-25
    pending a test; relays may be labelled the wrong way round).
  icon: mdi:door-open
  mode: single
  max_exceeded: silent
  sequence:
  - action: button.press
    target:
      entity_id: button.comelit_intercom_elevator
    continue_on_error: true
  - delay:
      seconds: 2
  - action: button.press
    target:
      entity_id: button.comelit_intercom_main_door
tv_bbc_news:
  alias: TV BBC News
  description: 'Red key on the BæoRemote: Serif on, Samsung TV Plus (reopens on the
    last channel, BBC News).'
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: media_player.55_the_serif_3
      state: 'off'
    then:
    - action: media_player.turn_on
      target:
        entity_id: media_player.55_the_serif_3
    - wait_template: '{{ is_state("media_player.the_serif_qa55ls01dawxxy", "on") }}'
      timeout: 00:00:20
      continue_on_timeout: true
    - delay: 00:00:03
  - action: media_player.select_source
    target:
      entity_id: media_player.the_serif_qa55ls01dawxxy
    data:
      source: TV
blinds_travel:
  alias: Blinds travel
  description: Raises or lowers the club blinds, then stays on for their travel time
    so blinds_hold knows they are moving (cover.blinds never reports opening/closing).
  mode: single
  fields:
    direction:
      description: up or down
      example: up
  sequence:
  - if:
    - condition: template
      value_template: '{{ direction == "up" }}'
    then:
    - action: script.open_blinds
    else:
    - action: script.close_blinds
  - delay: 00:00:30
blinds_hold:
  alias: Blinds hold key
  description: 'BæoRemote hold PAGE_UP/PAGE_DOWN: starts the blinds moving, or stops
    them where they are if they are already moving.'
  mode: single
  fields:
    direction:
      description: up or down
      example: down
  sequence:
  - if:
    - condition: state
      entity_id: script.blinds_travel
      state: 'on'
    then:
    - action: cover.stop_cover
      target:
        entity_id: cover.blinds
    - action: script.turn_off
      target:
        entity_id: script.blinds_travel
    else:
    - action: script.turn_on
      target:
        entity_id: script.blinds_travel
      data:
        variables:
          direction: '{{ direction }}'
tv_open_app:
  alias: TV open app
  description: 'BæoRemote colour keys and TV tiles: wake the Streamer, open an app,
    switch the TV to it, and press OK on the app''s profile picker (iview, Plex).
    Lives in HA because the Streamer''s adb shell is cut off after ~9 s and Plex''s
    picker takes ~6 s to appear.'
  mode: restart
  icon: mdi:television-play
  fields:
    package:
      description: Android package
      example: au.net.abc.iview
      required: true
      selector:
        text: {}
    picker:
      description: Regex for the profile picker activity; empty = none
      example: ProfileSwitchActivity|AbcProfilesActivity
      selector:
        text: {}
    switch_tv:
      description: Switch the Serif to the Streamer (One Touch Play)
      default: true
      selector:
        boolean: {}
  variables:
    adb: media_player.club_android_tv_10_0_0_248_club_tv
    picker_re: '{{ picker | default('''') }}'
    do_switch: '{{ switch_tv | default(true) }}'
  sequence:
  - action: androidtv.adb_command
    target:
      entity_id: '{{ adb }}'
    data:
      command: 'dumpsys power 2>/dev/null | grep -q ''mWakefulness=Awake'' || { input
        keyevent KEYCODE_WAKEUP; sleep 1.5; }; if dumpsys activity recents 2>/dev/null
        | grep -m1 ''Recent #0'' | grep -q {{ package }}; then echo front; else monkey
        -p {{ package }} -c android.intent.category.LEANBACK_LAUNCHER 1 >/dev/null
        2>&1; echo launched; fi'
  - variables:
      launched: '{{ ''launched'' in (state_attr(adb, ''adb_response'') or '''') }}'
  - if:
    - condition: template
      value_template: '{{ do_switch }}'
    then:
    - action: androidtv.adb_command
      target:
        entity_id: '{{ adb }}'
      data:
        command: cmd hdmi_control onetouchplay
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ launched and picker_re != '''' }}'
    then:
    - repeat:
        sequence:
        - delay:
            milliseconds: 500
        - action: androidtv.adb_command
          target:
            entity_id: '{{ adb }}'
          data:
            command: if dumpsys activity activities 2>/dev/null | grep -m1 topResumedActivity
              | grep -qE '{{ picker_re }}'; then sleep 0.8; input keyevent KEYCODE_DPAD_CENTER;
              echo picked; else echo waiting; fi
        until:
        - condition: template
          value_template: '{{ ''picked'' in (state_attr(adb, ''adb_response'') or
            '''') or repeat.index >= 24 }}'
