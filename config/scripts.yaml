club_lights_club_strobe:
  alias: 'Club Lights: Club Strobe'
  icon: mdi:flash-alert
  description: 'Beat strobe in Disturbia at full impact. Saves the current look first
    so Club Lights: Restore can put it back.'
  sequence:
  - action: scene.create
    data:
      scene_id: club_lights_before_strobe
      snapshot_entities:
      - input_select.club_lights_palette
      - input_select.club_lights_mode
      - input_number.club_lights_speed
      - input_number.club_lights_intensity
      - input_number.club_lights_brightness
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.club_lights
  - action: input_select.select_option
    target:
      entity_id: input_select.club_lights_palette
    data:
      option: Disturbia
  - action: input_select.select_option
    target:
      entity_id: input_select.club_lights_mode
    data:
      option: Club Strobe
  - action: input_number.set_value
    target:
      entity_id: input_number.club_lights_speed
    data:
      value: 200
  - action: input_number.set_value
    target:
      entity_id: input_number.club_lights_intensity
    data:
      value: 150
  - action: input_number.set_value
    target:
      entity_id: input_number.club_lights_brightness
    data:
      value: 100
  - if:
    - condition: template
      value_template: '{{ is_state("media_player.club_2","playing") and "media_player.club_lights"
        not in (state_attr("media_player.club_2","group_members") or []) }}'
    then:
    - action: media_player.join
      target:
        entity_id: media_player.club_2
      data:
        group_members:
        - media_player.club_lights
      continue_on_error: true
  mode: single
