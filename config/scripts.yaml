  mode: single
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tv_ambient
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.55_the_serif_3
        state: 'on'
    then:
    - action: media_player.turn_on
      target:
        entity_id: media_player.55_the_serif_3
